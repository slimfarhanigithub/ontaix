# Bake-off candidates, GPT and Claude only. The GPT models run on EU DataZoneStandard in France
# Central (infra/terraform/azure env/dev.tfvars `foundry_eval_deployments`); Claude runs on the
# eval-only Sweden Central resource (GlobalStandard, `residency: global`) and never receives cases
# from tests/private unless --allow-global-for-private is passed. `efforts` lists the reasoning
# efforts each model accepts (`default`: none is sent); `family` groups candidates for the smart
# plan. Prices are euros per million tokens: Azure retail DataZoneStandard prices in France
# Central on 2026-09-29 for GPT (o3's are rounded by Azure, so approximate), Anthropic's USD list
# prices at 0.86 EUR per USD for Claude. Every candidate must have a price, or the run is
# refused: an unpriced model would count as 0 EUR against the budget cap. The OCR model at the end reads scanned PDFs
# before any candidate runs; it is not a candidate.
baseline:
  deployment: gpt-6-sol
  effort: none
candidates:
  - deployment: gpt-6-sol
    family: gpt
    efforts: [none, low, medium, high]
    price: {inputEurPerMTok: 2.0608, outputEurPerMTok: 10.304}
  - deployment: gpt-6-luna
    family: gpt
    efforts: [none, low, medium, high]
    price: {inputEurPerMTok: 0.103, outputEurPerMTok: 0.5152}
  - deployment: gpt-5.6-sol
    family: gpt
    efforts: [none, low, medium, high]
    price: {inputEurPerMTok: 3.7781, outputEurPerMTok: 18.8906}
