    tags: [en, text, deep-chain]
    input:
      - "Our Finance division runs accounts payable, which consists of invoice processing; invoice processing starts with invoice capture, and invoice capture produces an invoice record containing line items."
    expected:
      concepts:
        - {label: Finance division, parent: [Brevik Shipping], action: [runs, has]}
        - {label: Accounts payable, parent: [Finance division], action: [runs]}
        - {label: Invoice processing, parent: [Accounts payable], action: [consists of]}
        - {label: Invoice capture, parent: [Invoice processing], action: [starts with, includes, begins with]}
        - {label: Invoice record, parent: [Invoice capture], action: [produces, creates]}
        - {label: Line items, parent: [Invoice record], action: [contains, has]}

