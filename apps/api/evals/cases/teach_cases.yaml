        - {label: Define high-level scope, parent: [Insight], action: [has, includes, starts with], aliases: ["Define high-level scope, deliverables, skills and expected delivery dates", Define high-level scope and deliverables]}
      relations:
        - {from: Qualify the opportunity, to: "Confirm client problem/use case", action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: "Confirm client problem/use case", to: "Agree the likely Insight AI service/offering", action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: "Agree the likely Insight AI service/offering", to: Confirm client sponsor, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Confirm client sponsor, to: Engage Insight AI, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Engage Insight AI, to: Bring in the appropriate Insight AI Solutions Consultant, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Bring in the appropriate Insight AI Solutions Consultant, to: Define high-level scope, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
