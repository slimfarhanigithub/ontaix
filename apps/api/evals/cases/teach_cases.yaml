# Teach bake-off: short cases (typed turns and speech transcripts) with hand-checked gold.
#
# Format: `evals/teach_case.py` (TeachCase). Every case carries `expected`; `existing` concepts are
# seeded and approved before the case runs. Gold rules (ADR 0008): every expected label occurs in
# the input; a grouping noun that is a business concept ("3 offerings") is itself a concept with
# the members under it (`includes`); a descriptive noun ("three areas", "two ways", "regions")
# is not a concept and the members hang from the subject with the speaker's verb; drafts follow
# the list, never the stated count; facts the existing concepts already hold expect nothing, so
# re-drafting them counts as invented. A corrected item ("no wait", "sorry I meant") is never
# expected. For French cases, `action` lists the French verb first, then English equivalents.
#
# All text is original, written for Ontaix on 2026-09-29; all companies are fictional except
# `Insight`, which is the owner's own canonical example from ADR 0008. No third-party content.

cases:
  # ---------------------------------------------------------------- English, typed text
  - id: en-text-adr-owner-sentences
    kind: text
    company: Insight
    description: The owner's two ADR 0008 sentences; "these services" refers to the first turn.
    tags: [en, text, back-reference, descriptive-list, multi-turn]
    input:
      - "Insight sells services"
      - "these services are focused around three areas, app, data and AI"
    expected:
      concepts:
        - {label: Services, parent: [Insight], action: [sells, offers, provides]}
        - {label: App, parent: [Services], action: [focuses on, is focused around]}
        - {label: Data, parent: [Services], action: [focuses on, is focused around]}
        - {label: AI, parent: [Services], action: [focuses on, is focused around]}

  - id: en-text-grouping-offerings
    kind: text
    company: Northbeam Consulting
    description: The ADR's canonical grouping noun; Offerings is a concept, members under it.
    tags: [en, text, grouping, reuse]
    existing:
      - {label: Services, parent: Northbeam Consulting, action: sells, domain: sales}
    input:
      - "Services has 3 offerings, Apps, Data and AI"
    expected:
      concepts:
        - {label: Offerings, parent: [Services], action: [has]}
        - {label: Apps, parent: [Offerings], action: [includes]}
        - {label: Data, parent: [Offerings], action: [includes]}
        - {label: AI, parent: [Offerings], action: [includes]}

  - id: en-text-grouping-product-lines
    kind: text
    company: Aldwick Foods
    description: Grouping noun under the company root with a matching count of four.
    tags: [en, text, grouping]
    input:
      - "Aldwick Foods makes 4 product lines: breakfast cereals, snack bars, granola and oat drinks."
    expected:
      concepts:
        - {label: Product lines, parent: [Aldwick Foods], action: [makes, has, produces]}
        - {label: Breakfast cereals, parent: [Product lines], action: [includes]}
        - {label: Snack bars, parent: [Product lines], action: [includes]}
        - {label: Granola, parent: [Product lines], action: [includes]}
        - {label: Oat drinks, parent: [Product lines], action: [includes]}

  - id: en-text-descriptive-regions
    kind: text
    company: Kellbrook Logistics
