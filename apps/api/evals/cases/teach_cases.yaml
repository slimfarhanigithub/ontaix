    expected:
      concepts:
        - {label: Lyon plant, parent: [Ferrant Pumps], action: [runs, operates, has]}
        - {label: Assembly hall, parent: [Lyon plant], action: [has]}
        - {label: Line 4, parent: [Assembly hall], action: [holds, has, contains]}
        - {label: Torque station, parent: [Line 4], action: [has, holds, contains, includes]}
        - {label: Calibrated wrench, parent: [Torque station], action: [uses]}

  - id: en-text-chain-six-levels
    kind: text
