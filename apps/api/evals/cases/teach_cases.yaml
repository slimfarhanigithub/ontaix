        - {label: Midlands, parent: [Warehouses], action: [is spread across, is located in, operates in, covers]}
        - {label: Scotland, parent: [Warehouses], action: [is spread across, is located in, operates in, covers]}
        - {label: Wales, parent: [Warehouses], action: [is spread across, is located in, operates in, covers]}

  - id: en-text-descriptive-count-mismatch
    kind: text
