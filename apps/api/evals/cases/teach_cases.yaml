  # ---------------------------------------------------------------- Role patterns
  # "X is a client (customer, partner, supplier, vendor) of Y" and "X is a subsidiary (division)
  # of Y": Y has the role concept (Client, Partner, ...), the role concept includes X, and what the
  # relative clause ("that", "which", "qui") says hangs from X, the subject, not from Y. The
  # owner's ADNOC case fixes the shape; labels with inner punctuation (L&S, R&D, S.A., AT&T,
  # e-commerce) stay whole.
  - id: en-text-owner-adnoc-client
    kind: text
    company: Insight
    description: The owner's real case; "that" refers to ADNOC, not Insight; L&S keeps its ampersand.
    tags: [en, text, role-pattern, grouping, relative-clause, inner-punctuation, owner]
    input:
      - "ADNOC is a client of insight that has multiple subsidiaries including L&S, Gas, Sour Gas, Offshore, Onshore, XRG and Drilling"
    expected:
      concepts:
        - {label: Client, parent: [Insight], action: [has, serves]}
        - {label: ADNOC, parent: [Client], action: [includes, has]}
        - {label: Subsidiaries, parent: [ADNOC], action: [has, owns]}
        - {label: L&S, parent: [Subsidiaries], action: [includes]}
        - {label: Gas, parent: [Subsidiaries], action: [includes]}
        - {label: Sour Gas, parent: [Subsidiaries], action: [includes]}
        - {label: Offshore, parent: [Subsidiaries], action: [includes]}
        - {label: Onshore, parent: [Subsidiaries], action: [includes]}
        - {label: XRG, parent: [Subsidiaries], action: [includes]}
        - {label: Drilling, parent: [Subsidiaries], action: [includes]}

  - id: en-speech-owner-adnoc-client
    kind: speech
    company: Insight
    description: The owner's ADNOC case spoken, without punctuation, with fillers.
    tags: [en, speech, role-pattern, grouping, relative-clause, inner-punctuation, fillers, owner]
    input: "so um ADNOC is a client of insight uh that has multiple subsidiaries including L&S gas sour gas offshore onshore XRG and drilling"
    expected:
      concepts:
        - {label: Client, parent: [Insight], action: [has, serves]}
        - {label: ADNOC, parent: [Client], action: [includes, has]}
        - {label: Subsidiaries, parent: [ADNOC], action: [has, owns]}
        - {label: L&S, parent: [Subsidiaries], action: [includes]}
        - {label: Gas, parent: [Subsidiaries], action: [includes]}
        - {label: Sour Gas, parent: [Subsidiaries], action: [includes]}
        - {label: Offshore, parent: [Subsidiaries], action: [includes]}
        - {label: Onshore, parent: [Subsidiaries], action: [includes]}
        - {label: XRG, parent: [Subsidiaries], action: [includes]}
        - {label: Drilling, parent: [Subsidiaries], action: [includes]}

