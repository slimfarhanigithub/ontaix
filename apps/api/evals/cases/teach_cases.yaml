    tags: [en, text, cross-domain, reuse]
    existing:
      - {label: Sales order, parent: Ferrant Pumps, action: receives, domain: sales}
      - {label: Production order, parent: Ferrant Pumps, action: releases, domain: production}
      - {label: Shipment, parent: Ferrant Pumps, action: sends, domain: logistics}
    input:
      - "A sales order triggers a production order, and the shipment waits for that production order."
    expected:
      concepts: []
      relations:
        - {from: Sales order, to: Production order, action: [triggers, creates], inverse: [is triggered by]}
        - {from: Shipment, to: Production order, action: [waits for, depends on], inverse: [precedes, is needed by]}

  - id: en-text-chain-five-levels
    kind: text
    company: Ferrant Pumps
