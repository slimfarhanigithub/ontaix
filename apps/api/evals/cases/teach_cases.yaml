        - {label: Gas boiler, parent: [Heating system], action: [is a]}

  - id: en-text-cross-domain-quality-finance
    kind: text
    company: Ferrant Pumps
    description: Relations between existing concepts of quality, finance and supply; "it" refers back.
    tags: [en, text, cross-domain, reuse, back-reference, multi-turn]
    existing:
      - {label: Supplier, parent: Ferrant Pumps, action: buys from, domain: supply}
      - {label: Non-conformity, parent: Ferrant Pumps, action: records, domain: quality}
      - {label: Payment, parent: Ferrant Pumps, action: makes, domain: finance}
    input:
      - "A non-conformity blocks the payment until it is closed."
      - "Every non-conformity is raised against a supplier."
    expected:
      concepts: []
      relations:
        - {from: Non-conformity, to: Payment, action: [blocks, holds], inverse: [is blocked by]}
        - {from: Non-conformity, to: Supplier, action: [is raised against, concerns], inverse: [receives, has]}

  - id: en-text-cross-domain-order-flow
    kind: text
