  - id: en-text-owner-live-sales-steps
    kind: text
    company: Insight
    description: The owner's typed sales process on gpt-6-sol; ten steps joined by arrows are siblings under the company, ordered by precedes, never nested.
    tags: [en, text, sequence, owner]
    input:
      - "Qualify → Engage Insight AI → Create Salesforce Opp → Scope & Resource → Create WO/SoW → Internal Approval → Client Review → Signature/PO → Closed Won → Delivery Handover"
    expected:
      concepts:
        - {label: Qualify, parent: [Insight], action: [has, includes, starts with]}
        - {label: Engage Insight AI, parent: [Insight], action: [has, includes, starts with]}
        - {label: Create Salesforce Opp, parent: [Insight], action: [has, includes, starts with]}
        - {label: "Scope & Resource", parent: [Insight], action: [has, includes, starts with]}
        - {label: "Create WO/SoW", parent: [Insight], action: [has, includes, starts with]}
        - {label: Internal Approval, parent: [Insight], action: [has, includes, starts with]}
        - {label: Client Review, parent: [Insight], action: [has, includes, starts with]}
        - {label: "Signature/PO", parent: [Insight], action: [has, includes, starts with]}
        - {label: Closed Won, parent: [Insight], action: [has, includes, starts with]}
        - {label: Delivery Handover, parent: [Insight], action: [has, includes, starts with]}
      relations:
        - {from: Qualify, to: Engage Insight AI, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Engage Insight AI, to: Create Salesforce Opp, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Create Salesforce Opp, to: "Scope & Resource", action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: "Scope & Resource", to: "Create WO/SoW", action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: "Create WO/SoW", to: Internal Approval, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Internal Approval, to: Client Review, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Client Review, to: "Signature/PO", action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: "Signature/PO", to: Closed Won, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}
        - {from: Closed Won, to: Delivery Handover, action: [precedes, comes before, is followed by], inverse: [follows, comes after]}

  - id: en-text-owner-live-long-steps
