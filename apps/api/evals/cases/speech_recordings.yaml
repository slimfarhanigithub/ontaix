# Teach bake-off: spoken recordings, sentence by sentence, for tuning speech comprehension.
#
# Format: `evals/teach_case.py` (TeachCase), the same as `teach_cases.yaml`. Each `input` item is
# one finished spoken sentence, sent in order in one session as the Studio microphone sends it.
# `expected.attributes` lists taught attributes ("billed monthly") by concept and accepted value.
#
# - `en-speech-owner-financial-services` is the owner's own recording, word for word, and
#   `en-speech-owner-live-employees`, `en-speech-owner-live-amdaris`,
#   `en-speech-owner-live-inside-sales` and `en-speech-owner-live-skills` the owner's own
#   sentences from live use on gpt-6-sol.
# - The `narration` cases retell sections of the public benchmarks in evals/benchmarks as natural
#   speech with fillers, back-references and multi-level drill-down. Their labels are the
#   benchmark's class names; the gold follows the tree the narration states, with the
#   benchmark's own property names among the accepted verbs.
# - The learn/test assignment of every case is in app/ai/examples/split.json: the org, ssn and
#   valueflows narrations are TEST; the owner's recording and live sentences, the goodrelations,
#   prov-o and dcat narrations and the two other recordings are LEARN.
#
# All narration text is original, written for Ontaix on 2026-09-30.

cases:
  # ---------------------------------------------------------------- LEARN: the owner's recording
  - id: en-speech-owner-financial-services
    kind: speech
    company: Insight
    description: The owner's recording; back-references, a level jump to ADNOC and its subsidiaries, and billing attributes.
    tags: [en, speech, recording, back-reference, deep-chain, attribute, role-pattern, fillers, owner]
    input:
      - "Insight sells financial services to its customers"
      - "these services are split in advisory and um managed services"
      - "the managed ones are billed monthly"
      - "advisory is billed per day"
      - "ADNOC buys them both"
      - "its subsidiaries XRG and Drilling buy advisory"
    expected:
      concepts:
        - {label: Financial services, parent: [Insight], action: [sells, offers, provides]}
        - {label: Customers, parent: [Insight, Financial services], action: [has, serves, sells to, is sold to, sold to, buys]}
        - {label: Advisory, parent: [Financial services], action: [is split in, is split into, includes, has]}
        - {label: Managed services, parent: [Financial services], action: [is split in, is split into, includes, has]}
        - {label: ADNOC, parent: [Customers, Advisory, Managed services], action: [buys, includes, has]}
        - {label: Subsidiaries, parent: [ADNOC], action: [has, owns]}
        - {label: XRG, parent: [Subsidiaries], action: [includes, has]}
        - {label: Drilling, parent: [Subsidiaries], action: [includes, has]}
      relations:
        - {from: Financial services, to: Customers, action: [is sold to, sold to], inverse: [buys, purchases]}
        - {from: ADNOC, to: Advisory, action: [buys], inverse: [is bought by]}
        - {from: ADNOC, to: Managed services, action: [buys], inverse: [is bought by]}
        - {from: XRG, to: Advisory, action: [buys], inverse: [is bought by]}
        - {from: Drilling, to: Advisory, action: [buys], inverse: [is bought by]}
      attributes:
        - {concept: Managed services, value: [monthly]}
        - {concept: Advisory, value: [per day, daily]}
    optional: [Customer]

  - id: en-speech-owner-live-employees
