  # ---------------------------------------------------------------- TEST
  - id: en-speech-narration-valueflows-processes
    kind: speech
    company: ValueFlows
    description: The ValueFlows process pattern retold as speech; inputs and outputs, plans, fulfilment and agents.
    tags: [en, speech, recording, narration, benchmark, back-reference, deep-chain, is-a, fillers]
    input:
      - "okay so um ValueFlows is basically built around processes and economic resources"
      - "a process has inputs and outputs and uh those are all economic events"
      - "each economic event has an action and it affects an economic resource"
      - "the resources they conform to a resource specification"
      - "and a process is based on a process specification"
      - "processes are planned within a plan and uh the plan includes commitments and intents"
      - "an economic event fulfills a commitment"
      - "and agents so persons and organizations they provide and receive the events"
    expected:
      concepts:
        - {label: Process, parent: [ValueFlows], action: [is built around, has, includes, models, covers]}
        - {label: Economic Resource, parent: [ValueFlows], action: [is built around, has, includes, models, covers]}
        - {label: Economic Event, parent: [Process, ValueFlows], action: [has input, has output, has, is, input of, output of, includes]}
        - {label: Action, parent: [Economic Event], action: [has, action]}
        - {label: Resource Specification, parent: [Economic Resource], action: [conforms to]}
        - {label: Process Specification, parent: [Process], action: [is based on, based on]}
        - {label: Plan, parent: [Process, ValueFlows], action: [is planned within, planned within, has, includes]}
        - {label: Commitment, parent: [Plan], action: [includes, plan includes, has]}
        - {label: Intent, parent: [Plan], action: [includes, plan includes, has]}
        - {label: Agent, parent: [ValueFlows, Economic Event], action: [has, provides, receives, provides and receives, includes]}
        - {label: Person, parent: [Agent], action: [is a, includes, has]}
        - {label: Organization, parent: [Agent], action: [is a, includes, has]}
      relations:
        - {from: Economic Event, to: Economic Resource, action: [affects], inverse: [is affected by]}
        - {from: Economic Event, to: Commitment, action: [fulfills, fulfils], inverse: [is fulfilled by]}
        - {from: Agent, to: Economic Event, action: [provides, receives, provides and receives], inverse: [provider, receiver, has provider, has receiver, is provided by, is received by]}
    optional: [Inputs, Outputs, Input, Output, Input/Output]

  - id: en-speech-narration-org-structure
    kind: speech
    company: Org Ontology
    description: The W3C Organization Ontology retold as speech; is-a chains, units, sites, posts and memberships.
    tags: [en, speech, recording, narration, benchmark, back-reference, deep-chain, is-a, fillers]
    input:
      - "right so the org ontology is about organizations um and the agents that work in them"
      - "a formal organization is a kind of organization and uh a business entity is a kind of formal organization"
      - "formal organizations have organizational units"
      - "an organization also has sites and one of them is its primary site"
      - "it has posts too and each post is held by an agent"
      - "and um the organization has memberships and each membership has a role"
      - "so basically an agent is a member of an organization"
    expected:
      concepts:
        - {label: Organization, parent: [Org Ontology], action: [is about, has, covers, includes, describes]}
        - {label: Agent, parent: [Org Ontology, Organization], action: [is about, has, covers, includes, describes, has member]}
        - {label: Formal Organization, parent: [Organization], action: [is a]}
        - {label: Business Entity, parent: [Formal Organization], action: [is a]}
        - {label: OrganizationalUnit, parent: [Formal Organization], action: [has, has unit], aliases: [Organizational unit]}
        - {label: Site, parent: [Organization], action: [has, has site]}
        - {label: Post, parent: [Organization], action: [has, post]}
        - {label: Membership, parent: [Organization], action: [has, membership]}
        - {label: Role, parent: [Membership], action: [has, role]}
      relations:
        - {from: Post, to: Agent, action: [is held by, held by], inverse: [holds]}
        - {from: Agent, to: Organization, action: [is a member of, member of, is member of], inverse: [has member, has]}
    optional: [Primary site]

