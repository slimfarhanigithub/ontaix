    input:
      - "okay so the sensor network ontology um is about systems observations and features of interest"
      - "there are three kinds of systems sensors actuators and samplers"
      - "a sensor observes an observable property and uh it makes observations"
      - "each observation has a result and it's about a feature of interest"
      - "the feature of interest has properties and um observable properties are one kind of property"
      - "systems are hosted by platforms and a platform is used in a deployment"
      - "and each system implements a procedure"
    expected:
      concepts:
        - {label: System, parent: [Sensor Network Ontology], action: [is about, has, covers, includes]}
        - {label: Observation, parent: [Sensor Network Ontology], action: [is about, has, covers, includes]}
        - {label: Feature Of Interest, parent: [Sensor Network Ontology], action: [is about, has, covers, includes]}
        - {label: Sensor, parent: [System], action: [is a, includes, has]}
        - {label: Actuator, parent: [System], action: [is a, includes, has]}
        - {label: Sampler, parent: [System], action: [is a, includes, has]}
        - {label: Observable Property, parent: [Sensor], action: [observes]}
        - {label: Result, parent: [Observation], action: [has, has result]}
        - {label: Property, parent: [Feature Of Interest], action: [has, has property]}
        - {label: Platform, parent: [System], action: [is hosted by, hosted by]}
        - {label: Deployment, parent: [Platform], action: [is used in, in deployment, has, is deployed in]}
        - {label: Procedure, parent: [System], action: [implements]}
      relations:
        - {from: Sensor, to: Observation, action: [makes, made observation], inverse: [made by sensor, is made by]}
        - {from: Observation, to: Feature Of Interest, action: [is about, has feature of interest, has], inverse: []}
        - {from: Observable Property, to: Property, action: [is a], inverse: []}
    optional: [Kinds]

