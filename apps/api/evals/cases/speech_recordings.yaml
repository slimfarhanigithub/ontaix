    tags: [en, speech, recording, back-reference, sub-groups, is-a, owner]
    existing:
      - {label: Employees, parent: Insight, action: has, domain: people}
    input:
      - "these employees can be consultants and can be in sales"
      - "the consultants offer services for customers"
      - "these services can be around AI data and apps"
    expected:
      concepts:
        - {label: Consultants, parent: [Employees], action: [is a]}
        - {label: Sales, parent: [Employees], action: [includes, can be in]}
        - {label: Services, parent: [Consultants], action: [offers, offer, provides]}
        - {label: Customers, parent: [Services], action: [for, is for, is offered for, is offered to, offered to, serves]}
        - {label: AI, parent: [Services], action: [includes, can be, can be around]}
        - {label: Data, parent: [Services], action: [includes, can be, can be around]}
        - {label: Apps, parent: [Services], action: [includes, can be, can be around]}
      relations:
        - {from: Consultants, to: Services, action: [offers, offer, provides], inverse: [is offered by]}
        - {from: Services, to: Customers, action: [for, is for, is offered for, is offered to, offered to, serves], inverse: []}
