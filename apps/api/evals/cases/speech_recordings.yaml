  - id: en-speech-narration-prov-o-starting-points
    kind: speech
    company: Provenance Ontology
    description: PROV-O retold as speech; the three starting points, their relations, agent kinds, entity kinds and qualified associations.
    tags: [en, speech, recording, narration, benchmark, back-reference, deep-chain, is-a, descriptive-list, fillers]
    input:
      - "um so the provenance ontology has three starting points entities activities and agents"
      - "an activity uses entities and uh it generates entities too"
      - "an entity is attributed to an agent"
      - "and agents are persons organizations or software agents"
      - "a plan is a kind of entity and so is a collection and an empty collection is a kind of collection"
      - "each activity has an association and the association has a role"
      - "oh and revisions and quotations they're both kinds of derivation"
    expected:
      concepts:
        - {label: Entity, parent: [Provenance Ontology], action: [has, includes]}
        - {label: Activity, parent: [Provenance Ontology], action: [has, includes]}
        - {label: Agent, parent: [Provenance Ontology], action: [has, includes]}
        - {label: Person, parent: [Agent], action: [is a, includes, has]}
        - {label: Organization, parent: [Agent], action: [is a, includes, has]}
        - {label: SoftwareAgent, parent: [Agent], action: [is a, includes, has], aliases: [Software agent]}
        - {label: Plan, parent: [Entity], action: [is a]}
        - {label: Collection, parent: [Entity], action: [is a]}
        - {label: EmptyCollection, parent: [Collection], action: [is a], aliases: [Empty collection]}
        - {label: Association, parent: [Activity], action: [has, qualified association]}
        - {label: Role, parent: [Association], action: [has, had role]}
        - {label: Derivation, parent: [Provenance Ontology], action: [has]}
        - {label: Revision, parent: [Derivation], action: [is a]}
        - {label: Quotation, parent: [Derivation], action: [is a]}
      relations:
        - {from: Activity, to: Entity, action: [uses, used], inverse: [was used by]}
        - {from: Activity, to: Entity, action: [generates, generated], inverse: [was generated by]}
        - {from: Entity, to: Agent, action: [is attributed to, was attributed to], inverse: []}
    optional: [Starting points]

