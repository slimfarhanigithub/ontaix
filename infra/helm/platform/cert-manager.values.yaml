# cert-manager: issues and renews the public certificate from Let's Encrypt (HTTP-01 through
# ingress-nginx). The CRDs are installed and kept by the chart.
crds:
  enabled: true
  keep: true
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  # AKS Admissions Enforcer rewrites the namespaceSelector of every webhook configuration to
  # keep its system namespaces out; the chart sets that field too, and the two owners conflict
  # on upgrade. The annotation makes the enforcer leave these configurations alone: the
  # webhook only intercepts cert-manager.io resources.
  mutatingWebhookConfigurationAnnotations:
    admissions.enforcer/disabled: "true"
  validatingWebhookConfigurationAnnotations:
    admissions.enforcer/disabled: "true"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
