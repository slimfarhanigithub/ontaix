apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontaix.gateway.name" . }}
  labels:
    {{- include "ontaix.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "ontaix.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ontaix.selectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "ontaix.image" (dict "root" . "image" .Values.gateway.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: ONTAIX_API_BASE_URL
              value: {{ printf "http://%s:%d" (include "ontaix.api.name" .) (int .Values.api.port) | quote }}
            {{- range $name, $value := .Values.gateway.env }}
            - name: {{ $name }}
              value: {{ toString $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
