# The Studio's server: static files, the health route, and /api forwarded to the API service so
# the Studio and the API share one origin (the session cookie is host-only). The security headers
# apply to every response this server sends; HSTS is added by the TLS-terminating ingress.
server {
    listen {{ .Values.studio.port }};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "{{ include "ontaix.contentSecurityPolicy" . }}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://{{ include "ontaix.api.name" . }}:{{ .Values.api.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout {{ .Values.studio.proxyReadTimeoutSeconds }}s;
        proxy_send_timeout {{ .Values.studio.proxyReadTimeoutSeconds }}s;
        client_max_body_size {{ .Values.studio.proxyBodySize }};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
