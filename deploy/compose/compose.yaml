# Local stack: Postgres, API, gateway, Studio. Copy .env.example to .env in this folder first.
#   docker compose -f deploy/compose/compose.yaml up --build

name: ontaix

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ../../apps/api
    environment:
      ONTAIX_ENVIRONMENT: ${ONTAIX_ENVIRONMENT:-dev}
      ONTAIX_LOG_LEVEL: ${ONTAIX_LOG_LEVEL:-INFO}
      ONTAIX_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway:
    build:
      context: ../../apps/gateway
    environment:
      ONTAIX_ENVIRONMENT: ${ONTAIX_ENVIRONMENT:-dev}
      ONTAIX_LOG_LEVEL: ${ONTAIX_LOG_LEVEL:-INFO}
      ONTAIX_API_BASE_URL: http://api:8000
    ports:
      - "8100:8100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz').status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  studio:
    build:
      context: ../..
      dockerfile: apps/studio/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
