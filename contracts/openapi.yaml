          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Proposals]
      summary: Create one proposal from a typed draft
      description: The generic entry used by the teach bar (typed text or a speech transcript), document import and the MCP gateway. Same refusals as the resource endpoints, plus `409 channel_disabled` for a `speech` draft while `voice` is off or an `importRef` draft while `importDocs` is off. An `importRef` sentence may be drafted by one successful call only (`409 import_sentence_used` otherwise); `404` for an import of another tenant or actor, `410 import_expired` past its expiry.
      operationId: createProposal
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDraft'
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/batch:
    post:
      tags: [Proposals]
      summary: Create several proposals in order
      description: Drafts are created in array order in one transaction so that later drafts can depend on labels introduced by earlier ones. Any refusal fails the whole batch, including `409 channel_disabled` for a `speech` draft while `voice` is off or an `importRef` draft while `importDocs` is off. Drafts citing an import are charged like every other draft, one proposal unit per draft at this call; the import prepays parse units only. Each import sentence may be drafted by one successful call only (`409 import_sentence_used` otherwise); `404` for an import of another tenant or actor, `410 import_expired` past its expiry.
      operationId: createProposalBatch
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drafts]
              properties:
                origin:
                  $ref: '#/components/schemas/InputOrigin'
                importRef:
                  $ref: '#/components/schemas/ImportRef'
                drafts:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: A draft's own `origin` and `importRef` win over the batch-level values, which apply to every draft that sets none.
                  items:
                    $ref: '#/components/schemas/ProposalDraft'
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: The created proposals in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/approve-all:
    post:
      tags: [Proposals]
      summary: Approve every ready proposal, repeatedly
      description: Acts only on proposals the caller may approve under ADR 0003 check points 2 to 4; proposals outside the caller's scope are skipped and counted in `remaining`. Loops while any proposal in scope is ready, at most 200 rounds. Events emitted carry `bulk` set to true.
      operationId: approveAllProposals
      x-ontaix-permission: proposal.approve
      responses:
        '200':
          description: What was approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/reject-all:
    post:
      tags: [Proposals]
      summary: Reject every open proposal in the caller's scope
      description: Acts only on proposals the caller may reject under ADR 0003 check points 2 to 4; proposals outside the caller's scope are skipped and counted in `remaining`.
      operationId: rejectAllProposals
      x-ontaix-permission: proposal.reject
      responses:
        '200':
          description: What was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [Proposals]
      summary: Get one proposal with its readiness
      operationId: getProposal
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals/{proposalId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Approve a proposal
      description: Requires Owner in scope or Governor in an enclosing scope. Refused when not ready (`409 proposal_not_ready`). When `twoApprovers` is on and the type is `change`, the proposal moves to `half_approved` and needs `second-approve` by a different user; calling this endpoint on a `half_approved` proposal behaves as `second-approve`. Otherwise it is applied - pending cleared, domain revision incremented, audit entry written, events emitted. A `rename` or `rename_source` re-checks label uniqueness at approval and is refused with `409 duplicate_label` when the label was taken meanwhile.
      operationId: approveProposal
      x-ontaix-permission: proposal.approve
      responses:
        '200':
          description: The result, including the artefacts that changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/second-approve:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Give the second approval on a half-approved change
      description: Requires Governor or Owner in scope and a different user from the first approver (`409 same_approver`). Refused unless the state is `half_approved` (`409 proposal_not_half_approved`).
      operationId: secondApproveProposal
      x-ontaix-permission: proposal.second_approve
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Reject a proposal and cascade
      description: Marks the proposal rejected, its concept dying and removes its pending relations, bindings or attribute. Every open proposal whose concept descends from the rejected concept, or whose relation touches it, is rejected in the same transaction and listed in `cascaded`.
      operationId: rejectProposal
      x-ontaix-permission: proposal.reject
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------- Teach
  /teach/parse:
    post:
      tags: [Teach]
      summary: Parse a sentence into intents and proposal drafts
      description: Writes nothing to the model. Runs the rule-based grammar (domain prefix, specialisation patterns, verb lexicon, list splitting, passives) against the company's current labels and returns the intents, the drafts the client may submit to `POST /proposals/batch`, and the caption outcome (`understood`, `partly_understood`, `not_understood`). No ontology row is written. The sentence comes from one of the three entry paths - `text` typed in the teach bar, `text` holding a speech transcript (the Studio transcribes the microphone and sends the final transcript, so speech has no endpoint of its own), or `importRef` citing a stored sentence of a document import, whose text the server reads from the import. Every path is parsed the same way. A call with `importRef` increments that sentence's parse counter, and a sentence may be parsed at most 3 times (`409 import_sentence_used` after that). A call with `importRef` spends no parse unit, because the import charged one per sentence; a call with `text` spends one parse unit. Refusals - `409 channel_disabled` when `text` is sent while the `liveTeaching` setting is off, when `origin` is `speech` while the `voice` setting is off, or when `importRef` is sent while the `importDocs` setting is off. `origin` is declared by the client, so the `voice` check stops only honest clients; the Studio also hides the microphone when `voice` is off. `404` for an import of another tenant or actor, `410 import_expired` past its expiry.


        Language model fallback (ADR 0008). The rule-based grammar always runs first. A language model extraction step runs afterwards only when at least one trigger holds - the rules understand nothing (`not_understood`) or only part of the sentence (`partly_understood`); the sentence holds a back-reference word (`these`, `those`, `it`, `they`, `them`, `this`) as a whole word; the sentence holds a list preamble (a count word `two` to `twelve` or a number, then one to three words, then `,` or `:`, as in `three areas, app, data and AI`); or the sentence holds a verb form that is not a variant of the reference lexicon (checked against a verb word list shipped with the API, which never changes the lexicon). The model receives the sentence, the session's recent turns, the company name, up to 200 candidate concepts of the company and the domain templates, and returns intents only; the server validates them against `contracts/teach-extraction.schema.json` and turns them into drafts with the same rules as the grammar. Nothing the model returns is written - it becomes drafts the client submits as proposals for a human to approve. When the model output is invalid, or the step fails or is skipped, no model draft is returned and the whole sentence is listed in `unresolved` with the reason. When a back-reference, list preamble or unknown verb triggered the step and the model answered validly, its intents replace the grammar's; when only `partly_understood` triggered it, the grammar's intents are kept and the model's are added after removing duplicates. Each call to the model spends one unit of the caller's `llm` budget (hourly, per user or agent) and reserves tokens from the tenant's `llmMonthlyTokenCap`; either being exhausted skips the step. A skipped, failed, timed-out (15 seconds at most) or invalid model step never fails the request - the response is `200` with the grammar's result, `extractor` `rules`, `degraded` true and `llmOutcome` saying why. The model is configured per deployment (provider and model name); no provider name, key or model name appears in this API.
      operationId: parseTeach
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              oneOf:
                - required: [text]
                - required: [importRef]
              properties:
                companyId:
                  type: string
                  format: uuid
                text:
                  type: string
                  minLength: 1
                  maxLength: 400
                  description: Typed text or a speech transcript. Not sent with `importRef`.
                origin:
                  $ref: '#/components/schemas/InputOrigin'
                importRef:
                  $ref: '#/components/schemas/ImportRef'
                sessionId:
                  type: string
                  format: uuid
                  description: Generated by the client once per teach bar session (a new one when the Studio loads or the company changes) and sent with every sentence of that session, so the model step can resolve back-references such as `these services`. The server keeps the last 8 sentences of a session with the concepts each one referenced or introduced, keyed by tenant, caller, company and session; each sentence is kept for 2 hours. A session is readable only by the caller that created it, in the same tenant and company; an unknown or expired `sessionId` starts an empty session and is never an error. Without `sessionId` the sentence is parsed with no history.
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teach/suggest:
    get:
      tags: [Teach]
      summary: Suggest an action between a subject and an object
      description: Pure. Order - the subject's own actions toward the object's domain, then the subject-name table, then the object-name table, then the subject's most common action, then the object's most common incoming action, then `relates to`. The suggestion is never submitted by itself.
      operationId: suggestAction
      x-ontaix-permission: model.read
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: subjectLabel
          in: query
          description: Used when the subject does not exist yet (new-concept box).
          schema:
            type: string
        - name: objectId
          in: query
          schema:
            type: string
            format: uuid
        - name: objectLabel
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The suggested action.
          content:
            application/json:
              schema:
                type: object
                required: [action, rule]
                properties:
                  action:
                    type: string
                  rule:
                    type: string
                    enum: [most_common_in_domain, does, done_to, most_common_out, most_common_in, default]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /import/sentences:
    post:
      tags: [Teach]
      summary: Extract sentences from a document
      description: The only place documents are read - the Studio never extracts text itself and loads nothing from a CDN. Accepts at most 10 MiB with media type `text/plain`, `text/markdown`, `text/csv`, `application/json`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document` or `application/pdf`; anything else is `415`. Splits on sentence punctuation or newlines and keeps sentences of 13 to 399 characters. Limits - at most 2,000,000 characters of extracted text and at most 2,000 sentences; DOCX is read with no DTD and no entity expansion and at most 1,000 archive members, PDF at most 2,000 pages, and decompression stops at the extracted-text limit. Past any limit the import is refused as a whole with `413 payload_too_large` and nothing is stored. Rate limit - one import unit is charged from the per-user or per-agent import budget before the upload is read, and the call is refused with `429 rate_limited` when that budget is empty; the unit is spent even when extraction finds no sentence. After extraction one parse unit per sentence is charged, taken before anything is stored; when the parse budget cannot cover every sentence the import is refused as a whole with `429 rate_limited` and nothing is stored. The parse budget allows at least 2,000 units per hour, so the largest document fits. Proposals created from the sentences are charged per draft when they are created. Refused with `409 channel_disabled` when the `importDocs` setting is off, and with `422 validation_failed` when the file name, after its directory part is stripped, is empty, longer than 255 characters or 1020 bytes, or holds a refused character; a file name is refused, never rewritten. Stores one `document_import` row (tenant, actor, file name, media type, SHA-256 of the file, extracted sentences with their positions) that expires one hour after creation, and returns its `importId` and the sentences. The client teaches sentence by sentence, citing each as `importRef` (`importId`, `sentenceIndex`); the import is usable only by the actor that created it, in its tenant. Expired imports answer `410 import_expired` until the purge deletes them 24 hours after expiry, then `404`.
      operationId: importSentences
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The sentences in document order.
          content:
            application/json:
              schema:
                type: object
                required: [importId, expiresAt, fileName, sentences, origin, originDetail]
                properties:
                  importId:
                    $ref: '#/components/schemas/Id'
                  expiresAt:
                    type: string
                    format: date-time
                  fileName:
                    type: string
                    pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
                    maxLength: 255
                    description: The basename of the uploaded file name, the same value as `originDetail.fileName`.
                  origin:
                    type: string
                    const: document
                  originDetail:
                    type: object
                    additionalProperties: false
                    required: [fileName, mediaType]
                    description: File name and media type of the import; each proposal's `originDetail` adds `sentenceIndex` and `position`.
                    properties:
                      fileName:
                        type: string
                        maxLength: 255
                        pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
                      mediaType:
                        type: string
                        enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf]
                  sentences:
                    type: array
                    maxItems: 2000
                    items:
                      type: string
                  positions:
                    type: array
                    maxItems: 2000
                    description: Present when extraction knows where sentences are; same length and order as `sentences`, null where unknown. The server copies a sentence's position into the proposal; the client never sends it.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/DocumentPosition'
                        - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'

