          $ref: '#/components/schemas/Seed'

    BindingRow:
      type: object
      required: [concept, binding, approvedAttributes, pendingAttributes, state]
      properties:
        concept:
          $ref: '#/components/schemas/Concept'
        binding:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        approvedAttributes:
          type: integer
        pendingAttributes:
          type: integer
        state:
          type: string
          enum: [bound, no data]

    Attribute:
      type: object
      required: [id, conceptId, name, type, col, fill, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conceptId:
          $ref: '#/components/schemas/Id'
        sourceId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: [string, 'null']
          description: Source column path, for example `sap.mara.matnr`; null for a taught attribute.
        fill:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Null for a taught attribute.
        value:
          type: [string, 'null']
          maxLength: 200
          description: A taught attribute's value (decision row 130); null for an attribute read from a source. Rendered as text.
        state:
          type: string
          enum: [proposed, approved]

    AttributeDraft:
      type: object
      description: An attribute on a concept, of one of two kinds. Read from a bound source - `sourceId`, `col` and `fill`, as the reference proposes discovered attributes. Taught - a `value` stated by a person (teach extraction's `attr` intent, decision row 130), with no `col` or `fill`. The concept is given by id, or by `conceptLabel` and `companyId` when it is introduced by an earlier draft of the same batch.
      required: [type, name, attributeType]
      allOf:
        - oneOf:
            - required: [conceptId]
            - required: [conceptLabel, companyId]
        - oneOf:
            - required: [col, fill]
              not:
                required: [value]
            - required: [value]
              not:
                anyOf:
                  - required: [col]
                  - required: [fill]
                  - required: [sourceId]
      properties:
        type:
          type: string
          const: attr
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        conceptId:
          $ref: '#/components/schemas/Id'
        conceptLabel:
          type: string
          minLength: 1
          maxLength: 120
          description: Alternative to `conceptId` for a concept introduced by an earlier draft of the same batch.
        companyId:
          $ref: '#/components/schemas/Id'
        sourceId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 80
        attributeType:
          type: string
          enum: [id, text, number, ref, date]
          description: A taught attribute is `text`, `number` or `date`.
        col:
          type: string
          maxLength: 200
        fill:
          type: integer
          minimum: 0
          maximum: 100
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: A taught attribute's value as stated, for example `monthly` or `per day`. Plain text, HTML-escaped wherever the server interpolates it and rendered as text.

    ChangeDraft:
      type: object
      description: A change to something already approved. `changeKind` selects which fields of `payload` apply.
      required: [type, changeKind, payload]
      properties:
        type:
          type: string
          const: change
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        changeKind:
          type: string
          enum: [rename, delete_concept, edit_relation, remove_relation, unbind, rename_source, remove_source, remove_company, resolve_conflict, create_domain, edit_domain, delete_domain, move_concept_domain, delete_bulk]
        payload:
          type: object
          properties:
            conceptId:
              $ref: '#/components/schemas/Id'
            newLabel:
              type: string
              minLength: 1
              maxLength: 120
            relationId:
              $ref: '#/components/schemas/Id'
            action:
              type: string
              minLength: 1
              maxLength: 60
            reverse:
              type: boolean
            bindingId:
              $ref: '#/components/schemas/Id'
            sourceId:
              $ref: '#/components/schemas/Id'
            companyId:
              $ref: '#/components/schemas/Id'
            conflictConceptIds:
              type: array
              minItems: 2
              maxItems: 2
              items:
                $ref: '#/components/schemas/Id'
            domainKey:
              $ref: '#/components/schemas/DomainKey'
            domainProductId:
              $ref: '#/components/schemas/Id'
            name:
              type: string
              minLength: 1
              maxLength: 60
            color:
              $ref: '#/components/schemas/Hex'
            owner:
              type: string
              maxLength: 60
            conceptIds:
              type: array
              maxItems: 200
              uniqueItems: true
              items:
                $ref: '#/components/schemas/Id'
            domainProductIds:
              type: array
              maxItems: 20
              uniqueItems: true
              items:
                $ref: '#/components/schemas/Id'
        caption:
          type: string
          maxLength: 300

    ProposalDraft:
      oneOf:
        - $ref: '#/components/schemas/ConceptDraft'
        - $ref: '#/components/schemas/SpecDraft'
        - $ref: '#/components/schemas/RelationDraft'
        - $ref: '#/components/schemas/SourceDraft'
        - $ref: '#/components/schemas/BindingDraft'
        - $ref: '#/components/schemas/AttributeDraft'
        - $ref: '#/components/schemas/ChangeDraft'
      discriminator:
        propertyName: type
        mapping:
          concept: '#/components/schemas/ConceptDraft'
          spec: '#/components/schemas/SpecDraft'
          relation: '#/components/schemas/RelationDraft'
          source: '#/components/schemas/SourceDraft'
          bind: '#/components/schemas/BindingDraft'
          attr: '#/components/schemas/AttributeDraft'
          change: '#/components/schemas/ChangeDraft'

    Origin:
      type: string
      enum: [text, speech, document, suggestion, ontology_import]
      description: How the content of a proposal entered Ontaix - `text` typed in the teach bar or any dialog, `speech` from the teach bar microphone (sent as the final transcript), `document` from `POST /import/sentences`, `suggestion` suggested by the language model through concept expansion (ADR 0009) and selected by a user, `ontology_import` mapped deterministically from an uploaded ontology or hierarchy file (ADR 0012). Always present on output. `text` and `speech` are declared by the client and are a display and audit label, not a trust signal; `document` is set by the server only, for drafts that cite a stored import sentence through `importRef`; `suggestion` is set by the server only, for proposals created by `POST /expansions/{expansionId}/proposals` from drafts the server stored, and no client can declare it (`InputOrigin` does not hold it); `ontology_import` is set by the server only, for proposals created by `POST /ontology-imports/{ontologyImportId}/proposals` from the tree the server mapped.

    InputOrigin:
      type: string
      enum: [text, speech]
      default: text
      description: The origin a client declares. Ignored when `importRef` is present, because the server then records `document` whatever the client sends.

    ImportRef:
      type: object
      additionalProperties: false
      description: Cites one stored sentence of a document import. Accepted by `POST /teach/parse`, `POST /proposals` and `POST /proposals/batch` only; the resource endpoints refuse it with `422`. The import must belong to the caller's tenant and to the same actor (user or agent) that created it, otherwise `404 not_found`; past `expiresAt` it is `410 import_expired`. The server reads the sentence text, the position, the file name and the media type from the stored `document_import` row, never from the client, and records `origin` `document` with that `originDetail`. `document` attests that the draft was submitted citing that sentence of that file; the labels of a draft remain what the client sent.
      required: [importId, sentenceIndex]
      properties:
        importId:
          $ref: '#/components/schemas/Id'
        sentenceIndex:
          type: integer
          minimum: 0
          maximum: 1999
          description: 0-based index into the import's `sentences`.

    OriginDetail:
      type: object
      additionalProperties: false
      description: Where a `document` proposal came from, copied from the stored import when the proposal is created, so it survives the import's expiry. Output only; clients never send it.
      required: [fileName, mediaType, sentenceIndex]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
          description: The basename of the uploaded file name - the server strips any directory part and refuses `/`, `\`, `:`, C0 and C1 control characters, DEL, the bidirectional controls U+061C, U+200E, U+200F, U+202A to U+202E and U+2066 to U+2069, the zero-width characters U+200B to U+200D, the line and paragraph separators U+2028 and U+2029, and U+FEFF. At most 255 characters and at most 1020 bytes in UTF-8 (the byte bound is checked by the server, `422`). User-supplied text - HTML-escaped wherever the server interpolates it (`Proposal.html`, captions, audit `what`), and rendered by the Studio as text only.
        mediaType:
          type: string
          enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/html]
        sentenceIndex:
          type: integer
          minimum: 0
          maximum: 1999
        position:
          $ref: '#/components/schemas/DocumentPosition'

    DocumentPosition:
      type: object
      additionalProperties: false
      description: Where in the document the sentence was found, when extraction knows it - a 1-based page (PDF), paragraph (DOCX, HTML), slide (PPTX) or sheet (XLSX, with the 1-based `row`).
      required: [unit, index]
      properties:
        unit:
          type: string
          enum: [page, paragraph, slide, sheet]
        index:
          type: integer
          minimum: 1
          maximum: 100000
        row:
          type: integer
          minimum: 1
          maximum: 1048576
          description: Only with `unit` `sheet` - the spreadsheet row the sentence was read from.

    Proposal:
      type: object
      required: [id, type, state, title, color, html, ready, deps, proposer, origin, originDetail, createdAt, relationIds, bindingIds, approvals]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum: [concept, spec, relation, source, bind, attr, change]
        changeKind:
          type: [string, 'null']
          enum: [rename, delete_concept, edit_relation, remove_relation, unbind, rename_source, remove_source, remove_company, resolve_conflict, remove_cross_company_links, create_domain, edit_domain, delete_domain, move_concept_domain, delete_bulk, null]
        state:
          type: string
          enum: [pending, half_approved, approved, rejected]
        title:
          type: string
        heading:
          type: string
          description: Panel heading - `New concept`, `Specialisation`, `Relation`, `Change`, `Data source`, `Binding`, `Attribute`, suffixed with ` · <domain name>` when a domain applies, then with ` · suggested` when `origin` is `suggestion` (for example `New concept · Sales · suggested`).
        color:
          type: string
        companyId:
          type: [string, 'null']
          format: uuid
        domainProductId:
          type: [string, 'null']
          format: uuid
        parentLabel:
          type: [string, 'null']
        deps:
          type: array
          items:
            type: string
          description: Labels and named predicates that must hold before approval.
        ready:
          type: boolean
        waitFor:
          type: [string, 'null']
          description: Shown as `after <waitFor>` while blocked.
        html:
          type: string
          maxLength: 2000
          description: Server-generated; every interpolated user-supplied string (labels, actions, captions, `originDetail.fileName`) is HTML-escaped and only `<b>`, `<i>` and `<span class="...">` may appear. The Studio renders it with those three tags allow-listed and everything else as text.
        why:
          type: [string, 'null']
          description: Plain text, rendered as text in the panel's `.why` line. When `origin` is `suggestion` the server sets it when the proposal is created to `Suggested by the model · <confidence>% · <rationale>` (confidence rounded to a whole percent, rationale from the stored expansion note, at most 120 characters); the two-approver note is appended after ` · ` as for every proposal.
        caption:
          type: [string, 'null']
        conceptId:
          type: [string, 'null']
          format: uuid
        relationId:
          type: [string, 'null']
          format: uuid
        relationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        sourceId:
          type: [string, 'null']
          format: uuid
        bindingIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        attributeId:
          type: [string, 'null']
          format: uuid
        proposer:
          $ref: '#/components/schemas/Actor'
        origin:
          $ref: '#/components/schemas/Origin'
        originDetail:
          oneOf:
            - $ref: '#/components/schemas/OriginDetail'
            - type: 'null'
          description: Set exactly when `origin` is `document`, copied from the stored import; null otherwise.
        approvals:
          type: array
          maxItems: 2
          items:
            type: object
            required: [ordinal, userId, approvedAt]
            properties:
              ordinal:
                type: integer
                enum: [1, 2]
              userId:
                $ref: '#/components/schemas/Id'
              userName:
                type: string
              approvedAt:
                type: string
                format: date-time
        bulk:
          type: boolean
        revision:
          type: integer
          minimum: 0
          description: Incremented by every in-place edit of a pending draft (`PATCH /proposals/{proposalId}`); 0 when never edited.
        openBelow:
          type: integer
          minimum: 0
          description: For an open `concept` or `spec` proposal, the open proposals in its branch other than itself (the open proposals that depend on a `concept` or `spec` root through proposal dependencies, transitively, plus relation proposals whose ends are all in the branch or approved; never `change`, `source`, `bind` or `attr` proposals; see `POST /proposals/{proposalId}/approve-branch`), computed at read time; 0 or absent for every other proposal and when nothing open depends on it. The Studio shows `Approve branch` when it is above 0.
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        artefacts:
          $ref: '#/components/schemas/Artefacts'

    Artefacts:
      type: object
      description: The current state of everything a proposal created or changed, so a client can apply it without a fetch.
      properties:
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/Concept'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'

    DecisionResult:
      type: object
      required: [proposal, artefacts, cascaded, audit]
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        artefacts:
          $ref: '#/components/schemas/Artefacts'
        cascaded:
          type: array
          description: Proposals rejected by cascade, or created by approval (attribute discovery, conflict detection).
          items:
            $ref: '#/components/schemas/Proposal'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        caption:
          type: string

    BranchResult:
      type: object
      additionalProperties: false
      required: [rootId, approved, skipped, remaining, batches, complete]
      properties:
        rootId:
          $ref: '#/components/schemas/Id'
        approved:
          type: integer
          minimum: 0
          description: Proposals approved by this call, across every committed batch.
        skipped:
          type: integer
          minimum: 0
          description: Branch proposals the caller may not approve alone (scope, second approver).
        remaining:
          type: integer
          minimum: 0
          description: Open proposals of the branch after this call, skipped and blocked ones included.
        batches:
          type: integer
          minimum: 0
          description: Batches committed, each in its own transaction under the decision lock.
        complete:
          type: boolean
          description: False when the round limit or a `busy` lock stopped the call with ready proposals left; call again on the same root.

    BulkResult:
      type: object
      required: [approved, rejected, rounds, remaining]
      properties:
        approved:
          type: integer
        rejected:
          type: integer
        rounds:
          type: integer
        remaining:
          type: integer
          description: Open proposals left, blocked ones included.
        caption:
          type: string

    Scene:
      type: object
      required: [sequence, serverTime, companies, nodes, links, proposals, settings, appearance, viewState, connectors]
      properties:
        sequence:
          type: integer
          description: Event sequence at the time of the snapshot; pass it as `since` when opening the WebSocket.
        serverTime:
          type: string
          format: date-time
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        nodes:
          type: array
          description: Concepts (root and concept) and sources, the union the physics runs on.
          items:
            oneOf:
              - $ref: '#/components/schemas/Concept'
              - $ref: '#/components/schemas/Source'
            discriminator:
              propertyName: kind
              mapping:
                root: '#/components/schemas/Concept'
                concept: '#/components/schemas/Concept'
                source: '#/components/schemas/Source'
        links:
          type: array
          description: Relations and bindings; a binding is drawn as a `bind` link from the source to the concept.
          items:
            oneOf:
              - $ref: '#/components/schemas/Relation'
              - $ref: '#/components/schemas/Binding'
            discriminator:
              propertyName: kind
              mapping:
                rel: '#/components/schemas/Relation'
                isa: '#/components/schemas/Relation'
                same: '#/components/schemas/Relation'
                clash: '#/components/schemas/Relation'
                bind: '#/components/schemas/Binding'
        proposals:
          type: array
          description: Open proposals with `ready` and `waitFor` evaluated.
          items:
            $ref: '#/components/schemas/Proposal'
        settings:
          $ref: '#/components/schemas/Settings'
        appearance:
          $ref: '#/components/schemas/Appearance'
        viewState:
          $ref: '#/components/schemas/ViewState'
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorType'

    ViewState:
      type: object
      required: [coverage]
      properties:
        coverage:
          type: boolean

    NodePosition:
      type: object
      required: [id, kind, x, y, pinned]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [concept, source]
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean

    Coverage:
      type: object
      required: [companies, unboundConceptIds]
      properties:
        companies:
          type: array
          items:
            type: object
            required: [companyId, concepts, bound, percentBound, domains]
            properties:
              companyId:
                $ref: '#/components/schemas/Id'
              concepts:
                type: integer
              bound:
                type: integer
              percentBound:
                type: integer
              domains:
                type: array
                items:
                  type: object
                  required: [domainProductId, members, bound]
                  properties:
                    domainProductId:
                      $ref: '#/components/schemas/Id'
                    members:
                      type: integer
                    bound:
                      type: integer
        unboundConceptIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'

    Lineage:
      type: object
      required: [concept, ancestors, descendants, dataLineage, setIds, caption]
      properties:
        concept:
          $ref: '#/components/schemas/Concept'
        ancestors:
          type: array
          description: From the root down to the parent.
          items:
            $ref: '#/components/schemas/LineageStep'
        descendants:
          type: array
          items:
            $ref: '#/components/schemas/LineageNode'
        dataLineage:
          type: array
          items:
            type: object
            required: [sourceId, sourceLabel, conceptId, conceptLabel, records, fresh, attributes]
            properties:
              sourceId:
                $ref: '#/components/schemas/Id'
              sourceLabel:
                type: string
              conceptId:
                $ref: '#/components/schemas/Id'
              conceptLabel:
                type: string
              records:
                type: integer
              fresh:
                type: string
              attributes:
                type: integer
        setIds:
          type: array
          description: Every node in the lineage set - the cell, ancestors, descendants and their bound sources.
          items:
            $ref: '#/components/schemas/Id'
        caption:
          type: string

    LineageStep:
      type: object
      required: [conceptId, label, how, pending, bornAt]
      properties:
        conceptId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        how:
          type: string
          description: '`the company`, `is a <parent>`, `<parent> <action> <child>` or `<child> <action> <parent>`.'
        domainName:
          type: [string, 'null']
        pending:
          type: boolean
        bornAt:
          type: string
          format: date-time

    LineageNode:
      type: object
      required: [conceptId, label, how, pending, below, children]
      properties:
        conceptId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        how:
          type: string
        pending:
          type: boolean
        below:
          type: integer
          description: Number of descendants under this node.
        children:
          type: array
          items:
            $ref: '#/components/schemas/LineageNode'

    TeachStreamEvent:
      description: One line of `POST /teach/parse/stream`, told apart by `type`.
      oneOf:
        - $ref: '#/components/schemas/TeachDraftEvent'
        - $ref: '#/components/schemas/TeachRetractEvent'
        - $ref: '#/components/schemas/TeachResultEvent'
        - $ref: '#/components/schemas/TeachErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          draft: '#/components/schemas/TeachDraftEvent'
          retract: '#/components/schemas/TeachRetractEvent'
          result: '#/components/schemas/TeachResultEvent'
          error: '#/components/schemas/TeachErrorEvent'
    TeachDraftEvent:
      type: object
      description: A draft the valid part of the model's answer received so far gives, sent once, as soon as it is known. Advisory until the `result` line; never submitted on its own.
      required: [type, index, draft, note]
      properties:
        type:
          type: string
          enum: [draft]
        index:
          type: integer
          minimum: 0
          description: The stream's count of drafts, from 0, in the order they are sent.
        draft:
          $ref: '#/components/schemas/ProposalDraft'
        note:
          $ref: '#/components/schemas/DraftNote'
    TeachRetractEvent:
      type: object
      description: The sent drafts the final result does not hold - every one of them when the whole answer is refused. Sent once, just before the `result` line, only when it names at least one draft.
      required: [type, indexes]
      properties:
        type:
          type: string
          enum: [retract]
        indexes:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
    TeachResultEvent:
      type: object
      description: The last line of a parse; `result` is the body `POST /teach/parse` answers for the same request and model answer.
      required: [type, result]
      properties:
        type:
          type: string
          enum: [result]
        result:
          $ref: '#/components/schemas/TeachResult'
    TeachErrorEvent:
      type: object
      description: The last line of a parse that failed after its stream began, in place of the `result` line. `problem.code` is `unavailable`; nothing was written.
      required: [type, problem]
      properties:
        type:
          type: string
          enum: [error]
        problem:
          $ref: '#/components/schemas/Problem'
    TeachResult:
      type: object
      required: [outcome, domainKey, intents, drafts, caption, origin, originDetail, extractor, degraded, llmOutcome, draftNotes, unresolved]
      properties:
        parseId:
          type: [string, 'null']
          format: uuid
          description: Set when the parse was recorded for usage learning (ADR 0014) - a user caller, learning on for the company, at least one draft; the client sends it back as `parseId` with `POST /proposals/batch`. Null otherwise.
        extractor:
          type: string
          enum: [rules, llm, rules+llm]
          description: Who produced the returned intents - `rules` when the model step did not run or gave no valid answer; `llm` when the model's valid answer replaced the grammar's (triggered by a back-reference, a list preamble, an unknown verb or a `not_understood` grammar outcome); `rules+llm` when the grammar's intents were kept and the model's were added (triggered by `partly_understood` alone).
        degraded:
          type: boolean
          description: True when the model step was triggered but did not contribute - `llmOutcome` is `not_configured`, `rate_limited`, `budget_exhausted`, `timeout`, `provider_error` or `invalid_output`. The result is then the grammar's alone and the sentence is listed in `unresolved`.
        llmOutcome:
          type: string
          enum: [not_triggered, used, not_configured, rate_limited, budget_exhausted, timeout, provider_error, invalid_output]
          description: What happened to the model step. `not_triggered` - no fallback trigger held. `used` - the model answered and its output validated. `not_configured` - the deployment has no model provider configured (no endpoint, or no credential the provider needs). `rate_limited` - the caller's hourly `llm` budget is spent. `budget_exhausted` - the tenant's `llmMonthlyTokenCap` is reached (or is 0). `timeout` - no answer within 15 seconds (`text`, `document`) or 45 seconds (`speech` transcript). `provider_error` - the provider refused or failed. `invalid_output` - the answer did not validate against `contracts/teach-extraction.schema.json` or cited a candidate that was not sent. None of these is an error status; the response is `200`.
        draftNotes:
          type: array
          maxItems: 150
          description: One entry per element of `drafts`, in the same order; the same cap as `drafts`. Advisory for the reviewer; never submitted with the draft.
          items:
            $ref: '#/components/schemas/DraftNote'
        unresolved:
          type: array
          maxItems: 40
          description: Phrases of the sentence that produced no draft, with the reason. Empty when everything was understood. Each `text` is a substring of the sentence or transcript the server holds (or the whole sentence), never text taken from the model. At most 20 entries, 40 for a `speech` transcript; phrases beyond the cap are dropped from the list, and the result stays `partly_understood` or `not_understood`.
          items:
            $ref: '#/components/schemas/UnresolvedPhrase'
        origin:
          $ref: '#/components/schemas/Origin'
        originDetail:
          oneOf:
            - $ref: '#/components/schemas/OriginDetail'
            - type: 'null'
        outcome:
          type: string
          enum: [understood, partly_understood, not_understood]
          description: Computed on the final result - `understood` when there is at least one intent and `unresolved` is empty, `partly_understood` when there are intents and `unresolved` is not empty, `not_understood` when there is no intent.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
          description: The domain prefix stripped from the sentence, if any.
        intents:
          type: array
          maxItems: 150
          description: At most 60, or 150 for a `speech` transcript - the same cap as `drafts`.
          items:
            $ref: '#/components/schemas/Intent'
        drafts:
          type: array
          maxItems: 150
          description: Proposal drafts in submission order, ready for `POST /proposals/batch`; each carries the request's `origin` and `importRef`. At most 60 for `text` and `document`, and 150 for a `speech` transcript (up to 60 model intents, most of which draft one concept, plus room for two-draft intents), counting grammar and model drafts together; 150 stays under the 200-draft limit of `POST /proposals/batch`. When the result would hold more, the server keeps intents in transcript order (grammar intents first for `rules+llm`) while their drafts fit and fewer intents than the cap are kept, counting intents that produce no draft, drops the rest with their drafts, and lists their text as one `unresolved` entry with reason `too_many_drafts`.
          items:
            $ref: '#/components/schemas/ProposalDraft'
        segments:
          type: array
          maxItems: 40
          description: The sentences the request was split into, in order - one segment for `text` and `document`, one per sentence the model (or, when degraded, the grammar's splitter) found in a `speech` transcript. Fillers and disfluencies between segments belong to no segment. Each segment is stored as one session turn.
          items:
            $ref: '#/components/schemas/SourceSegment'
        statements:
          type: array
          description: One line per intent for the caption, for example `A pred B (new)`.
          items:
            type: string
        caption:
          type: string

    Intent:
      type: object
      required: [kind, subject, object, subjectResolved, objectResolved]
      properties:
        kind:
          type: string
          enum: [spec, rel, attr]
          description: '`attr` (decision row 130) - `subject` is the concept, `predicate` the attribute name, `object` the value, `objectResolved` null.'
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        rule:
          type: string
          description: The grammar pattern that matched, or `llm` for an intent returned by the model step.
        subjectResolved:
          type: [string, 'null']
          format: uuid
        objectResolved:
          type: [string, 'null']
          format: uuid

    DraftNote:
      type: object
      additionalProperties: false
      required: [extractor, confidence]
      properties:
        extractor:
          type: string
          enum: [rules, llm]
          description: Whether the grammar or the model step produced the draft.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 1 for a grammar draft. For a model draft, the confidence the model reported for the intent the draft came from; intents reported below 0.4 are not drafted and appear in `unresolved` with reason `low_confidence`. Advisory only - every draft still needs a human approval.
        explanation:
          type: string
          maxLength: 300
          description: Model drafts only - a short plain-text reason, for example `these services refers to Services from the previous sentence`. When a spoken list's stated number differs from its length (`3 offerings` followed by four names), the drafts follow the list and the server appends `stated <n>, listed <m>` to the explanation of each draft of that list. Text only, never markup; HTML-escaped wherever the server interpolates it and rendered by any client as text.
        segment:
          type: integer
          minimum: 0
          maximum: 39
          description: Index into `TeachResult.segments` of the sentence the draft came from.
        sourceSpan:
          $ref: '#/components/schemas/SourceSpan'
          description: The words of the request that produced the draft - the model's span for a model draft (checked by the server to lie inside its segment), the matched clause for a grammar draft.

    SourceSpan:
      type: object
      additionalProperties: false
      description: A half-open range `[start, end)` of Unicode code points, with `start < end`, in the caller's original input (the typed text, the transcript, or the cited import sentence as the server holds it), domain prefix included - the server adds the stripped prefix's length to the offsets the model returns. Clients that index strings in UTF-16 convert, for example with `Array.from`.
      required: [start, end]
      properties:
        start:
          type: integer
          minimum: 0
          maximum: 3999
        end:
          type: integer
          minimum: 1
          maximum: 4000

    SourceSegment:
      type: object
      additionalProperties: false
      required: [index, span]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 39
        span:
          $ref: '#/components/schemas/SourceSpan'

    UnresolvedPhrase:
      type: object
      additionalProperties: false
      required: [text, reason]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 400
          description: A substring of the sentence the server holds, or the whole sentence when the model step failed or was skipped. For a phrase the model reported, the server uses the matching substring of the sentence and the whole sentence when there is no exact match.
        reason:
          type: string
          enum: [not_understood, ambiguous_reference, low_confidence, model_unavailable, model_invalid_output, too_many_drafts, not_a_statement, ungrounded_label, too_many_segments, attribute_exists]
          description: '`not_understood` - neither the grammar nor the model found an intent. `ambiguous_reference` - the model could not tell what a back-reference points to. `low_confidence` - the model reported a confidence below 0.4. `model_unavailable` - the model step was triggered and did not answer (`llmOutcome` `not_configured`, `rate_limited`, `budget_exhausted`, `timeout` or `provider_error`). `model_invalid_output` - the answer failed validation. `too_many_drafts` - the intents beyond the draft cap of `drafts`. `not_a_statement` - a transcript sentence the model read as talk rather than teaching (a question, an aside, a correction it could not apply). `ungrounded_label` - a new label the model proposed that does not appear in the caller''s own words inside the intent''s source range, so the intent was not drafted. `too_many_segments` - the part of a transcript past the 40th segment when the model step was degraded. `attribute_exists` - an `attr` intent whose concept already has an attribute of that name with another value; editing an attribute is not taught.'

    ExpansionRequest:
      type: object
      additionalProperties: false
      properties:
        depth:
          type: integer
          minimum: 1
          description: Optional steering - how many levels below the expanded concept the caller wants (1 children only, 2 with grandchildren, and so on). No maximum; absent means no depth preference, and suggestions may sit at any depth. The only ceilings are the total drafts per run and the token budget.
        maxChildren:
          type: integer
          minimum: 1
          description: Optional steering - at most this many new children per parent, at every level. No maximum.
        focus:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^<>\x00-\x1f\x7f-\x9f ­؀-؅؜۝܏࢐࢑࣢᠎​-‏ -‮⁠-⁤⁦-⁯﻿￹-￻]*$'
          description: Optional words from the caller that steer the suggestions, for example `after-sales services`. Sent to the model as delimited data, never as instructions. Refuses markup, control characters and every Unicode format character (bidirectional and zero-width controls included); outside the Basic Multilingual Plane the server refuses the rest of category Cf (`422`).
        sessionId:
          type: string
          format: uuid
          description: The teach bar session the Studio is in (as `POST /teach/parse`). Not sent to the model. When the expansion is submitted, the proposed labels are stored as one turn of this session so a later teach sentence can refer to them.

    ExpansionResult:
      type: object
      additionalProperties: false
      required: [expansionId, expiresAt, conceptId, llmOutcome, degraded, drafts, notes, skipped]
      properties:
        expansionId:
          type: [string, 'null']
          format: uuid
          description: The stored expansion to submit with `POST /expansions/{expansionId}/proposals`; null when `drafts` is empty, because nothing is stored then.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: One hour after the expansion was stored; null when `expansionId` is null.
        conceptId:
          $ref: '#/components/schemas/Id'
        llmOutcome:
          type: string
          enum: [used, not_configured, rate_limited, budget_exhausted, timeout, provider_error, refused, invalid_output]
          description: '`used` - the model answered and the answer validated (`drafts` may still be empty when every suggestion was skipped). `not_configured`, `rate_limited`, `budget_exhausted`, `timeout`, `provider_error` and `invalid_output` mean what they mean for `TeachResult.llmOutcome`. `refused` - the provider''s content filter blocked the request or answer, or the model declined. Every value is a `200`.'
        degraded:
          type: boolean
          description: True for every `llmOutcome` other than `used`; `drafts`, `notes` and `skipped` are then empty.
        drafts:
          type: array
          maxItems: 2000
          description: Drafts in breadth-first order - `ConceptDraft`s (depth 1 by `parentId`, the expanded concept; deeper ones, at any depth, by `parentLabel`, a draft earlier in this list) followed by `RelationDraft`s between the expanded concept and drafts of this list. Concepts and relations together are at most the configured ceiling `ONTAIX_EXPAND_MAX_NODES` (default 200, at most 2,000). Shown to the caller for selection; submitted only by index through `POST /expansions/{expansionId}/proposals`, never through `POST /proposals/batch`. No `SpecDraft`, no `origin` and no `importRef` appear.
          items:
            oneOf:
              - $ref: '#/components/schemas/ConceptDraft'
              - $ref: '#/components/schemas/RelationDraft'
        notes:
          type: array
          maxItems: 2000
          description: One entry per element of `drafts`, in the same order.
          items:
            $ref: '#/components/schemas/ExpansionNote'
        skipped:
          type: array
          maxItems: 4000
          description: Suggestions the server dropped from a valid answer, with the reason; a dropped suggestion takes its descendants and its links with it, each listed with reason `parent_skipped`.
          items:
            $ref: '#/components/schemas/ExpansionSkip'

    ExpansionNote:
      type: object
      additionalProperties: false
      required: [confidence, rationale, depth, requires]
      properties:
        confidence:
          type: number
          minimum: 0.4
          maximum: 1
          description: The confidence the model reported; suggestions below 0.4 are skipped. Advisory only.
        rationale:
          type: string
          minLength: 1
          maxLength: 120
          description: One plain-text line from the model saying why the concept belongs here. Untrusted text - rendered as text, HTML-escaped wherever the server interpolates it.
        depth:
          type: [integer, 'null']
          minimum: 1
          description: 1 for a child of the expanded concept, 2 for a grandchild, and so on with no limit; null for a relation draft.
        requires:
          type: array
          maxItems: 2
          uniqueItems: true
          description: Indexes of earlier drafts this one depends on - its parent for a concept draft (empty at depth 1), the drafts at its ends for a relation draft (the expanded concept is not listed). A selection is valid only when it holds every required draft of every selected one; deselecting a draft deselects everything that requires it.
          items:
            type: integer
            minimum: 0
            maximum: 1999

    ExpansionSkip:
      type: object
      additionalProperties: false
      required: [label, reason]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 130
          description: The suggestion's label after the label casing rule, or `<from> <action> <to>` for a link cut to 130 characters. Model text - rendered as text.
        reason:
          type: string
          enum: [existing_label, duplicate_in_response, low_confidence, over_cap, parent_skipped, duplicate_relation]
          description: '`existing_label` - a live or pending concept of the company has this label (case-insensitive, singular or plural), so it is not proposed again. `duplicate_in_response` - an earlier suggestion of the answer has the same label. `low_confidence` - confidence below 0.4. `over_cap` - deeper than the request''s `depth` or beyond its `maxChildren` for one parent (when the request sets them), or beyond the configured total-drafts ceiling in answer order. `parent_skipped` - its parent or a link end was skipped. `duplicate_relation` - a link repeating a birth relation of the answer.'

    DocumentExtraction:
      type: object
      additionalProperties: false
      description: A whole-document extraction job (ADR 0010). Carries progress counts, never labels, so it is safe to publish in `extraction.changed`.
      required: [id, importId, companyId, state, phase, chunks, outlineChunksDone, sectionChunksDone, outlineNodes, tokensUsed, tokenCeiling, nodeCeiling, draftCount, degraded, failureReason, cancelRequested, createdAt, startedAt, finishedAt, expiresAt, submittedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        importId:
          type: [string, 'null']
          format: uuid
          description: Null once the import has been purged; the job keeps what it needs.
        companyId:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        phase:
          type: [string, 'null']
          enum: [outline, sections, mapping, null]
          description: The pass a `running` job is in; null otherwise.
        chunks:
          type: integer
          minimum: 0
        outlineChunksDone:
          type: integer
          minimum: 0
        sectionChunksDone:
          type: integer
          minimum: 0
        outlineNodes:
          type: integer
          minimum: 0
          description: Outline nodes accepted so far.
        tokensUsed:
          type: integer
          minimum: 0
          description: Input plus output tokens the job's calls have settled so far.
        tokenCeiling:
          type: integer
          minimum: 1
          description: '`ONTAIX_DOCUMENT_EXTRACTION_MAX_TOKENS` when the job started.'
        nodeCeiling:
          type: integer
          minimum: 1
          description: '`ONTAIX_DOCUMENT_EXTRACTION_MAX_NODES` when the job started - the most drafts the result may hold.'
        draftCount:
          type: integer
          minimum: 0
          description: Drafts in the result; 0 until the job succeeds.
        degraded:
          type: boolean
          description: True when the job succeeded without reading everything - a chunk failed, timed out or was invalid, or the job stopped at its token ceiling, the tenant cap or its node ceiling. The result's `unresolved` says where.
        failureReason:
          type: [string, 'null']
          enum: [not_configured, budget_exhausted, rate_limited, job_timeout, no_drafts, import_expired, too_many_attempts, internal, null]
          description: Set exactly when `state` is `failed`. `no_drafts` - the job ran but nothing grounded survived. `job_timeout` - the job ran longer than `ONTAIX_DOCUMENT_EXTRACTION_JOB_TIMEOUT_MINUTES` without a result. `too_many_attempts` - runners claimed the job `ONTAIX_DOCUMENT_EXTRACTION_MAX_ATTEMPTS` times (default 3) without finishing it, for example after repeated crashes.
        cancelRequested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: 24 hours after `finishedAt` for a succeeded job; the result can be read and submitted until then.
        submittedAt:
          type: [string, 'null']
          format: date-time

    DocumentExtractionResult:
      type: object
      additionalProperties: false
      required: [extractionId, outline, drafts, notes, unresolved]
      properties:
        extractionId:
          $ref: '#/components/schemas/Id'
        outline:
          type: array
          maxItems: 5000
          description: The outline pass 1 built, parents before children, for display and review; submitted only through the drafts.
          items:
            $ref: '#/components/schemas/OutlineNode'
        drafts:
          type: array
          maxItems: 5000
          description: The draft tree in submission order - concept and specialisation drafts parents first (depth-1 drafts by `parentId`, deeper ones by `parentLabel`, at any depth), then relation drafts. At most the job's `nodeCeiling`. No `origin` or `importRef`; the server sets `document` and `originDetail` when the drafts are proposed.
          items:
            $ref: '#/components/schemas/ProposalDraft'
        notes:
          type: array
          maxItems: 5000
          description: One entry per element of `drafts`, in the same order.
          items:
            $ref: '#/components/schemas/DocumentDraftNote'
        unresolved:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              chunk:
                type: integer
                minimum: 0
              sentenceIndex:
                type: integer
                minimum: 0
                maximum: 1999
              label:
                type: string
                maxLength: 120
                description: The dropped label, as the server sliced it from the document, when the reason concerns one.
              reason:
                type: string
                enum: [not_understood, ambiguous_reference, not_a_statement, low_confidence, ungrounded_label, unknown_parent, model_invalid_output, timeout, provider_error, refused, budget_exhausted, node_ceiling, cancelled]

    OutlineNode:
      type: object
      additionalProperties: false
      required: [index, parentIndex, conceptId, label, role, depth, sentenceIndex]
      properties:
        index:
          type: integer
          minimum: 0
        parentIndex:
          type: [integer, 'null']
          minimum: 0
          description: The outline node this one sits under; null when it sits under the company root or an existing concept (`conceptId` of the parent is then in `parentConceptId`).
        parentConceptId:
          type: [string, 'null']
          format: uuid
        conceptId:
          type: [string, 'null']
          format: uuid
          description: Set when the node is an existing concept of the company (reused, not drafted).
        label:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum: [domain_area, process, subprocess, step, entity, group]
        depth:
          type: integer
          minimum: 1
          description: Levels below the company root; no maximum.
        sentenceIndex:
          type: integer
          minimum: 0
          maximum: 1999

    DocumentDraftNote:
      type: object
      additionalProperties: false
      required: [pass, confidence, depth, requires, sentenceIndex]
      properties:
        pass:
          type: string
          enum: [outline, section]
        confidence:
          type: number
          minimum: 0.4
          maximum: 1
        explanation:
          type: string
          maxLength: 120
          description: Model text, plain; rendered as text.
        role:
          type: string
          enum: [domain_area, process, subprocess, step, entity, group]
        depth:
          type: [integer, 'null']
          minimum: 1
          description: Levels below the company root of a concept draft, no maximum; null for a relation draft.
        requires:
          type: array
          maxItems: 2
          uniqueItems: true
          description: Indexes of earlier drafts this one depends on (its parent, or a relation's drafted ends). A selection must hold every required draft of every selected one.
          items:
            type: integer
            minimum: 0
            maximum: 4999
        sentenceIndex:
          type: integer
          minimum: 0
          maximum: 1999
          description: The import sentence that grounds the draft's new label (for a relation, the sentence it was read from); copied with its position into the proposal's `originDetail`.
        sourceSpan:
          $ref: '#/components/schemas/SourceSpan'
          description: The quoted words, as code points into that sentence.

    OntologyImportResult:
      type: object
      additionalProperties: false
      required: [ontologyImportId, expiresAt, companyId, parentConceptId, format, languages, individuals, drafts, notes, skipped]
      properties:
        ontologyImportId:
          $ref: '#/components/schemas/Id'
        expiresAt:
          type: string
          format: date-time
        companyId:
          $ref: '#/components/schemas/Id'
        parentConceptId:
          type: [string, 'null']
          format: uuid
          description: Null means the company root.
        format:
          type: string
          enum: [rdf_xml, turtle, owl_xml, json_ld, n_triples, obo, csv, xlsx]
          description: The format the server detected.
        languages:
          type: array
          maxItems: 10
          items:
            type: string
        individuals:
          type: string
          enum: [skip, as_concepts]
        drafts:
          type: array
          maxItems: 20000
          description: The tree in submission order - concept and specialisation drafts parents first (under `parentConceptId`, an existing concept reused by label, or an earlier draft by `parentLabel`, at any depth), then relation drafts. No `origin` or `importRef`.
          items:
            $ref: '#/components/schemas/ProposalDraft'
        notes:
          type: array
          maxItems: 20000
          description: One entry per element of `drafts`, in the same order.
          items:
            $ref: '#/components/schemas/OntologyImportNote'
        skipped:
          type: array
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required: [source, reason]
            properties:
              source:
                type: string
                maxLength: 400
                description: The item's IRI, OBO id or `row <n>`. Cf, control, bidirectional and line-separator characters (the character set refused in labels) are percent-encoded as UTF-8 (for example U+202E as `%E2%80%AE`), so the text cannot reorder or hide itself in the panel; rendered as text.
              label:
                type: string
                maxLength: 120
                description: The chosen label, only when it passed the label rules; absent for `invalid_label`, whose refused text is never echoed.
              reason:
                type: string
                enum: [already_known, reused_existing, invalid_label, duplicate_label, remote_import_not_fetched, unsupported_axiom, equivalence_not_imported, datatype_property, individual_skipped, forbidden_action, cycle, unknown_parent, unknown_domain]
                description: '`reused_existing` is informational - the item matched an existing concept, which is reused and receives the item''s children. `equivalence_not_imported` - `owl:equivalentClass`, `owl:sameAs` and `skos:exactMatch` are not imported (equivalences are cross-company links proposed through the relationship dialog). `unsupported_axiom` - anything other than the mapped constructs (unions, intersections, cardinalities, property chains and so on), which is never reasoned over.'

    OntologyImportNote:
      type: object
      additionalProperties: false
      required: [source, depth, requires]
      properties:
        source:
          type: string
          maxLength: 400
          description: The item's IRI, OBO id or `row <n>`. Cf, control, bidirectional and line-separator characters (the character set refused in labels) are percent-encoded as UTF-8 (for example U+202E as `%E2%80%AE`), so the text cannot reorder or hide itself in the panel; rendered as text. This sanitised form is what the proposal's `why` quotes.
        labelLanguage:
          type: [string, 'null']
          maxLength: 35
          description: The language tag of the chosen label; null for an untagged literal or a local name.
        depth:
          type: [integer, 'null']
          minimum: 1
          description: Levels below `parentConceptId` (or the root), no maximum; null for a relation draft.
        requires:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 19999

    SpeechToken:
      type: object
      additionalProperties: false
      required: [token, region, expiresAt, language]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '^[A-Za-z0-9._-]+$'
          description: 'The Speech STS token the Speech resource issued (`sts/v1.0/issueToken`), valid about 10 minutes, ready for `SpeechConfig.fromAuthorizationToken(token, region)` and for `recognizer.authorizationToken` on refresh. Never the Entra token, which stays on the server. A secret while it lives - held in memory only, never stored, logged or put in a URL.'
        region:
          type: string
          const: francecentral
          description: The Speech resource's region.
        expiresAt:
          type: string
          format: date-time
          description: When the Speech token expires, about 10 minutes after it is issued. The Studio requests a new token at least 5 minutes before, and at every microphone start, and sets it on the running recogniser.
        language:
          type: string
          enum: [en-GB, en-US]
          description: The recognition language the deployment is configured for (`ONTAIX_SPEECH_LANGUAGE`, default `en-GB`). English only.

    TenantDomain:
      type: object
      additionalProperties: false
      required: [key, name, owner, color, defaultColor, template, position, revision]
      properties:
        key:
          $ref: '#/components/schemas/DomainKey'
        name:
          type: string
          maxLength: 60
        owner:
          type: string
          maxLength: 60
        color:
          $ref: '#/components/schemas/Hex'
        defaultColor:
          $ref: '#/components/schemas/Hex'
        template:
          type: boolean
          description: True for the nine templates, false for a custom domain.
        position:
          type: integer
          minimum: 0
          maximum: 63
        revision:
          type: integer
          minimum: 0

    DomainInput:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: No markup, control or format characters and no surrounding space (`422`).
        color:
          $ref: '#/components/schemas/Hex'
        owner:
          type: string
          maxLength: 60

    DeletionTarget:
      type: object
      additionalProperties: false
      description: Exactly one of a company (`companyId` alone, for company removal) or a set of concepts and domain products of one company.
      required: [companyId]
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        wholeCompany:
          type: boolean
          default: false
        conceptIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        domainProductIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'

    DeletionImpact:
      type: object
      additionalProperties: false
      required: [concepts, descendants, relations, crossCompanyRelations, bindings, attributes, sources, cascadedProposals, names]
      properties:
        concepts:
          type: integer
          minimum: 0
          description: The concepts named directly, plus every concept of the named domain products.
        descendants:
          type: integer
          minimum: 0
        relations:
          type: integer
          minimum: 0
        crossCompanyRelations:
          type: integer
          minimum: 0
          description: Relations and equivalences to other companies among `relations`.
        bindings:
          type: integer
          minimum: 0
        attributes:
          type: integer
          minimum: 0
        sources:
          type: integer
          minimum: 0
          description: Company removal only - the company's data sources.
        cascadedProposals:
          type: integer
          minimum: 0
        names:
          type: array
          maxItems: 6
          description: Up to six labels of what goes, named concepts first, then descendants. Rendered as text.
          items:
            type: string
    SignInRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Trimmed and lower-cased before lookup.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Never logged, audited or echoed. Longer than 128 characters is verified like any other value and fails, so length never reveals anything.

    Session:
      type: object
      description: The live session of the browser. A member session names its organization and directory user; a platform session names no organization unless a support session is open.
      required: [kind, account, csrfToken, mustChangePassword, idleExpiresAt, absoluteExpiresAt]
      properties:
        kind:
          type: string
          enum: [member, platform]
        account:
          type: object
          required: [id, email, name]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
              format: email
            name:
              type: string
        organization:
          oneOf:
            - $ref: '#/components/schemas/OrganizationRef'
            - type: 'null'
          description: The member's organization; null for a platform session.
        userId:
          type: [string, 'null']
          format: uuid
          description: The member's directory user (`GET /me` returns its roles); null for a platform session.
        platformRoles:
          type: array
          items:
            type: string
            enum: [super_admin]
          description: Present on a platform session.
        support:
          oneOf:
            - type: object
              required: [organization, until, reason]
              properties:
                organization:
                  $ref: '#/components/schemas/OrganizationRef'
                until:
                  type: string
                  format: date-time
                reason:
                  type: string
            - type: 'null'
          description: The open read-only support session of a super admin, else null.
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
          description: Sent back in the `X-CSRF-Token` header of every POST, PUT, PATCH and DELETE while this session lives.
        mustChangePassword:
          type: boolean
          description: True after a super admin set or reset the password; only the password change, this read and sign-out are allowed until it is false.
        idleExpiresAt:
          type: string
          format: date-time
          description: 30 minutes after the last authenticated call, never after `absoluteExpiresAt`.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: 12 hours after sign-in; the session then ends whatever the activity.

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    PasswordReset:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: 12 to 128 characters after Unicode NFC normalisation, any characters including spaces, no composition rule. Refused with `422 password_rejected` when it is in the bundled list of common and breached passwords (checked offline, no external call), contains the email's local part, or equals the current password. Never logged, audited or returned.

    CompanyMode:
      type: string
      enum: [single, multiple]
      description: '`single` - the organization has at most one company: Add company is hidden and `POST /companies` answers `409 company_limit` once it has one, and its `multiCompany` setting stays off (`409 locked_setting`). `multiple` - several companies, subject to the organization''s own `multiCompany` setting.'

    OrganizationRef:
      type: object
      required: [id, name, slug]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string

    Organization:
      type: object
      required: [id, name, slug, companyMode, status, companies, users, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$'
        companyMode:
          $ref: '#/components/schemas/CompanyMode'
        status:
          type: string
          enum: [active, disabled]
        companies:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
          description: Accounts of the organization, disabled included.
        createdAt:
          type: string
          format: date-time
        disabledAt:
          type: [string, 'null']
          format: date-time

    OrganizationCreate:
      type: object
      required: [name, companyMode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique across the deployment, case-insensitive (`409 duplicate_organization`).
        companyMode:
          $ref: '#/components/schemas/CompanyMode'

    OrganizationUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        companyMode:
          $ref: '#/components/schemas/CompanyMode'

    OrganizationUser:
      type: object
      required: [id, accountId, email, name, status, mustChangePassword, locked, groups, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        name:
          type: string
        department:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        mustChangePassword:
          type: boolean
        locked:
          type: boolean
          description: The email is inside a 15-minute sign-in lock.
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
        createdAt:
          type: string
          format: date-time
        lastSignInAt:
          type: [string, 'null']
          format: date-time

    OrganizationUserCreate:
      type: object
      required: [email, name, password, groupIds]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lower-case; unique across the deployment.
        name:
          type: string
          minLength: 1
          maxLength: 120
        department:
          type: [string, 'null']
          maxLength: 120
        password:
          $ref: '#/components/schemas/NewPassword'
        groupIds:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Id'
          description: Groups of this organization; may be empty, and a user with no group can read nothing.

    OrganizationUserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        department:
          type: [string, 'null']
          maxLength: 120
        groupIds:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Id'

    SupportSessionStart:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 300
          description: Why the super admin opens the organization; shown in both audit logs.

    PlatformAuditEntry:
      type: object
      required: [id, at, action, ok, what]
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          oneOf:
            - type: object
              required: [accountId, email]
              properties:
                accountId:
                  $ref: '#/components/schemas/Id'
                email:
                  type: string
            - type: 'null'
          description: The account that acted; null for a failed sign-in with an unknown email and for the system (an expired support session).
        action:
          type: string
          enum: [sign_in, sign_in_failed, sign_in_locked, sign_out, session_expired, password_changed, password_change_failed, password_reset, account_created, account_updated, account_disabled, account_enabled, organization_created, organization_renamed, organization_company_mode, organization_disabled, organization_enabled, support_session_started, support_session_ended, super_admin_created, super_admin_password_set]
        ok:
          type: boolean
        organization:
          oneOf:
            - $ref: '#/components/schemas/OrganizationRef'
            - type: 'null'
        targetAccountId:
          type: [string, 'null']
          format: uuid
        what:
          type: string
          description: One English sentence; never a password, token, hash, or an email that matches no account.
        clientIp:
          type: [string, 'null']

    CompanyLearning:
      type: object
      additionalProperties: false
      required: [companyId, enabled, page, pageSize, total, lessons, aliases, habits]
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        enabled:
          type: boolean
          description: The company's learning switch.
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Lessons matching the filter, active and retired.
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
        aliases:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CompanyAlias'
        habits:
          $ref: '#/components/schemas/LearningHabits'

    Lesson:
      type: object
      additionalProperties: false
      required: [id, signal, task, origin, sourceText, bulk, createdAt, retiredAt, retiredReason, proposalIds]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        signal:
          type: string
          enum: [approve, reject, correct]
        task:
          type: string
          enum: [teach, expand, extraction]
        origin:
          type: string
          enum: [text, speech, document, suggestion]
        sourceText:
          type: string
          maxLength: 4000
          description: The sentence, speech text, document sentence or expansion request the lesson comes from.
        modelOutput:
          type: [object, 'null']
          description: What the model produced (reject and correct).
        finalStructure:
          type: [object, 'null']
          description: What people approved (approve and correct).
        correctsId:
          type: [string, 'null']
          format: uuid
          description: For a correct lesson, the reject lesson it answers, when that was captured.
        bulk:
          type: boolean
        proposalIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        retiredAt:
          type: [string, 'null']
          format: date-time
        retiredReason:
          type: [string, 'null']
          enum: [contradicted, superseded, cap, null]

    CompanyAlias:
      type: object
      additionalProperties: false
      required: [id, heard, meant, conceptId, hits, createdAt, retiredAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        heard:
          type: string
          maxLength: 120
        meant:
          type: string
          maxLength: 120
        conceptId:
          type: [string, 'null']
          format: uuid
        hits:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        retiredAt:
          type: [string, 'null']
          format: date-time

    LearningHabits:
      type: object
      additionalProperties: false
      description: Derived on read from the company's approved relations and concepts, never stored.
      required: [verbs, naming]
      properties:
        verbs:
          type: array
          maxItems: 20
          description: The most used actions of approved relations, most used first.
          items:
            type: object
            additionalProperties: false
            required: [action, count]
            properties:
              action:
                type: string
              count:
                type: integer
                minimum: 1
        naming:
          type: array
          maxItems: 5
          description: Short plain statements of naming patterns, for example `labels are plural nouns` or `acronyms kept upper-case`.
          items:
            type: string
            maxLength: 120

    CurrentUser:
      type: object
      required: [user, effectiveRoles, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        effectiveRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        permissions:
          type: array
          description: Coarse permissions the Studio uses to enable buttons; the server re-checks every call.
          items:
            type: string
            enum: [model.read, view.write, proposal.create, proposal.approve, proposal.second_approve, proposal.reject, settings.write, appearance.write, company.create, source.manage, group.manage, directory.read, agent.manage, audit.read]

    User:
      type: object
      required: [id, name, email, groups, effectiveRoles]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: [string, 'null']
        companyId:
          type: [string, 'null']
          format: uuid
        companyName:
          type: [string, 'null']
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
        effectiveRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        lastLoginAt:
          type: [string, 'null']
          format: date-time

    Group:
      type: object
      required: [id, name, description, memberCount, roles]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        validUntil:
          type: [string, 'null']
          format: date-time
        memberCount:
          type: integer
        members:
          type: array
          description: Present on the single-group read.
          items:
            $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'

    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 300
        validUntil:
          type: [string, 'null']
          format: date-time

    Scope:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [tenant, company, domain]
        companyId:
          type: [string, 'null']
          format: uuid
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        label:
          type: string
          description: '`Tenant`, the company name, or the domain product name.'
      description: A domain scope names a domain product family by `domainKey` and covers that domain product in every company; `companyId` must be null for it and the API answers `422` otherwise. A company scope carries `companyId` only.

    RoleAssignmentInput:
      type: object
      required: [role, scope]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleAssignment:
      type: object
      required: [id, role, scope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/RoleName'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleInfo:
      type: object
      required: [role, label, description, assigned]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
        label:
          type: string
        description:
          type: string
        assigned:
          type: integer
          description: Distinct users holding the role through groups; agents with access for the Agent row.

    AgentCreate:
      type: object
      required: [name, platform, issuer, subject]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 60
        issuer:
          type: string
          maxLength: 300
          description: Token issuer the agent authenticates with.
        subject:
          type: string
          maxLength: 300
          description: Token subject (client id or workload identity) the agent authenticates with.
        companyId:
          type: [string, 'null']
          format: uuid
          description: Company scope; null means tenant-wide.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        owner:
          type: string
          maxLength: 120
          default: ''

    Agent:
      type: object
      required: [id, name, platform, owner, access, reads, costEur]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        platform:
          type: string
        issuer:
          type: string
          description: Present only for callers holding `agent.manage`.
        subject:
          type: string
          description: Present only for callers holding `agent.manage`.
        companyId:
          type: [string, 'null']
          format: uuid
          description: Company scope; null means tenant-wide.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        domainName:
          type: [string, 'null']
        owner:
          type: string
        access:
          type: boolean
        reads:
          type: integer
          description: Model reads this month.
        costEur:
          type: number
          description: Cost this month in euros.

    CostSummary:
      type: object
      required: [month, measuredEur, allocatedEur, agentsRegistered, agentsWithAccess, reads, byPlatform]
      properties:
        month:
          type: string
          format: date
        measuredEur:
          type: number
        allocatedEur:
          type: number
        agentsRegistered:
          type: integer
        agentsWithAccess:
          type: integer
        reads:
          type: integer
        byPlatform:
          type: array
          description: Sorted by cost descending.
          items:
            type: object
            required: [platform, agentsWithAccess, costEur, sharePercent]
            properties:
              platform:
                type: string
              agentsWithAccess:
                type: integer
              costEur:
                type: number
              sharePercent:
                type: integer
        llm:
          $ref: '#/components/schemas/LlmUsage'

    LlmUsage:
      type: object
      additionalProperties: false
      description: Language model calls Ontaix itself made for the tenant in the month (teach extraction, concept expansion, whole-document extraction and OCR of scanned documents), from the `llm_call` cost records. Separate from the agent figures - `measuredEur` and `byPlatform` stay agent reads through the gateway. The Studio's Cost management page shows no new element for it until the UI contract records one.
      required: [calls, inputTokens, outputTokens, tokensUsed, tokenCap, costEur, byPurpose]
      properties:
        calls:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        tokensUsed:
          type: integer
          minimum: 0
          description: Tokens counted against `tokenCap` this month (input plus output, including reservations of calls still running).
        tokenCap:
          type: integer
          minimum: 0
          description: The tenant's `llmMonthlyTokenCap` setting.
        ocrPagesUsed:
          type: integer
          minimum: 0
          description: OCR pages counted against `ocrPageCap` this month, reservations of calls still running included.
        ocrPageCap:
          type: integer
          minimum: 0
          description: The tenant's `ocrMonthlyPageCap` setting.
        costEur:
          type: number
          minimum: 0
          description: Estimated cost in euros from the deployment's configured price table for each model (euros per million input and output tokens); an estimate, not the provider's invoice. No price is part of this contract.
        byPurpose:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, calls, costEur]
            properties:
              purpose:
                type: string
                enum: [teach_extraction, concept_expansion, document_extraction, document_ocr]
              calls:
                type: integer
                minimum: 0
              pages:
                type: integer
                minimum: 0
                description: '`document_ocr` only - pages recognised this month; OCR is priced per page.'
              costEur:
                type: number
                minimum: 0

    Settings:
      type: object
      required: [companyMode, voice, importDocs, liveTeaching, everyoneTeaches, approvalRequired, twoApprovers, autoAttrs, notifyOwners, multiCompany, crossCompany, animations, coverageDefault, legend, readOnlyConnectors, refresh, agentAccess, costCap, llmMonthlyTokenCap, ocrMonthlyPageCap, companyCreation]
      properties:
        companyMode:
          allOf:
            - $ref: '#/components/schemas/CompanyMode'
          readOnly: true
          description: Set by a super admin (`PATCH /admin/organizations/{organizationId}`); read-only here.
        voice:
          type: boolean
        importDocs:
          type: boolean
        liveTeaching:
          type: boolean
        everyoneTeaches:
          type: boolean
        approvalRequired:
          type: boolean
          const: true
          description: Locked on.
        twoApprovers:
          type: boolean
        autoAttrs:
          type: boolean
        notifyOwners:
          type: boolean
        multiCompany:
          type: boolean
          description: Several companies in one view; off hides Add company. Always false, and locked, while `companyMode` is `single`.
        companyCreation:
          type: boolean
          description: When false, `POST /companies` is refused with `409 company_creation_disabled` for every caller, and the Studio hides Add company (ADR 0015). Administrator only (`settings.write`), audited. Default true. Unlike `multiCompany`, which only shows or hides the Company button, this is enforced by the API.
        crossCompany:
          type: boolean
        animations:
          type: boolean
        coverageDefault:
          type: boolean
        legend:
          type: boolean
        readOnlyConnectors:
          type: boolean
          const: true
          description: Locked on.
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        agentAccess:
          type: boolean
        costCap:
          type: boolean
          description: Stop agents at 100 percent of the euro allocation. Does not govern Ontaix's own language model calls, which `llmMonthlyTokenCap` bounds.
        llmMonthlyTokenCap:
          $ref: '#/components/schemas/LlmMonthlyTokenCap'
        ocrMonthlyPageCap:
          $ref: '#/components/schemas/OcrMonthlyPageCap'
        egressAllowlist:
          type: array
          maxItems: 200
          description: Hosts connector discovery may reach even when they resolve to loopback, link-local or private ranges.
          items:
            type: string
            maxLength: 300

    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        voice:
          type: boolean
        importDocs:
          type: boolean
        liveTeaching:
          type: boolean
        everyoneTeaches:
          type: boolean
        twoApprovers:
          type: boolean
        autoAttrs:
          type: boolean
        notifyOwners:
          type: boolean
        multiCompany:
          type: boolean
          description: '`true` is refused with `409 locked_setting` while the organization''s `companyMode` is `single`.'
        companyCreation:
          type: boolean
          description: When false, `POST /companies` is refused with `409 company_creation_disabled` for every caller, and the Studio hides Add company (ADR 0015). Administrator only (`settings.write`), audited. Default true. Unlike `multiCompany`, which only shows or hides the Company button, this is enforced by the API.
        crossCompany:
          type: boolean
          description: May only be turned on here, or off when no cross-company relation exists.
        animations:
          type: boolean
        coverageDefault:
          type: boolean
        legend:
          type: boolean
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        agentAccess:
          type: boolean
        costCap:
          type: boolean
        llmMonthlyTokenCap:
          $ref: '#/components/schemas/LlmMonthlyTokenCap'
        ocrMonthlyPageCap:
          $ref: '#/components/schemas/OcrMonthlyPageCap'
        egressAllowlist:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 300

    LlmMonthlyTokenCap:
      type: integer
      minimum: 0
      maximum: 1000000000
      default: 2000000
      description: Tokens (input plus output) Ontaix's own language model calls may use for the tenant per calendar month (UTC), enforced whatever `costCap` says. The default of 2,000,000 keeps the model step on for every tenant, so sentences that trigger it are sent to the configured provider; `0` turns the step off, which is how a tenant administrator opts out. When the cap is reached the teach parse still answers `200` with the grammar's result and `llmOutcome` `budget_exhausted`. A change writes the audit entry `llmMonthlyTokenCap set to <n>`.

    OcrMonthlyPageCap:
      type: integer
      minimum: 0
      maximum: 1000000
      default: 1000
      description: Pages of scanned PDFs Ontaix may send to OCR for the tenant per calendar month (UTC), for users and agents together. Each import reserves its image-only page count in `llm_month_usage.ocr_pages` before the OCR call and settles it after; when the reservation would pass the cap, the import is refused with `503 unavailable` and nothing is stored. `0` turns OCR off (text PDFs and every other type still import). OCR is also off whenever `llmMonthlyTokenCap` is 0. A change writes the audit entry `ocrMonthlyPageCap set to <n>`.

    Appearance:
      type: object
      required: [theme, colors, accent, source, defaults]
      properties:
        theme:
          type: string
          enum: [dark, light]
        colors:
          type: object
          description: Effective colour per domain key (override or template).
          additionalProperties:
            $ref: '#/components/schemas/Hex'
        accent:
          $ref: '#/components/schemas/Hex'
        source:
          $ref: '#/components/schemas/Hex'
        defaults:
          type: object
          required: [colors, accent, source]
          properties:
            colors:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Hex'
            accent:
              $ref: '#/components/schemas/Hex'
            source:
              $ref: '#/components/schemas/Hex'

    AppearancePatch:
      type: object
      minProperties: 1
      properties:
        theme:
          type: string
          enum: [dark, light]
        colors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Hex'
        accent:
          $ref: '#/components/schemas/Hex'
        source:
          $ref: '#/components/schemas/Hex'

    CrossCompanyImpact:
      type: object
      required: [relations, pendingProposals, pairs, samples]
      properties:
        relations:
          type: integer
        pendingProposals:
          type: integer
        pairs:
          type: array
          items:
            type: object
            required: [companyA, companyB, count]
            properties:
              companyA:
                type: string
              companyB:
                type: string
              count:
                type: integer
        samples:
          type: array
          maxItems: 6
          items:
            type: string
            description: '`<A> <action> <B>`'

    CrossCompanyDisabled:
      type: object
      required: [removedRelations, rejectedProposals, proposal, audit, settings]
      properties:
        removedRelations:
          type: integer
        rejectedProposals:
          type: integer
        proposal:
          $ref: '#/components/schemas/Proposal'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        settings:
          $ref: '#/components/schemas/Settings'

    AuditEntry:
      type: object
      description: One audit row. `companyIds` is its audience; `GET /audit` and the `audit.appended` event apply the same read rule.
      required: [id, at, actor, kind, what, ok, companyIds, origin]
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        kind:
          type: string
          description: A proposal type for decisions, or `setting`, `groups`, `roles`, `source`, `company`, `agents`, `list`, `appearance`, `speech` (a speech recognition token was issued, ADR 0013), `learning` (usage learning switched, a lesson deleted or a company's learning reset, ADR 0014), `auth` (a member signed in, failed to, signed out, or changed their password; ADR 0017), `platform` (a super admin created or changed an account, reset a password, renamed, disabled or re-enabled the organization, changed its company mode, or opened or ended a support session in it; actor kind `platform`), `edit` (a pending proposal edited in place, ADR 0015), `export` (an export, ADR 0016), `edit` (a pending proposal edited in place, ADR 0015), `export` (an export, ADR 0016).
        what:
          type: string
        ok:
          type: boolean
          description: True renders `approved`, false renders `rejected`.
        proposalId:
          type: [string, 'null']
          format: uuid
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
          description: The origin of the proposal the entry records; null for every entry without a proposal.
        companyIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
          description: Every company whose name, labels or artefacts the entry mentions - both companies of a cross-company proposal, the added company of a `company` entry, the company of a role scope in a `roles` entry. Empty means tenant-wide. Readable by a caller holding `audit.read` in a scope containing every listed company, or on the domain scope named by `domainKey`; an empty list needs `audit.read` at any scope.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
          description: Template key of the domain product of the proposal the entry records, when that proposal has one; null for every other entry. A caller holding `audit.read` on the domain scope with this key reads the entry whatever its `companyIds`, because that scope covers the domain product in every company and matches the proposals it may decide.
