        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of relations. Filterable - `kind`, `companyId`, `state`. Sortable - `subject`, `action`, `object`, `kind`, `state`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Relations]
      summary: Propose a relation between two concepts
      description: Creates a `relation` proposal. The action is normalised first - NFKC, whitespace runs collapsed to one space, trimmed, lower-cased - on this endpoint and on every other path that sets a relation action - relation edits (`RelationEdit.action`), concept birth actions (`ConceptDraft.action`), drafts, batch and teach extraction. Normalised action `is a` produces an `isa` relation, `equivalent to` produces a `same` relation. The `duplicate_relation` check compares normalised forms on both sides - the stored label is normalised the same way before it is compared with the new action. Refused with `409 duplicate_relation` when the triple exists and `409 cross_company_disabled` when the ends belong to different companies and the switch is off.
