              name:
                type: string
              rows:
                type: integer

    Binding:
      type: object
      required: [id, kind, sourceId, sourceLabel, conceptId, records, fresh, pending]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: bind
          description: Discriminates a binding from a relation in `Scene.links`.
        seed:
          oneOf:
            - $ref: '#/components/schemas/Seed'
            - type: 'null'
          description: Stored bend seed; null when the binding was created without one, in which case the client redraws the bend from its stream on reload.
        sourceId:
          $ref: '#/components/schemas/Id'
        sourceLabel:
          type: string
        conceptId:
          $ref: '#/components/schemas/Id'
        records:
          type: integer
        fresh:
          type: string
          description: '`2 min`, `4 min`, `11 min`, `1 h`, `paused`, `just now`.'
        pending:
          type: boolean

    BindingDraft:
      type: object
      required: [type, sourceId, conceptIds]
      properties:
        type:
          type: string
          const: bind
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        sourceId:
          $ref: '#/components/schemas/Id'
        conceptIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    BindingRow:
      type: object
      required: [concept, binding, approvedAttributes, pendingAttributes, state]
      properties:
        concept:
          $ref: '#/components/schemas/Concept'
        binding:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        approvedAttributes:
          type: integer
        pendingAttributes:
          type: integer
        state:
          type: string
          enum: [bound, no data]

    Attribute:
      type: object
      required: [id, conceptId, name, type, col, fill, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conceptId:
          $ref: '#/components/schemas/Id'
        sourceId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: string
          description: Source column path, for example `sap.mara.matnr`.
        fill:
          type: integer
          minimum: 0
          maximum: 100
        state:
          type: string
          enum: [proposed, approved]

    AttributeDraft:
      type: object
      required: [type, conceptId, name, attributeType, col, fill]
      properties:
        type:
          type: string
          const: attr
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        conceptId:
