            - required: [bId]
            - required: [bLabel, companyId]
      properties:
        type:
          type: string
          const: relation
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        companyId:
          $ref: '#/components/schemas/Id'
        aId:
          $ref: '#/components/schemas/Id'
        bId:
          $ref: '#/components/schemas/Id'
        aLabel:
          type: string
          maxLength: 120
        bLabel:
          type: string
          maxLength: 120
        action:
          type: string
          minLength: 1
          maxLength: 60
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    RelationEdit:
