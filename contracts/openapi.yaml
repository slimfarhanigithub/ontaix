          format: uuid
        birthRelationId:
          type: [string, 'null']
          format: uuid
        bornAt:
          type: string
          format: date-time
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        bound:
