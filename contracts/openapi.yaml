  # ---------------------------------------------------------------- Audit
  /audit:
    get:
      tags: [Audit]
      summary: Audit log, newest first
      description: Returns only the entries the caller may read. An entry is readable when the caller holds `audit.read` in a scope that contains every company in the entry's `companyIds`; an entry with an empty `companyIds` is tenant-wide and readable with `audit.read` at any scope. A company-scoped Auditor or Governor therefore never sees an entry naming another company, including a company addition or a cross-company decision. `total` counts readable entries only.
      operationId: listAudit
      x-ontaix-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A page of entries. Filterable - `kind`, `ok`, `actorKind`, `from`, `to`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Demo
  /demo/scenes:
    get:
      tags: [Demo]
      summary: The scene list and the current index
      operationId: listDemoScenes
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Scenes with name, placeholder sentence and match pattern.
          content:
            application/json:
              schema:
                type: object
                required: [sceneIdx, scenes]
                properties:
                  sceneIdx:
                    type: integer
                  scenes:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemoScene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The demo story is off for this tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /demo/next:
    post:
      tags: [Demo]
      summary: Play the next scene
      description: Creates the scene's proposals server-side in order and pacing; the Studio animates them from the events. Returns the scene played.
      operationId: playNextDemoScene
      x-ontaix-permission: demo.run
      responses:
        '200':
          description: The scene that was played and the new index.
          content:
            application/json:
              schema:
                type: object
                required: [sceneIdx, scene, proposals]
                properties:
                  sceneIdx:
                    type: integer
                  scene:
                    $ref: '#/components/schemas/DemoScene'
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The demo story is off for this tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /demo/reset:
    post:
      tags: [Demo]
      summary: Restart the story
      description: Removes every company and proposal of the demo tenant and rebuilds the home company at scene 0. The audit log is never touched; the reset itself is appended as `demo · story restarted`. Refused outside dev tenants (`409 not_demo_tenant`).
      operationId: resetDemo
      x-ontaix-permission: demo.run
      responses:
        '200':
          description: The fresh scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The demo story is off for this tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC ID token or access token from any provider the tenant trusts (`tenant_identity_provider` maps issuer and audience to the tenant). Authentication only; roles come from Ontaix groups.
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Agent bearer token (client credentials or workload identity). Its issuer and subject must match an `agent` row with `access` on, in a tenant whose `agentAccess` setting is on; otherwise `403`. An agent holds `model.read` and `proposal.create` in its own scope (tenant-wide or one company) and nothing else. Every agent read is logged.

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Rows per page. The portal lists use 40, the agent registry 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 40
    Q:
      name: q
      in: query
      description: Case-insensitive search over the list's search keys.
      schema:
        type: string
        maxLength: 200
    Filter:
      name: filter
      in: query
      description: Field filters, `filter[field]=value`; a comma separates alternatives. Unknown fields return 400.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
          maxLength: 200
    Sort:
      name: sort
      in: query
      description: Sort field; each list documents its sortable fields. Unknown fields return 400.
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainProductId:
      name: domainProductId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConceptId:
      name: conceptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProposalAccepted:
      description: The proposal was created and its pending artefacts exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Proposal'
    Problem:
      description: A problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed query or body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller's roles do not allow this action in this scope (code `forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request contradicts the current state; `code` says how.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The body is well-formed but invalid; `errors` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The caller's budget for this operation is exhausted (code `rate_limited`); `Retry-After` says when to retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Busy:
      description: The tenant's decision lock or a row lock was not granted within the lock timeout, or the transaction hit a deadlock or serialisation failure (code `busy`). Nothing was written; retry the same request after `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: '`urn:ontaix:problem:<code>`'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - validation_failed
            - duplicate_label
            - duplicate_relation
            - structural_relation
            - cross_company_disabled
            - same_company
            - already_bound
            - source_pending
            - root_concept
            - home_company
            - proposal_not_ready
            - proposal_not_half_approved
            - proposal_decided
            - same_approver
            - locked_setting
            - confirmation_required
            - confirmation_mismatch
            - duplicate_role
            - not_demo_tenant
            - story_finished
            - payload_too_large
            - unsupported_media_type
            - rate_limited
            - duplicate_attribute
            - duplicate_agent
            - unavailable
            - busy
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Page:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Id:
      type: string
      format: uuid

    Hex:
      type: string
      pattern: '^#[0-9a-f]{6}$'

    Seed:
      type: number
      minimum: 0
      exclusiveMaximum: 1
      description: Curve bend seed in the range of `relation.seed`. The Studio draws it from its single random stream at draft time so every client draws the same curve; the server stores what it receives and draws one only when the draft carries none.

    DomainKey:
      type: string
      enum: [production, supply, sales, logistics, quality, maintenance, finance, people, engineering]

    RoleName:
      type: string
      enum: [owner, builder, governor, member, administrator, auditor, agent]

    ActorKind:
      type: string
      enum: [user, agent, system]

    Actor:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string

    Company:
      type: object
      required: [id, key, name, sub, position, isHome, rootId, domainProducts, counts]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
          description: Slug of the name at creation, unique in the tenant.
        name:
          type: string
        sub:
          type: string
        position:
          type: integer
        isHome:
          type: boolean
        rootId:
          $ref: '#/components/schemas/Id'
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'
        counts:
          type: object
          required: [concepts, sources, equivalences, bound, percentBound, domainsWithCells]
          properties:
            concepts:
              type: integer
            sources:
              type: integer
            equivalences:
              type: integer
            bound:
              type: integer
            percentBound:
              type: integer
            domainsWithCells:
              type: integer
        dyingAt:
          type: [string, 'null']
          format: date-time

    CompanyCreate:
      type: object
      required: [name, start]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sub:
          type: string
          maxLength: 200
          default: ''
        start:
          type: string
          enum: [starter_vocabulary, one_cell]
          description: '`starter_vocabulary` proposes the thirteen starter concepts; `one_cell` creates the root only.'

    CompanyCreated:
      type: object
      required: [company, root, proposals]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        root:
          $ref: '#/components/schemas/Concept'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'

    DomainProduct:
      type: object
      required: [id, companyId, key, name, owner, color, revision, version, hidden, counts]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DomainKey'
        name:
          type: string
        owner:
          type: string
        color:
          $ref: '#/components/schemas/Hex'
        revision:
          type: integer
          description: Number of approved changes carrying this domain.
        version:
          type: string
          description: Display form `v1.<revision>`.
        hidden:
          type: boolean
        counts:
          type: object
          required: [members, pending, bound]
          properties:
            members:
              type: integer
            pending:
              type: integer
            bound:
              type: integer

    Concept:
      type: object
      required: [id, companyId, kind, label, sub, pending, conflict, bornAt, x, y, pinned, attributes, relationCount, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [root, concept]
        label:
          type: string
        sub:
          type: string
        domainProductId:
          type: [string, 'null']
          format: uuid
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        color:
          $ref: '#/components/schemas/Hex'
        rule:
          type: [string, 'null']
        pending:
          type: boolean
        conflict:
          type: boolean
        parentId:
          type: [string, 'null']
          format: uuid
        birthRelationId:
          type: [string, 'null']
          format: uuid
        bornAt:
          type: string
          format: date-time
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        bound:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        relationCount:
          type: integer
          description: Relations touching the concept, bindings excluded.
        state:
          type: string
          enum: [awaiting approval, approved, certified]
        isSpecialisation:
          type: boolean

    ConceptDraft:
      type: object
      description: The parent is given by id, or by label when it is introduced by an earlier draft of the same batch.
      required: [type, companyId, label, domainKey]
      oneOf:
        - required: [parentId]
        - required: [parentLabel]
      properties:
        type:
          type: string
          const: concept
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        parentLabel:
          type: string
          maxLength: 120
          description: Alternative to `parentId` for drafts that depend on a label introduced earlier in the same batch.
        label:
          type: string
          minLength: 1
          maxLength: 120
        domainKey:
          $ref: '#/components/schemas/DomainKey'
        action:
          type: string
          minLength: 1
          maxLength: 60
          default: relates to
          description: Lower-case action of the birth relation.
        reverse:
          type: boolean
          default: false
          description: When true the birth relation reads child action parent.
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    SpecDraft:
      type: object
      description: The parent is given by id, or by label when it is introduced by an earlier draft of the same batch.
      required: [type, companyId, label, domainKey]
      oneOf:
        - required: [parentId]
        - required: [parentLabel]
      properties:
        type:
          type: string
          const: spec
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        parentLabel:
          type: string
          maxLength: 120
        label:
          type: string
          minLength: 1
          maxLength: 120
        rule:
          type: string
          maxLength: 200
        domainKey:
          $ref: '#/components/schemas/DomainKey'
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    RelationDraft:
      type: object
      description: Each end is given by id, or by label when it is introduced by an earlier draft of the same batch; `companyId` is required when a label is used.
      required: [type, action]
      allOf:
        - oneOf:
            - required: [aId]
            - required: [aLabel, companyId]
        - oneOf:
            - required: [bId]
            - required: [bLabel, companyId]
      properties:
        type:
          type: string
          const: relation
        companyId:
          $ref: '#/components/schemas/Id'
        aId:
          $ref: '#/components/schemas/Id'
        bId:
          $ref: '#/components/schemas/Id'
        aLabel:
          type: string
          maxLength: 120
        bLabel:
          type: string
          maxLength: 120
        action:
          type: string
          minLength: 1
          maxLength: 60
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    RelationEdit:
      type: object
      description: At least one of `action` or `reverse` is present.
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 60
        reverse:
          type: boolean
          description: Swap subject and object.
      minProperties: 1

    Relation:
      type: object
      required: [id, aId, bId, kind, label, rest, seed, pending, aLabel, bLabel, companyIds, scope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        aId:
          $ref: '#/components/schemas/Id'
        bId:
          $ref: '#/components/schemas/Id'
        aLabel:
          type: string
        bLabel:
          type: string
        kind:
          type: string
          enum: [rel, isa, same, clash]
        label:
          type: string
        rest:
          type: number
          description: Spring rest length used by the physics.
        seed:
          type: number
          minimum: 0
          maximum: 1
          description: Curve bend seed, stored so every client draws the same curve.
        pending:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        companyIds:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Id'
        scope:
          type: string
          description: '`<domain>`, `company`, or `<from> → <to>` for the Relationships page.'
        state:
          type: string
          enum: [awaiting approval, approved]

    SourceDraft:
      type: object
      required: [type, companyId, label, kindText]
      properties:
        type:
          type: string
          const: source
        companyId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
          minLength: 1
          maxLength: 120
        kindText:
          type: string
          maxLength: 60
          description: The catalogue category shown under the label, for example `ERP`.
        connectorCode:
          type: string
          maxLength: 10
        host:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 500
        auth:
          $ref: '#/components/schemas/SourceAuth'
        credentialRef:
          $ref: '#/components/schemas/CredentialRef'
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        caption:
          type: string
          maxLength: 300

    SourceUpdate:
      type: object
      description: Connection settings only. Renaming a source is a `change` proposal with `changeKind` `rename_source`.
      minProperties: 1
      properties:
        host:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 500
        auth:
          $ref: '#/components/schemas/SourceAuth'
        credentialRef:
          $ref: '#/components/schemas/CredentialRef'
        refresh:
          $ref: '#/components/schemas/RefreshInterval'

    CredentialRef:
      type: string
      pattern: '^[A-Za-z0-9-]{1,127}$'
      description: Key Vault secret name that holds the source credential. A reference, never a value; the API refuses anything that is not a valid secret name and never returns or logs the secret.

    SourceAuth:
      type: string
      enum: [service_principal, oauth2_client_credentials, managed_identity, key_vault_api_key]

    RefreshInterval:
      type: string
      enum: ['5 min', '15 min', '1 h', daily]

    Source:
      type: object
      required: [id, kind, companyId, label, kindText, anchorIndex, disabled, pending, refresh, x, y, pinned, feeds, records, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: source
          description: Discriminates a source from a concept in `Scene.nodes`.
        companyId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        kindText:
          type: string
        connectorCode:
          type: [string, 'null']
        host:
          type: [string, 'null']
        scope:
          type: [string, 'null']
        auth:
          oneOf:
            - $ref: '#/components/schemas/SourceAuth'
            - type: 'null'
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        anchorIndex:
          type: integer
          description: Index within the company, drives the anchor angle outside the domain ring.
        disabled:
          type: boolean
        pending:
          type: boolean
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        feeds:
          type: integer
          description: Number of concepts bound to it.
        records:
          type: [integer, 'null']
          description: Sum over approved bindings, or null.
        state:
          type: string
          enum: [awaiting approval, disabled, connected]

    ConnectorType:
      type: object
      required: [code, name, category, scopeText]
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        scopeText:
          type: string

    DiscoveryRequest:
      type: object
      required: [auth]
      properties:
        host:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 500
        auth:
          $ref: '#/components/schemas/SourceAuth'
        credentialRef:
          $ref: '#/components/schemas/CredentialRef'
        displayName:
          type: string
          maxLength: 120

    Discovery:
      type: object
      required: [connected, statusText, objects]
      properties:
        connected:
          type: boolean
        statusText:
          type: string
          description: '`Connected · read-only · N objects discovered` or the failure text.'
        objects:
          type: array
          items:
            type: object
            required: [name, rows]
            properties:
              name:
                type: string
              rows:
                type: integer

    Binding:
      type: object
      required: [id, kind, sourceId, sourceLabel, conceptId, records, fresh, pending]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: bind
          description: Discriminates a binding from a relation in `Scene.links`.
        seed:
          oneOf:
            - $ref: '#/components/schemas/Seed'
            - type: 'null'
          description: Stored bend seed; null when the binding was created without one, in which case the client redraws the bend from its stream on reload.
        sourceId:
          $ref: '#/components/schemas/Id'
        sourceLabel:
          type: string
        conceptId:
          $ref: '#/components/schemas/Id'
        records:
          type: integer
        fresh:
          type: string
          description: '`2 min`, `4 min`, `11 min`, `1 h`, `paused`, `just now`.'
        pending:
          type: boolean

    BindingDraft:
      type: object
      required: [type, sourceId, conceptIds]
      properties:
        type:
          type: string
          const: bind
        sourceId:
          $ref: '#/components/schemas/Id'
        conceptIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    BindingRow:
      type: object
      required: [concept, binding, approvedAttributes, pendingAttributes, state]
      properties:
        concept:
          $ref: '#/components/schemas/Concept'
        binding:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        approvedAttributes:
          type: integer
        pendingAttributes:
          type: integer
        state:
          type: string
          enum: [bound, no data]

    Attribute:
      type: object
      required: [id, conceptId, name, type, col, fill, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conceptId:
          $ref: '#/components/schemas/Id'
        sourceId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: string
          description: Source column path, for example `sap.mara.matnr`.
        fill:
          type: integer
          minimum: 0
          maximum: 100
        state:
          type: string
          enum: [proposed, approved]

    AttributeDraft:
      type: object
      required: [type, conceptId, name, attributeType, col, fill]
      properties:
        type:
          type: string
          const: attr
        conceptId:
          $ref: '#/components/schemas/Id'
        sourceId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 80
        attributeType:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: string
          maxLength: 200
        fill:
          type: integer
          minimum: 0
          maximum: 100

    ChangeDraft:
      type: object
      description: A change to something already approved. `changeKind` selects which fields of `payload` apply.
      required: [type, changeKind, payload]
      properties:
        type:
          type: string
          const: change
        changeKind:
          type: string
          enum: [rename, delete_concept, edit_relation, remove_relation, unbind, rename_source, remove_source, remove_company, resolve_conflict]
        payload:
          type: object
          properties:
            conceptId:
              $ref: '#/components/schemas/Id'
            newLabel:
              type: string
              minLength: 1
              maxLength: 120
            relationId:
              $ref: '#/components/schemas/Id'
            action:
              type: string
              minLength: 1
              maxLength: 60
            reverse:
              type: boolean
            bindingId:
              $ref: '#/components/schemas/Id'
            sourceId:
              $ref: '#/components/schemas/Id'
            companyId:
              $ref: '#/components/schemas/Id'
            conflictConceptIds:
              type: array
              minItems: 2
              maxItems: 2
              items:
                $ref: '#/components/schemas/Id'
        caption:
          type: string
          maxLength: 300

    ProposalDraft:
      oneOf:
        - $ref: '#/components/schemas/ConceptDraft'
        - $ref: '#/components/schemas/SpecDraft'
        - $ref: '#/components/schemas/RelationDraft'
        - $ref: '#/components/schemas/SourceDraft'
        - $ref: '#/components/schemas/BindingDraft'
        - $ref: '#/components/schemas/AttributeDraft'
        - $ref: '#/components/schemas/ChangeDraft'
      discriminator:
        propertyName: type
        mapping:
          concept: '#/components/schemas/ConceptDraft'
          spec: '#/components/schemas/SpecDraft'
          relation: '#/components/schemas/RelationDraft'
          source: '#/components/schemas/SourceDraft'
          bind: '#/components/schemas/BindingDraft'
          attr: '#/components/schemas/AttributeDraft'
          change: '#/components/schemas/ChangeDraft'

    Proposal:
      type: object
      required: [id, type, state, title, color, html, ready, deps, proposer, createdAt, relationIds, bindingIds, approvals]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum: [concept, spec, relation, source, bind, attr, change]
        changeKind:
          type: [string, 'null']
          enum: [rename, delete_concept, edit_relation, remove_relation, unbind, rename_source, remove_source, remove_company, resolve_conflict, remove_cross_company_links, null]
        state:
          type: string
          enum: [pending, half_approved, approved, rejected]
        title:
          type: string
        heading:
          type: string
          description: Panel heading - `New concept`, `Specialisation`, `Relation`, `Change`, `Data source`, `Binding`, `Attribute`, suffixed with ` · <domain name>` when a domain applies.
        color:
          type: string
        companyId:
          type: [string, 'null']
          format: uuid
        domainProductId:
          type: [string, 'null']
          format: uuid
        parentLabel:
          type: [string, 'null']
        deps:
          type: array
          items:
            type: string
          description: Labels and named predicates that must hold before approval.
        ready:
          type: boolean
        waitFor:
          type: [string, 'null']
          description: Shown as `after <waitFor>` while blocked.
        html:
          type: string
          maxLength: 2000
          description: Server-generated; every interpolated label is HTML-escaped and only `<b>`, `<i>` and `<span class="...">` may appear. The Studio renders it with those three tags allow-listed and everything else as text.
        why:
          type: [string, 'null']
        caption:
          type: [string, 'null']
        conceptId:
          type: [string, 'null']
          format: uuid
        relationId:
          type: [string, 'null']
          format: uuid
        relationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        sourceId:
          type: [string, 'null']
          format: uuid
        bindingIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        attributeId:
          type: [string, 'null']
          format: uuid
        proposer:
          $ref: '#/components/schemas/Actor'
        approvals:
          type: array
          maxItems: 2
          items:
            type: object
            required: [ordinal, userId, approvedAt]
            properties:
              ordinal:
                type: integer
                enum: [1, 2]
              userId:
                $ref: '#/components/schemas/Id'
              userName:
                type: string
              approvedAt:
                type: string
                format: date-time
        bulk:
          type: boolean
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        artefacts:
          $ref: '#/components/schemas/Artefacts'

    Artefacts:
      type: object
      description: The current state of everything a proposal created or changed, so a client can apply it without a fetch.
      properties:
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/Concept'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'

    DecisionResult:
      type: object
      required: [proposal, artefacts, cascaded, audit]
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        artefacts:
          $ref: '#/components/schemas/Artefacts'
        cascaded:
          type: array
          description: Proposals rejected by cascade, or created by approval (attribute discovery, conflict detection).
          items:
            $ref: '#/components/schemas/Proposal'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        caption:
          type: string

    BulkResult:
      type: object
      required: [approved, rejected, rounds, remaining]
      properties:
        approved:
          type: integer
        rejected:
          type: integer
        rounds:
          type: integer
        remaining:
          type: integer
          description: Open proposals left, blocked ones included.
        caption:
          type: string

    FinaliseResult:
      type: object
      required: [companies, concepts, bound, equivalences, approved, scenesPlayed]
      properties:
        companies:
          type: integer
        concepts:
          type: integer
        bound:
          type: integer
        equivalences:
          type: integer
        approved:
          type: integer
        scenesPlayed:
          type: integer
        caption:
          type: string

    Scene:
      type: object
      required: [sequence, serverTime, companies, nodes, links, proposals, settings, appearance, viewState, connectors, demoStory]
      properties:
        sequence:
          type: integer
          description: Event sequence at the time of the snapshot; pass it as `since` when opening the WebSocket.
        serverTime:
          type: string
          format: date-time
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        nodes:
          type: array
          description: Concepts (root and concept) and sources, the union the physics runs on.
          items:
            oneOf:
              - $ref: '#/components/schemas/Concept'
              - $ref: '#/components/schemas/Source'
            discriminator:
              propertyName: kind
              mapping:
                root: '#/components/schemas/Concept'
                concept: '#/components/schemas/Concept'
                source: '#/components/schemas/Source'
        links:
          type: array
          description: Relations and bindings; a binding is drawn as a `bind` link from the source to the concept.
          items:
            oneOf:
              - $ref: '#/components/schemas/Relation'
              - $ref: '#/components/schemas/Binding'
            discriminator:
              propertyName: kind
              mapping:
                rel: '#/components/schemas/Relation'
                isa: '#/components/schemas/Relation'
                same: '#/components/schemas/Relation'
                clash: '#/components/schemas/Relation'
                bind: '#/components/schemas/Binding'
        proposals:
          type: array
          description: Open proposals with `ready` and `waitFor` evaluated.
          items:
            $ref: '#/components/schemas/Proposal'
        settings:
          $ref: '#/components/schemas/Settings'
        appearance:
          $ref: '#/components/schemas/Appearance'
        viewState:
          $ref: '#/components/schemas/ViewState'
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorType'
        demoStory:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
            sceneIdx:
              type: integer
            sceneCount:
              type: integer

    ViewState:
      type: object
      required: [coverage, sceneIdx]
      properties:
        coverage:
          type: boolean
        sceneIdx:
          type: integer
          minimum: 0

    NodePosition:
      type: object
      required: [id, kind, x, y, pinned]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [concept, source]
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean

    Coverage:
      type: object
      required: [companies, unboundConceptIds]
      properties:
        companies:
          type: array
          items:
            type: object
            required: [companyId, concepts, bound, percentBound, domains]
            properties:
              companyId:
                $ref: '#/components/schemas/Id'
              concepts:
                type: integer
              bound:
                type: integer
              percentBound:
                type: integer
              domains:
                type: array
                items:
                  type: object
                  required: [domainProductId, members, bound]
                  properties:
                    domainProductId:
                      $ref: '#/components/schemas/Id'
                    members:
                      type: integer
                    bound:
                      type: integer
        unboundConceptIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'

    Lineage:
      type: object
      required: [concept, ancestors, descendants, dataLineage, setIds, caption]
      properties:
        concept:
          $ref: '#/components/schemas/Concept'
        ancestors:
          type: array
          description: From the root down to the parent.
          items:
            $ref: '#/components/schemas/LineageStep'
        descendants:
          type: array
          items:
            $ref: '#/components/schemas/LineageNode'
        dataLineage:
          type: array
          items:
            type: object
            required: [sourceId, sourceLabel, conceptId, conceptLabel, records, fresh, attributes]
            properties:
              sourceId:
                $ref: '#/components/schemas/Id'
              sourceLabel:
                type: string
              conceptId:
                $ref: '#/components/schemas/Id'
              conceptLabel:
                type: string
              records:
                type: integer
              fresh:
                type: string
              attributes:
                type: integer
        setIds:
          type: array
          description: Every node in the lineage set - the cell, ancestors, descendants and their bound sources.
          items:
            $ref: '#/components/schemas/Id'
        caption:
          type: string

    LineageStep:
      type: object
      required: [conceptId, label, how, pending, bornAt]
      properties:
        conceptId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        how:
          type: string
          description: '`the company`, `is a <parent>`, `<parent> <action> <child>` or `<child> <action> <parent>`.'
        domainName:
          type: [string, 'null']
        pending:
          type: boolean
        bornAt:
          type: string
          format: date-time

    LineageNode:
      type: object
      required: [conceptId, label, how, pending, below, children]
      properties:
        conceptId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        how:
          type: string
        pending:
          type: boolean
        below:
          type: integer
          description: Number of descendants under this node.
        children:
          type: array
          items:
            $ref: '#/components/schemas/LineageNode'

    TeachResult:
      type: object
      required: [outcome, domainKey, intents, drafts, caption]
      properties:
        outcome:
          type: string
          enum: [understood, partly_understood, not_understood, scene]
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
          description: The domain prefix stripped from the sentence, if any.
        intents:
          type: array
          items:
            $ref: '#/components/schemas/Intent'
        drafts:
          type: array
          description: Proposal drafts in submission order, ready for `POST /proposals/batch`.
          items:
            $ref: '#/components/schemas/ProposalDraft'
        statements:
          type: array
          description: One line per intent for the caption, for example `A pred B (new)`.
          items:
            type: string
        caption:
          type: string
        scene:
          oneOf:
            - $ref: '#/components/schemas/DemoScene'
            - type: 'null'

    Intent:
      type: object
      required: [kind, subject, object, subjectResolved, objectResolved]
      properties:
        kind:
          type: string
          enum: [spec, rel]
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        rule:
          type: string
        subjectResolved:
          type: [string, 'null']
          format: uuid
        objectResolved:
          type: [string, 'null']
          format: uuid

    CurrentUser:
      type: object
      required: [user, effectiveRoles, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        effectiveRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        permissions:
          type: array
          description: Coarse permissions the Studio uses to enable buttons; the server re-checks every call.
          items:
            type: string
            enum: [model.read, view.write, proposal.create, proposal.approve, proposal.second_approve, proposal.reject, proposal.finalise, settings.write, appearance.write, company.create, source.manage, group.manage, directory.read, agent.manage, audit.read, demo.run]

    User:
      type: object
      required: [id, name, email, groups, effectiveRoles]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: [string, 'null']
        companyId:
          type: [string, 'null']
          format: uuid
        companyName:
          type: [string, 'null']
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
        effectiveRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        lastLoginAt:
          type: [string, 'null']
          format: date-time

    Group:
      type: object
      required: [id, name, description, memberCount, roles]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        validUntil:
          type: [string, 'null']
          format: date-time
        memberCount:
          type: integer
        members:
          type: array
          description: Present on the single-group read.
          items:
            $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'

    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 300
        validUntil:
          type: [string, 'null']
          format: date-time

    Scope:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [tenant, company, domain]
        companyId:
          type: [string, 'null']
          format: uuid
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        label:
          type: string
          description: '`Tenant`, the company name, or the domain product name.'
      description: A domain scope names a domain product family by `domainKey` and covers that domain product in every company; `companyId` must be null for it and the API answers `422` otherwise. A company scope carries `companyId` only.

    RoleAssignmentInput:
      type: object
      required: [role, scope]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleAssignment:
      type: object
      required: [id, role, scope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/RoleName'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleInfo:
      type: object
      required: [role, label, description, assigned]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
        label:
          type: string
        description:
          type: string
        assigned:
          type: integer
          description: Distinct users holding the role through groups; agents with access for the Agent row.

    AgentCreate:
      type: object
      required: [name, platform, issuer, subject]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 60
        issuer:
          type: string
          maxLength: 300
          description: Token issuer the agent authenticates with.
        subject:
          type: string
          maxLength: 300
          description: Token subject (client id or workload identity) the agent authenticates with.
        companyId:
          type: [string, 'null']
          format: uuid
          description: Company scope; null means tenant-wide.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        owner:
          type: string
          maxLength: 120
          default: ''

    Agent:
      type: object
      required: [id, name, platform, owner, access, reads, costEur]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        platform:
          type: string
        issuer:
          type: string
          description: Present only for callers holding `agent.manage`.
        subject:
          type: string
          description: Present only for callers holding `agent.manage`.
        companyId:
          type: [string, 'null']
          format: uuid
          description: Company scope; null means tenant-wide.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        domainName:
          type: [string, 'null']
        owner:
          type: string
        access:
          type: boolean
        reads:
          type: integer
          description: Model reads this month.
        costEur:
          type: number
          description: Cost this month in euros.

    CostSummary:
      type: object
      required: [month, measuredEur, allocatedEur, agentsRegistered, agentsWithAccess, reads, byPlatform]
      properties:
        month:
          type: string
          format: date
        measuredEur:
          type: number
        allocatedEur:
          type: number
        agentsRegistered:
          type: integer
        agentsWithAccess:
          type: integer
        reads:
          type: integer
        byPlatform:
          type: array
          description: Sorted by cost descending.
          items:
            type: object
            required: [platform, agentsWithAccess, costEur, sharePercent]
            properties:
              platform:
                type: string
              agentsWithAccess:
                type: integer
              costEur:
                type: number
              sharePercent:
                type: integer

    Settings:
      type: object
      required: [voice, importDocs, liveTeaching, everyoneTeaches, approvalRequired, twoApprovers, autoAttrs, notifyOwners, multiCompany, crossCompany, animations, coverageDefault, legend, readOnlyConnectors, refresh, agentAccess, costCap, demoStory]
      properties:
        voice:
          type: boolean
        importDocs:
          type: boolean
        liveTeaching:
          type: boolean
        everyoneTeaches:
          type: boolean
        approvalRequired:
          type: boolean
          const: true
          description: Locked on.
        twoApprovers:
          type: boolean
        autoAttrs:
          type: boolean
        notifyOwners:
          type: boolean
        multiCompany:
          type: boolean
        crossCompany:
          type: boolean
        animations:
          type: boolean
        coverageDefault:
          type: boolean
        legend:
          type: boolean
        readOnlyConnectors:
          type: boolean
          const: true
          description: Locked on.
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        agentAccess:
          type: boolean
        costCap:
          type: boolean
        demoStory:
          type: boolean
        egressAllowlist:
          type: array
          maxItems: 200
          description: Hosts connector discovery may reach even when they resolve to loopback, link-local or private ranges.
          items:
            type: string
            maxLength: 300

    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        voice:
          type: boolean
        importDocs:
          type: boolean
        liveTeaching:
          type: boolean
        everyoneTeaches:
          type: boolean
        twoApprovers:
          type: boolean
        autoAttrs:
          type: boolean
        notifyOwners:
          type: boolean
        multiCompany:
          type: boolean
        crossCompany:
          type: boolean
          description: May only be turned on here, or off when no cross-company relation exists.
        animations:
          type: boolean
        coverageDefault:
          type: boolean
        legend:
          type: boolean
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        agentAccess:
          type: boolean
        costCap:
          type: boolean
        demoStory:
          type: boolean
        egressAllowlist:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 300

    Appearance:
      type: object
      required: [theme, colors, accent, source, defaults]
      properties:
        theme:
          type: string
          enum: [dark, light]
        colors:
          type: object
          description: Effective colour per domain key (override or template).
          additionalProperties:
            $ref: '#/components/schemas/Hex'
        accent:
          $ref: '#/components/schemas/Hex'
        source:
          $ref: '#/components/schemas/Hex'
        defaults:
          type: object
          required: [colors, accent, source]
          properties:
            colors:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Hex'
            accent:
              $ref: '#/components/schemas/Hex'
            source:
              $ref: '#/components/schemas/Hex'

    AppearancePatch:
      type: object
      minProperties: 1
      properties:
        theme:
          type: string
          enum: [dark, light]
        colors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Hex'
        accent:
          $ref: '#/components/schemas/Hex'
        source:
          $ref: '#/components/schemas/Hex'

    CrossCompanyImpact:
      type: object
      required: [relations, pendingProposals, pairs, samples]
      properties:
        relations:
          type: integer
        pendingProposals:
          type: integer
        pairs:
          type: array
          items:
            type: object
            required: [companyA, companyB, count]
            properties:
              companyA:
                type: string
              companyB:
                type: string
              count:
                type: integer
        samples:
          type: array
          maxItems: 6
          items:
            type: string
            description: '`<A> <action> <B>`'

    CrossCompanyDisabled:
      type: object
      required: [removedRelations, rejectedProposals, proposal, audit, settings]
      properties:
        removedRelations:
          type: integer
        rejectedProposals:
          type: integer
        proposal:
          $ref: '#/components/schemas/Proposal'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        settings:
          $ref: '#/components/schemas/Settings'

    AuditEntry:
      type: object
      description: One audit row. `companyIds` is its audience; `GET /audit` and the `audit.appended` event apply the same read rule.
      required: [id, at, actor, kind, what, ok, companyIds]
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        kind:
          type: string
          description: A proposal type for decisions, or `setting`, `groups`, `roles`, `source`, `company`, `agents`, `demo`, `list`, `appearance`.
        what:
          type: string
        ok:
          type: boolean
          description: True renders `approved`, false renders `rejected`.
        proposalId:
          type: [string, 'null']
          format: uuid
        companyIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
          description: Every company whose name, labels or artefacts the entry mentions - both companies of a cross-company proposal, the added company of a `company` entry, the company of a role scope in a `roles` entry. Empty means tenant-wide. Readable by a caller holding `audit.read` in a scope containing every listed company; an empty list needs `audit.read` at any scope.

    DemoScene:
      type: object
      required: [index, name, say, match]
      properties:
        index:
          type: integer
        name:
          type: string
        say:
          type: string
          description: The placeholder sentence shown in the teach input.
        match:
          type: string
          description: Case-insensitive regular expression that intercepts a typed sentence.
