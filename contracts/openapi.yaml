          format: uuid
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        color:
          $ref: '#/components/schemas/Hex'
        rule:
          type: [string, 'null']
        pending:
          type: boolean
        conflict:
          type: boolean
        parentId:
