        sourceId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 80
        attributeType:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: string
          maxLength: 200
        fill:
          type: integer
          minimum: 0
          maximum: 100

    ChangeDraft:
      type: object
      description: A change to something already approved. `changeKind` selects which fields of `payload` apply.
      required: [type, changeKind, payload]
      properties:
        type:
          type: string
          const: change
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        changeKind:
          type: string
          enum: [rename, delete_concept, edit_relation, remove_relation, unbind, rename_source, remove_source, remove_company, resolve_conflict]
        payload:
          type: object
          properties:
            conceptId:
              $ref: '#/components/schemas/Id'
            newLabel:
              type: string
              minLength: 1
              maxLength: 120
            relationId:
              $ref: '#/components/schemas/Id'
            action:
              type: string
              minLength: 1
              maxLength: 60
            reverse:
              type: boolean
            bindingId:
              $ref: '#/components/schemas/Id'
            sourceId:
              $ref: '#/components/schemas/Id'
            companyId:
              $ref: '#/components/schemas/Id'
            conflictConceptIds:
              type: array
              minItems: 2
              maxItems: 2
              items:
                $ref: '#/components/schemas/Id'
        caption:
          type: string
          maxLength: 300

    ProposalDraft:
      oneOf:
        - $ref: '#/components/schemas/ConceptDraft'
        - $ref: '#/components/schemas/SpecDraft'
        - $ref: '#/components/schemas/RelationDraft'
        - $ref: '#/components/schemas/SourceDraft'
        - $ref: '#/components/schemas/BindingDraft'
        - $ref: '#/components/schemas/AttributeDraft'
        - $ref: '#/components/schemas/ChangeDraft'
      discriminator:
        propertyName: type
        mapping:
          concept: '#/components/schemas/ConceptDraft'
          spec: '#/components/schemas/SpecDraft'
          relation: '#/components/schemas/RelationDraft'
          source: '#/components/schemas/SourceDraft'
          bind: '#/components/schemas/BindingDraft'
          attr: '#/components/schemas/AttributeDraft'
          change: '#/components/schemas/ChangeDraft'

    Origin:
      type: string
      enum: [text, speech, document]
      description: How the content of a proposal entered Ontaix - `text` typed in the teach bar or any dialog, `speech` from the teach bar microphone (sent as the final transcript), `document` from `POST /import/sentences`. Always present on output. `text` and `speech` are declared by the client and are a display and audit label, not a trust signal; `document` is set by the server only, for drafts that cite a stored import sentence through `importRef`.

    InputOrigin:
      type: string
      enum: [text, speech]
      default: text
      description: The origin a client declares. Ignored when `importRef` is present, because the server then records `document` whatever the client sends.

    ImportRef:
      type: object
      additionalProperties: false
      description: Cites one stored sentence of a document import. Accepted by `POST /teach/parse`, `POST /proposals` and `POST /proposals/batch` only; the resource endpoints refuse it with `422`. The import must belong to the caller's tenant and to the same actor (user or agent) that created it, otherwise `404 not_found`; past `expiresAt` it is `410 import_expired`. The server reads the sentence text, the position, the file name and the media type from the stored `document_import` row, never from the client, and records `origin` `document` with that `originDetail`. `document` attests that the draft was submitted citing that sentence of that file; the labels of a draft remain what the client sent.
      required: [importId, sentenceIndex]
      properties:
        importId:
          $ref: '#/components/schemas/Id'
        sentenceIndex:
          type: integer
          minimum: 0
          maximum: 1999
          description: 0-based index into the import's `sentences`.

    OriginDetail:
      type: object
      additionalProperties: false
      description: Where a `document` proposal came from, copied from the stored import when the proposal is created, so it survives the import's expiry. Output only; clients never send it.
      required: [fileName, mediaType, sentenceIndex]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
          description: The basename of the uploaded file name - the server strips any directory part and refuses `/`, `\`, `:`, C0 and C1 control characters, DEL, the bidirectional controls U+061C, U+200E, U+200F, U+202A to U+202E and U+2066 to U+2069, the zero-width characters U+200B to U+200D, the line and paragraph separators U+2028 and U+2029, and U+FEFF. At most 255 characters and at most 1020 bytes in UTF-8 (the byte bound is checked by the server, `422`). User-supplied text - HTML-escaped wherever the server interpolates it (`Proposal.html`, captions, audit `what`), and rendered by the Studio as text only.
        mediaType:
          type: string
          enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf]
        sentenceIndex:
          type: integer
          minimum: 0
          maximum: 1999
        position:
          $ref: '#/components/schemas/DocumentPosition'

    DocumentPosition:
      type: object
      additionalProperties: false
      description: Where in the document the sentence was found, when extraction knows it - a 1-based page or a 1-based paragraph.
      required: [unit, index]
      properties:
        unit:
          type: string
          enum: [page, paragraph]
        index:
          type: integer
          minimum: 1
          maximum: 100000

    Proposal:
      type: object
      required: [id, type, state, title, color, html, ready, deps, proposer, origin, originDetail, createdAt, relationIds, bindingIds, approvals]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum: [concept, spec, relation, source, bind, attr, change]
        changeKind:
          type: [string, 'null']
          enum: [rename, delete_concept, edit_relation, remove_relation, unbind, rename_source, remove_source, remove_company, resolve_conflict, remove_cross_company_links, null]
        state:
          type: string
          enum: [pending, half_approved, approved, rejected]
        title:
          type: string
        heading:
          type: string
          description: Panel heading - `New concept`, `Specialisation`, `Relation`, `Change`, `Data source`, `Binding`, `Attribute`, suffixed with ` · <domain name>` when a domain applies.
        color:
          type: string
        companyId:
          type: [string, 'null']
          format: uuid
        domainProductId:
          type: [string, 'null']
          format: uuid
        parentLabel:
          type: [string, 'null']
        deps:
          type: array
          items:
            type: string
          description: Labels and named predicates that must hold before approval.
        ready:
          type: boolean
        waitFor:
          type: [string, 'null']
          description: Shown as `after <waitFor>` while blocked.
        html:
          type: string
          maxLength: 2000
          description: Server-generated; every interpolated user-supplied string (labels, actions, captions, `originDetail.fileName`) is HTML-escaped and only `<b>`, `<i>` and `<span class="...">` may appear. The Studio renders it with those three tags allow-listed and everything else as text.
        why:
          type: [string, 'null']
        caption:
          type: [string, 'null']
        conceptId:
          type: [string, 'null']
          format: uuid
        relationId:
          type: [string, 'null']
          format: uuid
        relationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        sourceId:
          type: [string, 'null']
          format: uuid
        bindingIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        attributeId:
          type: [string, 'null']
          format: uuid
        proposer:
          $ref: '#/components/schemas/Actor'
        origin:
          $ref: '#/components/schemas/Origin'
        originDetail:
          oneOf:
            - $ref: '#/components/schemas/OriginDetail'
            - type: 'null'
          description: Set exactly when `origin` is `document`, copied from the stored import; null otherwise.
        approvals:
          type: array
          maxItems: 2
          items:
            type: object
            required: [ordinal, userId, approvedAt]
            properties:
              ordinal:
                type: integer
                enum: [1, 2]
              userId:
                $ref: '#/components/schemas/Id'
              userName:
                type: string
              approvedAt:
                type: string
                format: date-time
        bulk:
          type: boolean
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        artefacts:
          $ref: '#/components/schemas/Artefacts'

    Artefacts:
      type: object
      description: The current state of everything a proposal created or changed, so a client can apply it without a fetch.
      properties:
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/Concept'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'

    DecisionResult:
      type: object
      required: [proposal, artefacts, cascaded, audit]
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        artefacts:
          $ref: '#/components/schemas/Artefacts'
        cascaded:
          type: array
          description: Proposals rejected by cascade, or created by approval (attribute discovery, conflict detection).
          items:
            $ref: '#/components/schemas/Proposal'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        caption:
          type: string

    BulkResult:
      type: object
      required: [approved, rejected, rounds, remaining]
      properties:
        approved:
          type: integer
        rejected:
          type: integer
        rounds:
          type: integer
        remaining:
          type: integer
          description: Open proposals left, blocked ones included.
        caption:
          type: string

    Scene:
      type: object
      required: [sequence, serverTime, companies, nodes, links, proposals, settings, appearance, viewState, connectors]
      properties:
        sequence:
          type: integer
          description: Event sequence at the time of the snapshot; pass it as `since` when opening the WebSocket.
        serverTime:
          type: string
          format: date-time
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        nodes:
          type: array
          description: Concepts (root and concept) and sources, the union the physics runs on.
          items:
            oneOf:
              - $ref: '#/components/schemas/Concept'
              - $ref: '#/components/schemas/Source'
            discriminator:
              propertyName: kind
              mapping:
                root: '#/components/schemas/Concept'
                concept: '#/components/schemas/Concept'
                source: '#/components/schemas/Source'
        links:
          type: array
          description: Relations and bindings; a binding is drawn as a `bind` link from the source to the concept.
          items:
            oneOf:
              - $ref: '#/components/schemas/Relation'
              - $ref: '#/components/schemas/Binding'
            discriminator:
              propertyName: kind
              mapping:
                rel: '#/components/schemas/Relation'
                isa: '#/components/schemas/Relation'
                same: '#/components/schemas/Relation'
                clash: '#/components/schemas/Relation'
                bind: '#/components/schemas/Binding'
        proposals:
          type: array
          description: Open proposals with `ready` and `waitFor` evaluated.
          items:
            $ref: '#/components/schemas/Proposal'
        settings:
          $ref: '#/components/schemas/Settings'
        appearance:
          $ref: '#/components/schemas/Appearance'
        viewState:
          $ref: '#/components/schemas/ViewState'
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorType'

    ViewState:
      type: object
      required: [coverage]
      properties:
        coverage:
          type: boolean

    NodePosition:
      type: object
      required: [id, kind, x, y, pinned]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [concept, source]
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean

    Coverage:
      type: object
      required: [companies, unboundConceptIds]
      properties:
        companies:
          type: array
          items:
            type: object
            required: [companyId, concepts, bound, percentBound, domains]
            properties:
              companyId:
                $ref: '#/components/schemas/Id'
              concepts:
                type: integer
              bound:
                type: integer
              percentBound:
                type: integer
              domains:
                type: array
                items:
                  type: object
                  required: [domainProductId, members, bound]
                  properties:
                    domainProductId:
                      $ref: '#/components/schemas/Id'
                    members:
                      type: integer
                    bound:
                      type: integer
        unboundConceptIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'

    Lineage:
      type: object
      required: [concept, ancestors, descendants, dataLineage, setIds, caption]
      properties:
        concept:
          $ref: '#/components/schemas/Concept'
        ancestors:
          type: array
          description: From the root down to the parent.
          items:
            $ref: '#/components/schemas/LineageStep'
        descendants:
          type: array
          items:
            $ref: '#/components/schemas/LineageNode'
        dataLineage:
          type: array
          items:
            type: object
            required: [sourceId, sourceLabel, conceptId, conceptLabel, records, fresh, attributes]
            properties:
              sourceId:
                $ref: '#/components/schemas/Id'
              sourceLabel:
                type: string
              conceptId:
                $ref: '#/components/schemas/Id'
              conceptLabel:
                type: string
              records:
                type: integer
              fresh:
                type: string
              attributes:
                type: integer
        setIds:
          type: array
          description: Every node in the lineage set - the cell, ancestors, descendants and their bound sources.
          items:
            $ref: '#/components/schemas/Id'
        caption:
          type: string

    LineageStep:
      type: object
      required: [conceptId, label, how, pending, bornAt]
      properties:
        conceptId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        how:
          type: string
          description: '`the company`, `is a <parent>`, `<parent> <action> <child>` or `<child> <action> <parent>`.'
        domainName:
          type: [string, 'null']
        pending:
          type: boolean
        bornAt:
          type: string
          format: date-time

    LineageNode:
      type: object
      required: [conceptId, label, how, pending, below, children]
      properties:
        conceptId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        how:
          type: string
        pending:
          type: boolean
        below:
          type: integer
          description: Number of descendants under this node.
        children:
          type: array
          items:
            $ref: '#/components/schemas/LineageNode'

    TeachResult:
      type: object
      required: [outcome, domainKey, intents, drafts, caption, origin, originDetail, extractor, degraded, llmOutcome, draftNotes, unresolved]
      properties:
        extractor:
          type: string
          enum: [rules, llm, rules+llm]
          description: Who produced the returned intents - `rules` when the model step did not run or gave no valid answer; `llm` when the model's valid answer replaced the grammar's (triggered by a back-reference, a list preamble, an unknown verb or a `not_understood` grammar outcome); `rules+llm` when the grammar's intents were kept and the model's were added (triggered by `partly_understood` alone).
        degraded:
          type: boolean
          description: True when the model step was triggered but did not contribute - `llmOutcome` is `not_configured`, `rate_limited`, `budget_exhausted`, `timeout`, `provider_error` or `invalid_output`. The result is then the grammar's alone and the sentence is listed in `unresolved`.
        llmOutcome:
          type: string
          enum: [not_triggered, used, not_configured, rate_limited, budget_exhausted, timeout, provider_error, invalid_output]
          description: What happened to the model step. `not_triggered` - no fallback trigger held. `used` - the model answered and its output validated. `not_configured` - the deployment has no model provider or key. `rate_limited` - the caller's hourly `llm` budget is spent. `budget_exhausted` - the tenant's `llmMonthlyTokenCap` is reached (or is 0). `timeout` - no answer within 15 seconds. `provider_error` - the provider refused or failed. `invalid_output` - the answer did not validate against `contracts/teach-extraction.schema.json` or cited a candidate that was not sent. None of these is an error status; the response is `200`.
        draftNotes:
          type: array
          maxItems: 60
          description: One entry per element of `drafts`, in the same order. Advisory for the reviewer; never submitted with the draft.
          items:
            $ref: '#/components/schemas/DraftNote'
        unresolved:
          type: array
          maxItems: 20
          description: Phrases of the sentence that produced no draft, with the reason. Empty when everything was understood. Each `text` is a substring of the sentence the server holds (or the whole sentence), never text taken from the model. At most 20 entries; phrases beyond the 20th are dropped from the list, and the result stays `partly_understood` or `not_understood`.
          items:
            $ref: '#/components/schemas/UnresolvedPhrase'
        origin:
          $ref: '#/components/schemas/Origin'
        originDetail:
          oneOf:
            - $ref: '#/components/schemas/OriginDetail'
            - type: 'null'
        outcome:
          type: string
          enum: [understood, partly_understood, not_understood]
          description: Computed on the final result - `understood` when there is at least one intent and `unresolved` is empty, `partly_understood` when there are intents and `unresolved` is not empty, `not_understood` when there is no intent.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
          description: The domain prefix stripped from the sentence, if any.
        intents:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/Intent'
        drafts:
          type: array
          maxItems: 60
          description: Proposal drafts in submission order, ready for `POST /proposals/batch`; each carries the request's `origin` and `importRef`. At most 60, counting grammar and model drafts together. When the result would hold more, the server keeps the intents whose drafts fit, in sentence order (grammar intents first for `rules+llm`), drops the rest with their drafts, and lists their text as one `unresolved` entry with reason `too_many_drafts`.
          items:
            $ref: '#/components/schemas/ProposalDraft'
        statements:
          type: array
          description: One line per intent for the caption, for example `A pred B (new)`.
          items:
            type: string
        caption:
          type: string

    Intent:
      type: object
      required: [kind, subject, object, subjectResolved, objectResolved]
      properties:
        kind:
          type: string
          enum: [spec, rel]
        subject:
          type: string
        predicate:
          type: string
        object:
          type: string
        rule:
          type: string
          description: The grammar pattern that matched, or `llm` for an intent returned by the model step.
        subjectResolved:
          type: [string, 'null']
          format: uuid
        objectResolved:
          type: [string, 'null']
          format: uuid

    DraftNote:
      type: object
      additionalProperties: false
      required: [extractor, confidence]
      properties:
        extractor:
          type: string
          enum: [rules, llm]
          description: Whether the grammar or the model step produced the draft.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 1 for a grammar draft. For a model draft, the confidence the model reported for the intent the draft came from; intents reported below 0.4 are not drafted and appear in `unresolved` with reason `low_confidence`. Advisory only - every draft still needs a human approval.
        explanation:
          type: string
          maxLength: 300
          description: Model drafts only - a short plain-text reason, for example `these services refers to Services from the previous sentence`. Text only, never markup; HTML-escaped wherever the server interpolates it and rendered by any client as text.

    UnresolvedPhrase:
      type: object
      additionalProperties: false
      required: [text, reason]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 400
          description: A substring of the sentence the server holds, or the whole sentence when the model step failed or was skipped. For a phrase the model reported, the server uses the matching substring of the sentence and the whole sentence when there is no exact match.
        reason:
          type: string
          enum: [not_understood, ambiguous_reference, low_confidence, model_unavailable, model_invalid_output, too_many_drafts]
          description: '`not_understood` - neither the grammar nor the model found an intent. `ambiguous_reference` - the model could not tell what a back-reference points to. `low_confidence` - the model reported a confidence below 0.4. `model_unavailable` - the model step was triggered and did not answer (`llmOutcome` `not_configured`, `rate_limited`, `budget_exhausted`, `timeout` or `provider_error`). `model_invalid_output` - the answer failed validation. `too_many_drafts` - the intents beyond the 60-draft cap of `drafts`.'

    CurrentUser:
      type: object
      required: [user, effectiveRoles, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        effectiveRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        permissions:
          type: array
          description: Coarse permissions the Studio uses to enable buttons; the server re-checks every call.
          items:
            type: string
            enum: [model.read, view.write, proposal.create, proposal.approve, proposal.second_approve, proposal.reject, settings.write, appearance.write, company.create, source.manage, group.manage, directory.read, agent.manage, audit.read]

    User:
      type: object
      required: [id, name, email, groups, effectiveRoles]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: [string, 'null']
        companyId:
          type: [string, 'null']
          format: uuid
        companyName:
          type: [string, 'null']
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
        effectiveRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        lastLoginAt:
          type: [string, 'null']
          format: date-time

    Group:
      type: object
      required: [id, name, description, memberCount, roles]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        validUntil:
          type: [string, 'null']
          format: date-time
        memberCount:
          type: integer
        members:
          type: array
          description: Present on the single-group read.
          items:
            $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'

    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 300
        validUntil:
          type: [string, 'null']
          format: date-time

    Scope:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [tenant, company, domain]
        companyId:
          type: [string, 'null']
          format: uuid
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        label:
          type: string
          description: '`Tenant`, the company name, or the domain product name.'
      description: A domain scope names a domain product family by `domainKey` and covers that domain product in every company; `companyId` must be null for it and the API answers `422` otherwise. A company scope carries `companyId` only.

    RoleAssignmentInput:
      type: object
      required: [role, scope]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleAssignment:
      type: object
      required: [id, role, scope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/RoleName'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleInfo:
      type: object
      required: [role, label, description, assigned]
      properties:
        role:
          $ref: '#/components/schemas/RoleName'
        label:
          type: string
        description:
          type: string
        assigned:
          type: integer
          description: Distinct users holding the role through groups; agents with access for the Agent row.

    AgentCreate:
      type: object
      required: [name, platform, issuer, subject]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 60
        issuer:
          type: string
          maxLength: 300
          description: Token issuer the agent authenticates with.
        subject:
          type: string
          maxLength: 300
          description: Token subject (client id or workload identity) the agent authenticates with.
        companyId:
          type: [string, 'null']
          format: uuid
          description: Company scope; null means tenant-wide.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        owner:
          type: string
          maxLength: 120
          default: ''

    Agent:
      type: object
      required: [id, name, platform, owner, access, reads, costEur]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        platform:
          type: string
        issuer:
          type: string
          description: Present only for callers holding `agent.manage`.
        subject:
          type: string
          description: Present only for callers holding `agent.manage`.
        companyId:
          type: [string, 'null']
          format: uuid
          description: Company scope; null means tenant-wide.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        domainName:
          type: [string, 'null']
        owner:
          type: string
        access:
          type: boolean
        reads:
          type: integer
          description: Model reads this month.
        costEur:
          type: number
          description: Cost this month in euros.

    CostSummary:
      type: object
      required: [month, measuredEur, allocatedEur, agentsRegistered, agentsWithAccess, reads, byPlatform]
      properties:
        month:
          type: string
          format: date
        measuredEur:
          type: number
        allocatedEur:
          type: number
        agentsRegistered:
          type: integer
        agentsWithAccess:
          type: integer
        reads:
          type: integer
        byPlatform:
          type: array
          description: Sorted by cost descending.
          items:
            type: object
            required: [platform, agentsWithAccess, costEur, sharePercent]
            properties:
              platform:
                type: string
              agentsWithAccess:
                type: integer
              costEur:
                type: number
              sharePercent:
                type: integer
        llm:
          $ref: '#/components/schemas/LlmUsage'

    LlmUsage:
      type: object
      additionalProperties: false
      description: Language model calls Ontaix itself made for the tenant in the month (teach extraction), from the `llm_call` cost records. Separate from the agent figures - `measuredEur` and `byPlatform` stay agent reads through the gateway. The Studio's Cost management page shows no new element for it until the UI contract records one.
      required: [calls, inputTokens, outputTokens, tokensUsed, tokenCap, costEur, byPurpose]
      properties:
        calls:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        tokensUsed:
          type: integer
          minimum: 0
          description: Tokens counted against `tokenCap` this month (input plus output, including reservations of calls still running).
        tokenCap:
          type: integer
          minimum: 0
          description: The tenant's `llmMonthlyTokenCap` setting.
        costEur:
          type: number
          minimum: 0
          description: Estimated cost in euros from the deployment's price table for each model; an estimate, not the provider's invoice.
        byPurpose:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [purpose, calls, costEur]
            properties:
              purpose:
                type: string
                enum: [teach_extraction]
              calls:
                type: integer
                minimum: 0
              costEur:
                type: number
                minimum: 0

    Settings:
      type: object
      required: [voice, importDocs, liveTeaching, everyoneTeaches, approvalRequired, twoApprovers, autoAttrs, notifyOwners, multiCompany, crossCompany, animations, coverageDefault, legend, readOnlyConnectors, refresh, agentAccess, costCap, llmMonthlyTokenCap]
      properties:
        voice:
          type: boolean
        importDocs:
          type: boolean
        liveTeaching:
          type: boolean
        everyoneTeaches:
          type: boolean
        approvalRequired:
          type: boolean
          const: true
          description: Locked on.
        twoApprovers:
          type: boolean
        autoAttrs:
          type: boolean
        notifyOwners:
          type: boolean
        multiCompany:
          type: boolean
        crossCompany:
          type: boolean
        animations:
          type: boolean
        coverageDefault:
          type: boolean
        legend:
          type: boolean
        readOnlyConnectors:
          type: boolean
          const: true
          description: Locked on.
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        agentAccess:
          type: boolean
        costCap:
          type: boolean
          description: Stop agents at 100 percent of the euro allocation. Does not govern Ontaix's own language model calls, which `llmMonthlyTokenCap` bounds.
        llmMonthlyTokenCap:
          $ref: '#/components/schemas/LlmMonthlyTokenCap'
        egressAllowlist:
          type: array
          maxItems: 200
          description: Hosts connector discovery may reach even when they resolve to loopback, link-local or private ranges.
          items:
            type: string
            maxLength: 300

    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        voice:
          type: boolean
        importDocs:
          type: boolean
        liveTeaching:
          type: boolean
        everyoneTeaches:
          type: boolean
        twoApprovers:
          type: boolean
        autoAttrs:
          type: boolean
        notifyOwners:
          type: boolean
        multiCompany:
          type: boolean
        crossCompany:
          type: boolean
          description: May only be turned on here, or off when no cross-company relation exists.
        animations:
          type: boolean
        coverageDefault:
          type: boolean
        legend:
          type: boolean
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        agentAccess:
          type: boolean
        costCap:
          type: boolean
        llmMonthlyTokenCap:
          $ref: '#/components/schemas/LlmMonthlyTokenCap'
        egressAllowlist:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 300

    LlmMonthlyTokenCap:
      type: integer
      minimum: 0
      maximum: 1000000000
      default: 2000000
      description: Tokens (input plus output) Ontaix's own language model calls may use for the tenant per calendar month (UTC), enforced whatever `costCap` says. `0` turns the model step off. When the cap is reached the teach parse still answers `200` with the grammar's result and `llmOutcome` `budget_exhausted`. A change writes the audit entry `llmMonthlyTokenCap set to <n>`.

    Appearance:
      type: object
      required: [theme, colors, accent, source, defaults]
      properties:
        theme:
          type: string
          enum: [dark, light]
        colors:
          type: object
          description: Effective colour per domain key (override or template).
          additionalProperties:
            $ref: '#/components/schemas/Hex'
        accent:
          $ref: '#/components/schemas/Hex'
        source:
          $ref: '#/components/schemas/Hex'
        defaults:
          type: object
          required: [colors, accent, source]
          properties:
            colors:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Hex'
            accent:
              $ref: '#/components/schemas/Hex'
            source:
              $ref: '#/components/schemas/Hex'

    AppearancePatch:
      type: object
      minProperties: 1
      properties:
        theme:
          type: string
          enum: [dark, light]
        colors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Hex'
        accent:
          $ref: '#/components/schemas/Hex'
        source:
          $ref: '#/components/schemas/Hex'

    CrossCompanyImpact:
      type: object
      required: [relations, pendingProposals, pairs, samples]
      properties:
        relations:
          type: integer
        pendingProposals:
          type: integer
        pairs:
          type: array
          items:
            type: object
            required: [companyA, companyB, count]
            properties:
              companyA:
                type: string
              companyB:
                type: string
              count:
                type: integer
        samples:
          type: array
          maxItems: 6
          items:
            type: string
            description: '`<A> <action> <B>`'

    CrossCompanyDisabled:
      type: object
      required: [removedRelations, rejectedProposals, proposal, audit, settings]
      properties:
        removedRelations:
          type: integer
        rejectedProposals:
          type: integer
        proposal:
          $ref: '#/components/schemas/Proposal'
        audit:
          $ref: '#/components/schemas/AuditEntry'
        settings:
          $ref: '#/components/schemas/Settings'

    AuditEntry:
      type: object
      description: One audit row. `companyIds` is its audience; `GET /audit` and the `audit.appended` event apply the same read rule.
      required: [id, at, actor, kind, what, ok, companyIds, origin]
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        kind:
          type: string
          description: A proposal type for decisions, or `setting`, `groups`, `roles`, `source`, `company`, `agents`, `list`, `appearance`.
        what:
          type: string
        ok:
          type: boolean
          description: True renders `approved`, false renders `rejected`.
        proposalId:
          type: [string, 'null']
          format: uuid
        origin:
          oneOf:
            - $ref: '#/components/schemas/Origin'
            - type: 'null'
          description: The origin of the proposal the entry records; null for every entry without a proposal.
        companyIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
          description: Every company whose name, labels or artefacts the entry mentions - both companies of a cross-company proposal, the added company of a `company` entry, the company of a role scope in a `roles` entry. Empty means tenant-wide. Readable by a caller holding `audit.read` in a scope containing every listed company, or on the domain scope named by `domainKey`; an empty list needs `audit.read` at any scope.
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
          description: Template key of the domain product of the proposal the entry records, when that proposal has one; null for every other entry. A caller holding `audit.read` on the domain scope with this key reads the entry whatever its `companyIds`, because that scope covers the domain product in every company and matches the proposals it may decide.
