            application/json:
              schema:
                $ref: '#/components/schemas/CostSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------- Settings
  /settings:
    get:
      tags: [Settings]
      summary: Tenant settings
      operationId: getSettings
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Every setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Settings]
      summary: Change settings
      description: Immediate; every changed key writes an audit entry `<key> enabled|disabled` (`llmMonthlyTokenCap set to <n>` for the token cap). `approvalRequired` and `readOnlyConnectors` are locked (`409 locked_setting`). Turning `crossCompany` off here is refused with `409 confirmation_required` when cross-company relations exist; use the dedicated disable endpoint.
      operationId: updateSettings
      x-ontaix-permission: settings.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /settings/cross-company/impact:
    get:
      tags: [Settings]
      summary: What disabling companies-may-interact would remove
      operationId: getCrossCompanyImpact
      x-ontaix-permission: settings.write
      responses:
        '200':
          description: Company pairs, sample relations and totals for the confirmation dialog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossCompanyImpact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings/cross-company/disable:
    post:
      tags: [Settings]
      summary: Disable companies-may-interact and remove every cross-company relation
      description: Requires the literal confirmation text `disable` (`409 confirmation_mismatch`). In one transaction - a bulk `change` proposal (`remove_cross_company_links`) is created and approved by this confirmation, every cross-company relation is marked dying, every open cross-company proposal is rejected, the setting is turned off, and the audit entry `companies may interact disabled · N cross-company relationships removed` is written. This cannot be undone by re-enabling.
      operationId: disableCrossCompany
      x-ontaix-permission: settings.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  const: disable
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossCompanyDisabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /appearance:
    get:
      tags: [Settings]
      summary: Appearance (theme, domain colours, accent, source colour)
      operationId: getAppearance
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Appearance values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appearance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Settings]
      summary: Change appearance
      description: Immediate and audited. Domain colours are tenant-wide - a domain product keeps the same colour in every company.
      operationId: updateAppearance
      x-ontaix-permission: appearance.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppearancePatch'
      responses:
        '200':
          description: Appearance after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appearance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /appearance/reset:
    post:
      tags: [Settings]
      summary: Reset appearance to defaults
      description: Domain colours back to the templates, accent `#3fb8a9`, source colour `#d6bd8a`. Theme is unchanged.
      operationId: resetAppearance
      x-ontaix-permission: appearance.write
      responses:
        '200':
          description: The defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appearance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Audit
  /audit:
    get:
      tags: [Audit]
      summary: Audit log, newest first
      description: Returns only the entries the caller may read. An entry is readable when the caller holds `audit.read` in a scope that contains every company in the entry's `companyIds`; an entry with an empty `companyIds` is tenant-wide and readable with `audit.read` at any scope. A company-scoped Auditor or Governor therefore never sees an entry naming another company, including a company addition or a cross-company decision. `total` counts readable entries only.
      operationId: listAudit
      x-ontaix-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A page of entries. Filterable - `kind`, `ok`, `actorKind`, `from`, `to`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC ID token or access token from any provider the tenant trusts (`tenant_identity_provider` maps issuer and audience to the tenant). Authentication only; roles come from Ontaix groups.
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Agent bearer token (client credentials or workload identity). Its issuer and subject must match an `agent` row with `access` on, in a tenant whose `agentAccess` setting is on; otherwise `403`. An agent holds `model.read` and `proposal.create` in its own scope (tenant-wide or one company) and nothing else. Every agent read is logged.

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Rows per page. The portal lists use 40, the agent registry 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 40
    Q:
      name: q
      in: query
      description: Case-insensitive search over the list's search keys.
      schema:
        type: string
        maxLength: 200
    Filter:
      name: filter
      in: query
      description: Field filters, `filter[field]=value`; a comma separates alternatives. Unknown fields return 400.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
          maxLength: 200
    Sort:
      name: sort
      in: query
      description: Sort field; each list documents its sortable fields. Unknown fields return 400.
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainProductId:
      name: domainProductId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConceptId:
      name: conceptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProposalAccepted:
      description: The proposal was created and its pending artefacts exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Proposal'
    Problem:
      description: A problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed query or body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller's roles do not allow this action in this scope (code `forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The resource existed and has expired (code `import_expired`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request contradicts the current state; `code` says how.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The body is well-formed but invalid; `errors` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The caller's budget for this operation is exhausted (code `rate_limited`); `Retry-After` says when to retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Busy:
      description: The tenant's decision lock or a row lock was not granted within the lock timeout, or the transaction hit a deadlock or serialisation failure (code `busy`). Nothing was written; retry the same request after `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: '`urn:ontaix:problem:<code>`'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - validation_failed
            - duplicate_label
            - duplicate_relation
            - structural_relation
            - cross_company_disabled
            - same_company
            - already_bound
            - source_pending
            - root_concept
            - home_company
            - proposal_not_ready
            - proposal_not_half_approved
            - proposal_decided
            - same_approver
            - locked_setting
            - confirmation_required
            - confirmation_mismatch
            - duplicate_role
            - payload_too_large
            - channel_disabled
            - import_expired
            - import_sentence_used
            - unsupported_media_type
            - rate_limited
            - duplicate_attribute
            - duplicate_agent
            - unavailable
            - busy
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Page:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Id:
      type: string
      format: uuid

    Hex:
      type: string
      pattern: '^#[0-9a-f]{6}$'

    Seed:
      type: number
      minimum: 0
      exclusiveMaximum: 1
      description: Curve bend seed in the range of `relation.seed`. The Studio draws it from its single random stream at draft time so every client draws the same curve; the server stores what it receives and draws one only when the draft carries none.

    DomainKey:
      type: string
      enum: [production, supply, sales, logistics, quality, maintenance, finance, people, engineering]

    RoleName:
      type: string
      enum: [owner, builder, governor, member, administrator, auditor, agent]

    ActorKind:
      type: string
      enum: [user, agent, system]

    Actor:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string

    Company:
      type: object
      required: [id, key, name, sub, position, isHome, rootId, domainProducts, counts]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
          description: Slug of the name at creation, unique in the tenant.
        name:
          type: string
        sub:
          type: string
        position:
          type: integer
        isHome:
          type: boolean
        rootId:
          $ref: '#/components/schemas/Id'
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'
        counts:
          type: object
          required: [concepts, sources, equivalences, bound, percentBound, domainsWithCells]
          properties:
            concepts:
              type: integer
            sources:
              type: integer
            equivalences:
              type: integer
            bound:
              type: integer
            percentBound:
              type: integer
            domainsWithCells:
              type: integer
        dyingAt:
          type: [string, 'null']
          format: date-time

    CompanyCreate:
      type: object
      required: [name, start]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sub:
          type: string
          maxLength: 200
          default: ''
        start:
          type: string
          enum: [starter_vocabulary, one_cell]
          description: '`starter_vocabulary` proposes the thirteen starter concepts; `one_cell` creates the root only.'

    CompanyCreated:
      type: object
      required: [company, root, proposals]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        root:
          $ref: '#/components/schemas/Concept'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'

    DomainProduct:
      type: object
      required: [id, companyId, key, name, owner, color, revision, version, hidden, counts]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/DomainKey'
        name:
          type: string
        owner:
          type: string
        color:
          $ref: '#/components/schemas/Hex'
        revision:
          type: integer
          description: Number of approved changes carrying this domain.
        version:
          type: string
          description: Display form `v1.<revision>`.
        hidden:
          type: boolean
        counts:
          type: object
          required: [members, pending, bound]
          properties:
            members:
              type: integer
            pending:
              type: integer
            bound:
              type: integer

    Concept:
      type: object
      required: [id, companyId, kind, label, sub, pending, conflict, bornAt, x, y, pinned, attributes, relationCount, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        companyId:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [root, concept]
        label:
          type: string
        sub:
          type: string
        domainProductId:
          type: [string, 'null']
          format: uuid
        domainKey:
          oneOf:
            - $ref: '#/components/schemas/DomainKey'
            - type: 'null'
        color:
          $ref: '#/components/schemas/Hex'
        rule:
          type: [string, 'null']
        pending:
          type: boolean
        conflict:
          type: boolean
        parentId:
          type: [string, 'null']
          format: uuid
        birthRelationId:
          type: [string, 'null']
          format: uuid
        bornAt:
          type: string
          format: date-time
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        bound:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        relationCount:
          type: integer
          description: Relations touching the concept, bindings excluded.
        state:
          type: string
          enum: [awaiting approval, approved, certified]
        isSpecialisation:
          type: boolean

    ConceptDraft:
      type: object
      description: The parent is given by id, or by label when it is introduced by an earlier draft of the same batch.
      required: [type, companyId, label, domainKey]
      oneOf:
        - required: [parentId]
        - required: [parentLabel]
      properties:
        type:
          type: string
          const: concept
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        parentLabel:
          type: string
          maxLength: 120
          description: Alternative to `parentId` for drafts that depend on a label introduced earlier in the same batch.
        label:
          type: string
          minLength: 1
          maxLength: 120
        domainKey:
          $ref: '#/components/schemas/DomainKey'
        action:
          type: string
          minLength: 1
          maxLength: 60
          default: relates to
          description: Lower-case action of the birth relation.
        reverse:
          type: boolean
          default: false
          description: When true the birth relation reads child action parent.
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    SpecDraft:
      type: object
      description: The parent is given by id, or by label when it is introduced by an earlier draft of the same batch.
      required: [type, companyId, label, domainKey]
      oneOf:
        - required: [parentId]
        - required: [parentLabel]
      properties:
        type:
          type: string
          const: spec
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        parentLabel:
          type: string
          maxLength: 120
        label:
          type: string
          minLength: 1
          maxLength: 120
        rule:
          type: string
          maxLength: 200
        domainKey:
          $ref: '#/components/schemas/DomainKey'
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    RelationDraft:
      type: object
      description: Each end is given by id, or by label when it is introduced by an earlier draft of the same batch; `companyId` is required when a label is used.
      required: [type, action]
      allOf:
        - oneOf:
            - required: [aId]
            - required: [aLabel, companyId]
        - oneOf:
            - required: [bId]
            - required: [bLabel, companyId]
      properties:
        type:
          type: string
          const: relation
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        companyId:
          $ref: '#/components/schemas/Id'
        aId:
          $ref: '#/components/schemas/Id'
        bId:
          $ref: '#/components/schemas/Id'
        aLabel:
          type: string
          maxLength: 120
        bLabel:
          type: string
          maxLength: 120
        action:
          type: string
          minLength: 1
          maxLength: 60
        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    RelationEdit:
      type: object
      description: At least one of `action` or `reverse` is present.
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 60
        reverse:
          type: boolean
          description: Swap subject and object.
      minProperties: 1

    Relation:
      type: object
      required: [id, aId, bId, kind, label, rest, seed, pending, aLabel, bLabel, companyIds, scope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        aId:
          $ref: '#/components/schemas/Id'
        bId:
          $ref: '#/components/schemas/Id'
        aLabel:
          type: string
        bLabel:
          type: string
        kind:
          type: string
          enum: [rel, isa, same, clash]
        label:
          type: string
        rest:
          type: number
          description: Spring rest length used by the physics.
        seed:
          type: number
          minimum: 0
          maximum: 1
          description: Curve bend seed, stored so every client draws the same curve.
        pending:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        companyIds:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Id'
        scope:
          type: string
          description: '`<domain>`, `company`, or `<from> → <to>` for the Relationships page.'
        state:
          type: string
          enum: [awaiting approval, approved]

    SourceDraft:
      type: object
      required: [type, companyId, label, kindText]
      properties:
        type:
          type: string
          const: source
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        companyId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
          minLength: 1
          maxLength: 120
        kindText:
          type: string
          maxLength: 60
          description: The catalogue category shown under the label, for example `ERP`.
        connectorCode:
          type: string
          maxLength: 10
        host:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 500
        auth:
          $ref: '#/components/schemas/SourceAuth'
        credentialRef:
          $ref: '#/components/schemas/CredentialRef'
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        caption:
          type: string
          maxLength: 300

    SourceUpdate:
      type: object
      description: Connection settings only. Renaming a source is a `change` proposal with `changeKind` `rename_source`.
      minProperties: 1
      properties:
        host:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 500
        auth:
          $ref: '#/components/schemas/SourceAuth'
        credentialRef:
          $ref: '#/components/schemas/CredentialRef'
        refresh:
          $ref: '#/components/schemas/RefreshInterval'

    CredentialRef:
      type: string
      pattern: '^[A-Za-z0-9-]{1,127}$'
      description: Key Vault secret name that holds the source credential. A reference, never a value; the API refuses anything that is not a valid secret name and never returns or logs the secret.

    SourceAuth:
      type: string
      enum: [service_principal, oauth2_client_credentials, managed_identity, key_vault_api_key]

    RefreshInterval:
      type: string
      enum: ['5 min', '15 min', '1 h', daily]

    Source:
      type: object
      required: [id, kind, companyId, label, kindText, anchorIndex, disabled, pending, refresh, x, y, pinned, feeds, records, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          const: source
          description: Discriminates a source from a concept in `Scene.nodes`.
        companyId:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        kindText:
          type: string
        connectorCode:
          type: [string, 'null']
        host:
          type: [string, 'null']
        scope:
          type: [string, 'null']
        auth:
          oneOf:
            - $ref: '#/components/schemas/SourceAuth'
            - type: 'null'
        refresh:
          $ref: '#/components/schemas/RefreshInterval'
        anchorIndex:
          type: integer
          description: Index within the company, drives the anchor angle outside the domain ring.
        disabled:
          type: boolean
        pending:
          type: boolean
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
          format: date-time
        feeds:
          type: integer
          description: Number of concepts bound to it.
        records:
          type: [integer, 'null']
          description: Sum over approved bindings, or null.
        state:
          type: string
          enum: [awaiting approval, disabled, connected]

    ConnectorType:
      type: object
      required: [code, name, category, scopeText]
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        scopeText:
          type: string

    DiscoveryRequest:
      type: object
      required: [auth]
      properties:
        host:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 500
        auth:
          $ref: '#/components/schemas/SourceAuth'
        credentialRef:
          $ref: '#/components/schemas/CredentialRef'
        displayName:
          type: string
          maxLength: 120

    Discovery:
      type: object
      required: [connected, statusText, objects]
      properties:
        connected:
          type: boolean
        statusText:
          type: string
