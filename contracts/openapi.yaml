      tags: [Platform]
      summary: Rename an organization or change its company mode (super admin)
      description: '`name` renames (`409 duplicate_organization` when another organization has it, case-insensitive). `companyMode` `single` is refused with `409 company_limit` while the organization has two or more companies; setting it turns the organization''s `multiCompany` setting off, which hides Add company, and emits `settings.changed` to the organization with `companyMode` and `multiCompany` in `changed`. `multiple` lets the organization''s Administrator turn `multiCompany` on again. Audited in the platform log and in the organization''s audit log (kind `platform`).'
      operationId: updateOrganization
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/organizations/{organizationId}/disable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Platform]
      summary: Disable an organization (super admin)
      description: Nobody signs into it any more and every session of its accounts ends at once (`organization_disabled`), including support sessions in it; its data, users and audit log are kept. Idempotent. Audited in both logs.
      operationId: disableOrganization
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations/{organizationId}/enable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Platform]
      summary: Enable a disabled organization (super admin)
      description: Its enabled accounts can sign in again. Idempotent. Audited in both logs.
      operationId: enableOrganization
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations/{organizationId}/groups:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Platform]
      summary: List an organization's groups, to assign accounts (super admin)
      description: Every group of the organization with its roles, for the group picker of the user dialogs. Groups themselves are managed by the organization's Administrator on the Groups page.
      operationId: listOrganizationGroups
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The groups, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations/{organizationId}/users:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Platform]
      summary: List an organization's accounts (super admin)
      operationId: listOrganizationUsers
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of the organization's users. Filterable - `status` (`active`, `disabled`, `locked`, `mustChangePassword`), `inGroup`. Sortable - `name`, `email`, `lastSignInAt`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Platform]
      summary: Create an account in an organization (super admin)
      description: 'Creates the account, its directory user (issuer `local`) and its password credential in one transaction, and adds the user to `groupIds` (groups of this organization only, `422` otherwise). The initial password passes the same policy as a change (`422 password_rejected`) and must be changed at first sign-in. The password is never returned, logged or audited. The email is unique across the deployment (`409 duplicate_email`), because the sign-in page has no organization field. Refused with `409 organization_disabled` on a disabled organization. Audited `account_created` in both logs, and as kind `groups` for each membership.'
      operationId: createOrganizationUser
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUserCreate'
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/organizations/{organizationId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Platform]
      summary: Get one account of an organization (super admin)
      operationId: getOrganizationUser
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Platform]
      summary: Rename an account or change its groups (super admin)
      description: '`groupIds` replaces the user''s memberships (groups of this organization only). Membership changes are immediate and audited as kind `groups` in the organization''s log, like the Groups page. The email never changes; create a new account instead.'
      operationId: updateOrganizationUser
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUserUpdate'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/organizations/{organizationId}/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Platform]
      summary: Disable an account (super admin)
      description: The account can no longer sign in and every session of it ends (`account_disabled`). Its directory user, memberships and history stay. Idempotent. Audited in both logs.
      operationId: disableOrganizationUser
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations/{organizationId}/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Platform]
      summary: Enable a disabled account (super admin)
      description: Idempotent. Audited in both logs.
      operationId: enableOrganizationUser
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations/{organizationId}/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Platform]
      summary: Reset an account's password (super admin)
      description: The only password recovery. Sets `newPassword` (same policy, `422 password_rejected`) with a forced change at the next sign-in, ends every session of the account (`password_reset`) and clears the throttle of its email. The super admin passes the password to the user outside Ontaix; it is never returned, logged or audited. Audited `password_reset` in both logs.
      operationId: resetOrganizationUserPassword
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Reset.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/organizations/{organizationId}/support-session:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Platform]
      summary: Open a read-only support session in an organization (super admin)
      description: 'The super admin''s only way into an organization''s data. Replaces the presented session with a new token (`Set-Cookie`) bound to this organization for 60 minutes, never past the session''s absolute expiry; opening another organization''s support session ends this one. Inside it the super admin holds exactly `model.read`, `directory.read` and `audit.read` at tenant scope; every write, proposal, decision and model call answers `403 forbidden`. `reason` is required and audited: `support_session_started` in the platform log and kind `platform` in the organization''s log, where its Administrators and Auditors see it. Refused with `409 organization_disabled` on a disabled organization.'
      operationId: startSupportSession
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportSessionStart'
      responses:
        '200':
          description: The new session, with `support` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/support-session:
    delete:
      tags: [Platform]
      summary: End the current support session (super admin)
      description: Replaces the presented session with a new token without `support` (`Set-Cookie`) and audits `support_session_ended` in both logs. A support session that reaches `support.until` ends by itself and is audited the same way, with the system as actor.
      operationId: endSupportSession
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The new session, without `support`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/audit:
    get:
      tags: [Platform]
      summary: Platform audit log, newest first (super admin)
      operationId: listPlatformAudit
      x-ontaix-permission: platform.admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A page of entries. Filterable - `action`, `ok`, `organizationId`, `from`, `to`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlatformAuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ontaix_session
      description: 'The browser session set by `POST /auth/sign-in`: an opaque 256-bit token, `Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/`, host-only. The server stores only its SHA-256. It ends after 30 minutes without an authenticated call or 12 hours after sign-in, at sign-out, and when the password changes or is reset or the account or organization is disabled. Unsafe methods also need `X-CSRF-Token`. Authentication only; roles come from Ontaix groups, or from the platform role for a super admin.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC ID token or access token from any provider the tenant trusts (`tenant_identity_provider` maps issuer and audience to the tenant). Authentication only; roles come from Ontaix groups. Specified for a later deployment and not enabled in this one (ADR 0017); until then a bearer token that is not an agent's answers `401`.
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Agent bearer token (client credentials or workload identity). Its issuer and subject must match an `agent` row with `access` on, in a tenant whose `agentAccess` setting is on; otherwise `403`. An agent holds `model.read` and `proposal.create` in its own scope (tenant-wide or one company) and nothing else. Every agent read is logged.

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Rows per page. The portal lists use 40, the agent registry 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 40
    Q:
      name: q
      in: query
      description: Case-insensitive search over the list's search keys.
      schema:
        type: string
        maxLength: 200
    Filter:
      name: filter
      in: query
      description: Field filters, `filter[field]=value`; a comma separates alternatives. Unknown fields return 400.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
          maxLength: 200
    Sort:
      name: sort
      in: query
      description: Sort field; each list documents its sortable fields. Unknown fields return 400.
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    ExpansionId:
      name: expansionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExtractionId:
      name: extractionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OntologyImportId:
      name: ontologyImportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainProductId:
      name: domainProductId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConceptId:
      name: conceptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProposalAccepted:
      description: The proposal was created and its pending artefacts exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Proposal'
    Problem:
      description: A problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed query or body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller's roles do not allow this action in this scope (code `forbidden`). `detail` names what is missing in human-readable words, for example `Only a Governor or Owner can approve`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The resource existed and has expired (code `import_expired` for a document import, `expansion_expired` for a concept expansion, `extraction_expired` for a whole-document extraction result, `ontology_import_expired` for an ontology import).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request contradicts the current state; `code` says how.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The body is well-formed but invalid; `errors` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The caller's budget for this operation is exhausted (code `rate_limited`); `Retry-After` says when to retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InvalidCredentials:
      description: 'The email and password do not sign anyone in (code `invalid_credentials`, `detail` `Email or password is incorrect.`), whether the email is unknown, the password wrong, or the account or its organization disabled.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SignInThrottled:
      description: 'Too many failed sign-ins for this email or from this IP within 15 minutes (code `sign_in_locked`, `detail` `Too many attempts. Try again in <n> minutes.`); `Retry-After` gives the seconds left.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the lock ends.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfFailed:
      description: The `Origin` header is missing or not allowed, or `X-CSRF-Token` does not match the session (code `csrf_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Busy:
      description: The tenant's decision lock or a row lock was not granted within the lock timeout, or the transaction hit a deadlock or serialisation failure (code `busy`). Nothing was written; retry the same request after `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`. Every refusal (`401`, `403`, `404`, `409`, `410`, `413`, `415`, `422`, `429`, `503`) carries `detail`, one human-readable English sentence saying why, safe to show to the caller as text - for example `Only a Governor or Owner can approve` or `The same person cannot give both approvals`. It never holds markup, secrets or anything the caller may not read. The Studio shows it in the refusal toast, `title` when `detail` is absent.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: '`urn:ontaix:problem:<code>`'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - validation_failed
            - duplicate_label
            - duplicate_relation
            - structural_relation
            - cross_company_disabled
            - same_company
            - already_bound
            - source_pending
            - root_concept
            - home_company
            - proposal_not_ready
            - proposal_not_half_approved
            - proposal_decided
            - same_approver
            - locked_setting
            - confirmation_required
            - confirmation_mismatch
            - duplicate_role
            - payload_too_large
            - channel_disabled
            - import_expired
            - import_sentence_used
            - expansion_expired
            - expansion_submitted
            - concept_pending
            - extraction_exists
            - extraction_running
            - extraction_not_ready
            - extraction_expired
            - extraction_submitted
            - ontology_import_expired
            - ontology_import_submitted
            - branch_root_invalid
            - unsupported_media_type
            - rate_limited
            - duplicate_attribute
            - duplicate_agent
            - unavailable
            - busy
            - proposal_changed
            - proposal_not_editable
            - company_creation_disabled
            - domain_limit
            - invalid_credentials
            - sign_in_locked
            - csrf_failed
            - password_change_required
            - password_rejected
            - current_password_incorrect
            - duplicate_email
            - duplicate_organization
            - organization_disabled
            - company_limit
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Page:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Id:
      type: string
      format: uuid

    Hex:
      type: string
      pattern: '^#[0-9a-f]{6}$'

    Seed:
      type: number
      minimum: 0
      exclusiveMaximum: 1
      description: Curve bend seed in the range of `relation.seed`. The Studio draws it from its single random stream at draft time so every client draws the same curve; the server stores what it receives and draws one only when the draft carries none.

    DomainKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,39}$'
      description: A tenant domain key (ADR 0015) - one of the nine templates `production`, `supply`, `sales`, `logistics`, `quality`, `maintenance`, `finance`, `people`, `engineering`, or a custom domain's key. A key that is not a domain of the tenant is `422`.

    RoleName:
      type: string
      enum: [owner, builder, governor, member, administrator, auditor, agent]

    ActorKind:
      type: string
      enum: [user, agent, system, platform]
      description: '`platform` - a super admin acting on the organization or inside a support session; `id` is the platform account.'

    Actor:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string

    Company:
      type: object
      required: [id, key, name, sub, position, isHome, rootId, domainProducts, counts]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
          description: Slug of the name at creation, unique in the tenant.
        name:
          type: string
        sub:
          type: string
        position:
          type: integer
        isHome:
          type: boolean
        rootId:
          $ref: '#/components/schemas/Id'
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'
        counts:
          type: object
          required: [concepts, sources, equivalences, bound, percentBound, domainsWithCells]
          properties:
            concepts:
              type: integer
            sources:
              type: integer
            equivalences:
              type: integer
            bound:
              type: integer
            percentBound:
              type: integer
            domainsWithCells:
              type: integer
        dyingAt:
          type: [string, 'null']
          format: date-time

    CompanyCreate:
      type: object
      required: [name, start]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sub:
          type: string
          maxLength: 200
