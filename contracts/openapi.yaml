          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        parentLabel:
          type: string
          maxLength: 120
          description: Alternative to `parentId` for drafts that depend on a label introduced earlier in the same batch.
        label:
          type: string
          minLength: 1
          maxLength: 120
        domainKey:
          $ref: '#/components/schemas/DomainKey'
        action:
          type: string
          minLength: 1
          maxLength: 60
          default: relates to
