        caption:
          type: string
          maxLength: 300
        seed:
          $ref: '#/components/schemas/Seed'

    SpecDraft:
      type: object
      description: The parent is given by id, or by label when it is introduced by an earlier draft of the same batch.
      required: [type, companyId, label, domainKey]
      oneOf:
        - required: [parentId]
        - required: [parentLabel]
      properties:
        type:
          type: string
          const: spec
        origin:
          $ref: '#/components/schemas/InputOrigin'
        importRef:
          $ref: '#/components/schemas/ImportRef'
        companyId:
          $ref: '#/components/schemas/Id'
        parentId:
          $ref: '#/components/schemas/Id'
        parentLabel:
