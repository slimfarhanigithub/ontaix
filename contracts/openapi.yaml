  # ---------------------------------------------------------------- Audit
  /audit:
    get:
      tags: [Audit]
      summary: Audit log, newest first
      description: Returns only the entries the caller may read. An entry is readable when the caller holds `audit.read` in a scope that contains every company in the entry's `companyIds`; an entry with an empty `companyIds` is tenant-wide and readable with `audit.read` at any scope. A company-scoped Auditor or Governor therefore never sees an entry naming another company, including a company addition or a cross-company decision. `total` counts readable entries only.
      operationId: listAudit
      x-ontaix-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A page of entries. Filterable - `kind`, `ok`, `actorKind`, `from`, `to`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/sign-in:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      description: |
        The only way to start a session; there is no sign-up and no self-service password recovery (ADR 0017). Checks run in this order: the client IP's and the email's throttle (`429`), then the argon2id verification. An unknown email is verified against a fixed dummy hash, so every refusal takes the same time. A wrong password, an unknown email, a disabled account and a disabled organization all answer the same `401 invalid_credentials`; five failures within 15 minutes lock that email, and that IP, for 15 minutes (`429 sign_in_locked`), whether or not an account has the email.

        On success the response sets the session cookie `__Host-ontaix_session` (`Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/`, no `Domain`, no `Max-Age`) holding a new 256-bit token, ends any session the request presented, and returns the session with its CSRF token. When `mustChangePassword` is true the session may only call `GET /auth/session`, `PUT /auth/password` and `POST /auth/sign-out` until the password is changed; every other call answers `403 password_change_required`. The request must carry an `Origin` header naming an allowed origin (login CSRF). Every attempt is audited.
      operationId: signIn
      x-ontaix-permission: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in. `Set-Cookie` carries the session token; the body never does.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`__Host-ontaix_session=<token>; Path=/; Secure; HttpOnly; SameSite=Lax`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/SignInThrottled'

  /auth/sign-out:
    post:
      tags: [Authentication]
      summary: Sign out
      description: Ends the presented session, clears the cookie (`Max-Age=0`) and audits `sign_out`. Answers `204` even when the session had already ended, so the Studio can always return to the sign-in page. Needs `X-CSRF-Token` when the session is live.
      operationId: signOut
      x-ontaix-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Signed out; `Set-Cookie` clears the session cookie.
        '403':
          $ref: '#/components/responses/CsrfFailed'

  /auth/session:
    get:
      tags: [Authentication]
      summary: The current session
      description: The Studio's first call. `401` means no live session, and the Studio shows the sign-in page. Reading the session slides its 30-minute idle expiry like any other authenticated call.
      operationId: getSession
      x-ontaix-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The live session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password:
    put:
      tags: [Authentication]
      summary: Change my password
      description: |
        The signed-in account changes its own password: `currentPassword` must verify (a failure counts toward the email's throttle and answers `422 current_password_incorrect`), and `newPassword` must pass the policy (`422 password_rejected`, `detail` says which rule): 12 to 128 characters after Unicode NFC normalisation, any characters, not in the bundled list of common and breached passwords, not containing the email's local part, and different from the current password. On success the credential's `mustChange` clears, every other session of the account ends (`password_changed`), and the presented session is replaced by a new token (`Set-Cookie`) whose session the body returns. Audited as `password_changed` or `password_change_failed`.
      operationId: changePassword
      x-ontaix-permission: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Changed. The body is the new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/SignInThrottled'

