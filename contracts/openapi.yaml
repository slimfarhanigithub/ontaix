        content:
          application/json:
            schema:
              type: object
              required: [aId, bId]
              properties:
                aId:
                  type: string
                  format: uuid
                bId:
                  type: string
                  format: uuid
                caption:
                  type: string
                  maxLength: 300
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------- Sources
  /connectors:
    get:
      tags: [Sources]
      summary: Connector catalogue
      operationId: listConnectors
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The fifteen connector types in catalogue order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorType'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connectors/{code}/discover:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Sources]
      summary: Verify a connection and preview the objects it exposes (wizard step 3)
      description: Read-only. Requires `source.manage`; agents are refused. Hosts that resolve to loopback, link-local or private ranges are refused with `422` unless they appear in the tenant's egress allowlist (`tenant_settings.egress_allowlist`). Returns the status text and the discovered objects with row counts; nothing is stored.
      operationId: discoverConnector
      x-ontaix-permission: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The discovery result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /sources:
    get:
      tags: [Sources]
      summary: List sources (Data sources page)
      operationId: listSources
      x-ontaix-permission: model.read
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sources with feeds, records and state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sources]
      summary: Propose a data source
      description: Creates a `source` proposal; the pending source is drawn at once. Connection secrets are never accepted by this API - `auth` names the method and the credential lives in Key Vault under the source id.
      operationId: proposeSource
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceDraft'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /sources/refresh-all:
    post:
      tags: [Sources]
      summary: Re-read counts and schemas of every enabled source
      description: Immediate and audited (`all sources refreshed`). Freshness of every bound concept of an enabled source becomes `just now`.
      operationId: refreshAllSources
      x-ontaix-permission: source.manage
      responses:
        '200':
          description: Refresh outcome.
          content:
            application/json:
              schema:
                type: object
                required: [sources, bindings]
                properties:
                  sources:
                    type: integer
                  bindings:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Sources]
      summary: Get one source
      operationId: getSource
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sources]
      summary: Reconfigure a source
      description: Immediate and audited (`<name> reconfigured`). Changes connection settings only (host, scope, authentication method, credential reference, refresh); the label, feeding and bindings are untouched. Renaming goes through `POST /proposals` with `changeKind` `rename_source`.
      operationId: updateSource
      x-ontaix-permission: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        '200':
          description: The updated source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Sources]
      summary: Propose removing a source
      description: Creates a `change` proposal (`remove_source`); on approval every binding to it is removed and attributes stay as declared.
      operationId: proposeRemoveSource
      x-ontaix-permission: proposal.create
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /sources/{sourceId}/enable:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [Sources]
      summary: Enable a source
      description: Immediate and audited. Freshness of its bound concepts becomes `2 min`. Refused while the source is pending (`409 source_pending`).
      operationId: enableSource
      x-ontaix-permission: source.manage
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sources/{sourceId}/disable:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [Sources]
      summary: Disable a source
      description: Immediate and audited. Syncing stops; bound concepts keep their attributes and their freshness reads `paused`.
      operationId: disableSource
      x-ontaix-permission: source.manage
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bindings:
    get:
      tags: [Sources]
      summary: List binding rows (Bindings page)
      description: One row per approved concept, bound or not.
      operationId: listBindings
      x-ontaix-permission: model.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of binding rows. Filterable - `state` (`bound`, `no data`), `companyId`, `sourceId`. Sortable - `label`, `company`, `domain`, `source`, `records`, `attributes`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/BindingRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sources]
      summary: Propose binding concepts to a source
      description: Creates one `bind` proposal with one pending binding per concept. On approval the record count and freshness are set, declared attributes are written as approved and discovered ones become `attr` proposals. Refused with `409 already_bound` when a concept already has a binding.
      operationId: proposeBinding
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingDraft'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /bindings/{bindingId}:
    parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Sources]
      summary: Propose unbinding a concept
      description: Creates a `change` proposal (`unbind`); attributes stay as declared.
      operationId: proposeUnbind
      x-ontaix-permission: proposal.create
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------- Proposals
  /proposals:
    get:
      tags: [Proposals]
      summary: List proposals
      operationId: listProposals
      x-ontaix-permission: model.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of proposals, open ones by default (`filter[state]=pending,half_approved`). Filterable - `state`, `type`, `companyId`, `proposerKind`. Sortable - `createdAt`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Proposals]
      summary: Create one proposal from a typed draft
      description: The generic entry used by the teach bar, the MCP gateway and the demo story. Same refusals as the resource endpoints.
      operationId: createProposal
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDraft'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/batch:
    post:
      tags: [Proposals]
      summary: Create several proposals in order
      description: Drafts are created in array order in one transaction so that later drafts can depend on labels introduced by earlier ones. Any refusal fails the whole batch.
      operationId: createProposalBatch
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drafts]
              properties:
                drafts:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/ProposalDraft'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: The created proposals in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/approve-all:
    post:
      tags: [Proposals]
      summary: Approve every ready proposal, repeatedly
      description: Acts only on proposals the caller may approve under ADR 0003 check points 2 to 4; proposals outside the caller's scope are skipped and counted in `remaining`. Loops while any proposal in scope is ready, at most 200 rounds. Events emitted carry `bulk` set to true.
      operationId: approveAllProposals
      x-ontaix-permission: proposal.approve
      responses:
        '200':
          description: What was approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/reject-all:
    post:
      tags: [Proposals]
      summary: Reject every open proposal in the caller's scope
      description: Acts only on proposals the caller may reject under ADR 0003 check points 2 to 4; proposals outside the caller's scope are skipped and counted in `remaining`.
      operationId: rejectAllProposals
      x-ontaix-permission: proposal.reject
      responses:
        '200':
          description: What was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/finalise-all:
    post:
      tags: [Proposals]
      summary: Play the remaining story and approve everything
      description: Requires `proposal.finalise`, held by Governor at tenant scope, because it creates proposals for every company and approves everything. When `demoStory` is on, plays every remaining scene server-side, then runs approve-all rounds until nothing is ready. When the story is off it equals approve-all. Audited as `demo · finalised all scenes`.
      operationId: finaliseAll
      x-ontaix-permission: proposal.finalise
      responses:
        '200':
          description: The finalise summary used by the caption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinaliseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [Proposals]
      summary: Get one proposal with its readiness
      operationId: getProposal
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals/{proposalId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Approve a proposal
      description: Requires Owner in scope or Governor in an enclosing scope. Refused when not ready (`409 proposal_not_ready`). When `twoApprovers` is on and the type is `change`, the proposal moves to `half_approved` and needs `second-approve` by a different user; calling this endpoint on a `half_approved` proposal behaves as `second-approve`. Otherwise it is applied - pending cleared, domain revision incremented, audit entry written, events emitted. A `rename` or `rename_source` re-checks label uniqueness at approval and is refused with `409 duplicate_label` when the label was taken meanwhile.
      operationId: approveProposal
      x-ontaix-permission: proposal.approve
      responses:
        '200':
          description: The result, including the artefacts that changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/second-approve:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Give the second approval on a half-approved change
      description: Requires Governor or Owner in scope and a different user from the first approver (`409 same_approver`). Refused unless the state is `half_approved` (`409 proposal_not_half_approved`).
      operationId: secondApproveProposal
      x-ontaix-permission: proposal.second_approve
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Reject a proposal and cascade
      description: Marks the proposal rejected, its concept dying and removes its pending relations, bindings or attribute. Every open proposal whose concept descends from the rejected concept, or whose relation touches it, is rejected in the same transaction and listed in `cascaded`.
      operationId: rejectProposal
      x-ontaix-permission: proposal.reject
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------- Teach
  /teach/parse:
    post:
      tags: [Teach]
      summary: Parse a sentence into intents and proposal drafts
      description: Pure. Runs the rule-based grammar (domain prefix, specialisation patterns, verb lexicon, list splitting, passives) against the company's current labels and returns the intents, the drafts the client may submit to `POST /proposals/batch`, and the caption outcome (`understood`, `partly_understood`, `not_understood`). Nothing is written. When `demoStory` is on and the text matches the next scene, `scene` is returned instead of drafts.
      operationId: parseTeach
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, text]
              properties:
                companyId:
                  type: string
                  format: uuid
                text:
                  type: string
                  minLength: 1
                  maxLength: 400
                fromImport:
                  type: boolean
                  default: false
                  description: True when the sentence comes from a document import; story interception is skipped.
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teach/suggest:
    get:
      tags: [Teach]
      summary: Suggest an action between a subject and an object
      description: Pure. Order - the subject's own actions toward the object's domain, then the subject-name table, then the object-name table, then the subject's most common action, then the object's most common incoming action, then `relates to`. The suggestion is never submitted by itself.
      operationId: suggestAction
      x-ontaix-permission: model.read
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: subjectLabel
          in: query
          description: Used when the subject does not exist yet (new-concept box).
          schema:
            type: string
        - name: objectId
          in: query
          schema:
            type: string
            format: uuid
        - name: objectLabel
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The suggested action.
          content:
            application/json:
              schema:
                type: object
                required: [action, rule]
                properties:
                  action:
                    type: string
                  rule:
                    type: string
                    enum: [most_common_in_domain, does, done_to, most_common_out, most_common_in, default]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /import/sentences:
    post:
      tags: [Teach]
      summary: Extract sentences from a document
      description: The only place documents are read - the Studio never extracts text itself and loads nothing from a CDN. Accepts at most 10 MiB with media type `text/plain`, `text/markdown`, `text/csv`, `application/json`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document` or `application/pdf`; anything else is `415`. Splits on sentence punctuation or newlines and keeps sentences of 13 to 399 characters. Nothing is stored; the client teaches sentence by sentence.
      operationId: importSentences
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The sentences in document order.
          content:
            application/json:
              schema:
                type: object
                required: [fileName, sentences]
                properties:
                  fileName:
                    type: string
                  sentences:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'

