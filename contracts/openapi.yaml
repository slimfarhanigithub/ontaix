  # ---------------------------------------------------------------- Proposals
  /proposals:
    get:
      tags: [Proposals]
      summary: List proposals
      operationId: listProposals
      x-ontaix-permission: model.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of proposals, open ones by default (`filter[state]=pending,half_approved`). Filterable - `state`, `type`, `companyId`, `proposerKind`. Sortable - `createdAt`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Proposals]
      summary: Create one proposal from a typed draft
      description: The generic entry used by the teach bar (typed text or a speech transcript), document import and the MCP gateway. Same refusals as the resource endpoints, plus `409 channel_disabled` for a `speech` draft while `voice` is off or an `importRef` draft while `importDocs` is off. An `importRef` sentence may be drafted by one successful call only (`409 import_sentence_used` otherwise); `404` for an import of another tenant or actor, `410 import_expired` past its expiry.
      operationId: createProposal
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDraft'
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/batch:
    post:
      tags: [Proposals]
      summary: Create several proposals in order
      description: Drafts are created in array order in one transaction so that later drafts can depend on labels introduced by earlier ones. Any refusal fails the whole batch, including `409 channel_disabled` for a `speech` draft while `voice` is off or an `importRef` draft while `importDocs` is off. Drafts citing an import are charged like every other draft, one proposal unit per draft at this call; the import prepays parse units only. Each import sentence may be drafted by one successful call only (`409 import_sentence_used` otherwise); `404` for an import of another tenant or actor, `410 import_expired` past its expiry.
      operationId: createProposalBatch
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drafts]
              properties:
                origin:
                  $ref: '#/components/schemas/InputOrigin'
                importRef:
                  $ref: '#/components/schemas/ImportRef'
                parseId:
                  type: string
                  format: uuid
                  description: The `TeachResult.parseId` these drafts came from (ADR 0014). Optional and advisory - it only links the created proposals to the stored parse for usage learning, matching each draft to the parse's drafts (an unmatched draft is linked as edited). A parse of another user, company or tenant, or an expired one, is ignored silently, never an error; it never changes what is created.
                drafts:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: A draft's own `origin` and `importRef` win over the batch-level values, which apply to every draft that sets none.
                  items:
                    $ref: '#/components/schemas/ProposalDraft'
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: The created proposals in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /expansions/{expansionId}/proposals:
    parameters:
      - $ref: '#/components/parameters/ExpansionId'
    post:
      tags: [Proposals]
      summary: Propose a selection of an expansion's suggestions
      description: |
        Creates one proposal per selected draft of a stored concept expansion (ADR 0009), in the expansion's draft order, in one transaction; all or nothing, like `POST /proposals/batch`. The client sends indexes only, never draft content: the server builds each proposal from the draft it stored, so a proposal with origin `suggestion` always holds what the model suggested and the API validated. The server records `origin` `suggestion` (`originDetail` null), and each proposal's `why` carries the suggestion's confidence and rationale (see `Proposal.why`).

        Rules - the expansion belongs to the caller's tenant and to the same user, otherwise `404`; past `expiresAt` it is `410 expansion_expired` (then `404` once purged, 24 hours after expiry); it may be submitted by one successful call only (`409 expansion_submitted`). The selection must be closed under `ExpansionNote.requires`: every draft a selected draft requires is selected too, otherwise `422 validation_failed`. The caller must still hold `proposal.create` through Owner or Builder in the expanded concept's scope. Every draft then meets every check of `POST /proposals/batch` (for example `409 duplicate_label` when a concept with the same label was created since the expansion); any refusal fails the whole call, and the claim is released with the rolled-back transaction, so the caller can submit a smaller selection or expand again. Charges one proposal unit per created proposal. When the expansion was made with a `sessionId`, the server stores one teach session turn for that session after the commit (sentence `Expand <label>`, the expanded concept in `concept_ids`, the proposed labels in `new_labels`), so a later teach sentence can refer to them; storing it never fails the call.
      operationId: proposeExpansion
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [indexes]
              properties:
                indexes:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  uniqueItems: true
                  description: 0-based indexes into the stored expansion's `drafts`. Order does not matter; proposals are created in draft order.
                  items:
                    type: integer
                    minimum: 0
                    maximum: 1999
      responses:
        '202':
          description: The created proposals in draft order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 2000
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/approve-branch:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Approve a proposed concept and the proposals that depend on it
      description: |
        Branch approval (ADR 0010, decision rows 117 and 126). The root must be a `concept` or `spec` proposal (`409 branch_root_invalid` otherwise) that is open, or approved by an earlier call on the same root so that the branch continues; a rejected root is `409 proposal_decided`. Every member of the branch is still checked on its own under the decision lock. The branch is the root plus every open proposal that depends on it through proposal dependencies, transitively - the `concept` and `spec` proposals proposed under a pending concept of the branch (their `deps` or `waitFor` name it), and the `relation` proposals whose ends are all concepts of the branch or already approved. `change`, `source`, `bind` and `attr` proposals are never in a branch, so no rename, deletion or edit of an existing concept is approved through it. Dependencies resolve by id, within the root's company only: a pending concept of the branch is identified by its concept id, a proposal enters the branch when its `deps` or `waitFor` label resolves, among the open proposals and live concepts of the root's company (and, when the root has one, its domain product within that company), to a concept of the branch, and a relation proposal enters only when both its ends resolve that way to concepts of the branch or approved concepts of that company. A proposal of another company never enters a branch, even when its labels match. Each batch re-reads the branch and selects its ready proposals under its own decision lock, so a rejection or cascade committed between batches is seen: nothing is approved under a parent that has since been rejected or is no longer ready. Each proposal is approved only if the caller may approve it alone (ADR 0003 check points 2 to 4); others are skipped and counted in `remaining`.

        Work is bounded: proposals are approved in rounds, parents before children, in batches of at most `ONTAIX_BRANCH_APPROVE_BATCH` (default 200) per transaction; each batch takes the tenant decision lock, commits and releases it, so other decisions interleave. At most `ONTAIX_BRANCH_APPROVE_MAX_ROUNDS` (default 50) batches per call. The result is `BranchResult`: `approved` so far (committed batches stay committed), `remaining` open proposals of the branch, and `complete` false when the round limit stopped the call with ready proposals left; the client calls again on the same root to continue. A `503 busy` on a batch returns the progress so far with `complete` false instead of an error when at least one batch committed. Events emitted carry `bulk` set to true. Rejecting a branch needs no new operation - `POST /proposals/{proposalId}/reject` already cascades to descendants.
      operationId: approveProposalBranch
      x-ontaix-permission: proposal.approve
      responses:
        '200':
          description: What was approved, possibly partial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/approve-all:
    post:
      tags: [Proposals]
      summary: Approve every ready proposal, repeatedly
      description: Acts only on proposals the caller may approve under ADR 0003 check points 2 to 4; proposals outside the caller's scope are skipped and counted in `remaining`. Loops while any proposal in scope is ready, at most 200 rounds. Events emitted carry `bulk` set to true.
      operationId: approveAllProposals
      x-ontaix-permission: proposal.approve
      responses:
        '200':
          description: What was approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/reject-all:
    post:
      tags: [Proposals]
      summary: Reject every open proposal in the caller's scope
      description: Acts only on proposals the caller may reject under ADR 0003 check points 2 to 4; proposals outside the caller's scope are skipped and counted in `remaining`.
      operationId: rejectAllProposals
      x-ontaix-permission: proposal.reject
      responses:
        '200':
          description: What was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [Proposals]
      summary: Get one proposal with its readiness
      operationId: getProposal
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Proposals]
      summary: Edit a pending proposal's draft in place
      description: |
        Editing (ADR 0015). Changes the label and/or the action of a `pending` `concept`, `spec` or `relation` proposal without a new proposal and without an approval of its own - the edit changes the proposal, which is still approved or rejected as a whole. `label` applies to `concept` and `spec` (the pending concept's label), `action` to `concept` (birth action) and `relation`. The body carries the `revision` the editor saw; a different current revision is `409 proposal_changed`. Anything other than a `pending` proposal of those types is `409 proposal_not_editable` (a `half_approved` proposal cannot be edited, since one approval was given to its content). Checks as on creation - label rules and uniqueness (`409 duplicate_label`), action normalisation, never `is a` or `equivalent to` for `relation`. On success the proposal's `revision` increments, its `title`, `html` and pending artefacts are rebuilt, the `deps` and `waitFor` of open proposals of the same company that named the old label are rewritten, and `proposal.changed` plus `concept.changed` or `relation.changed` are emitted. Audited (kind `edit`, old and new text). Permission - the proposer, or anyone with `proposal.create` in the proposal's scope. Takes the tenant decision lock, so an edit and a decision never interleave.
      operationId: editPendingProposal
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              minProperties: 2
              properties:
                revision:
                  type: integer
                  minimum: 0
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
                action:
                  type: string
                  minLength: 1
                  maxLength: 60
      responses:
        '200':
          description: The edited proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Approve a proposal
      description: Requires Owner in scope or Governor in an enclosing scope. Refused when not ready (`409 proposal_not_ready`). When `twoApprovers` is on and the type is `change`, the proposal moves to `half_approved` and needs `second-approve` by a different user; calling this endpoint on a `half_approved` proposal behaves as `second-approve`. Otherwise it is applied - pending cleared, domain revision incremented, audit entry written, events emitted. A `rename` or `rename_source` re-checks label uniqueness at approval and is refused with `409 duplicate_label` when the label was taken meanwhile.
      operationId: approveProposal
      x-ontaix-permission: proposal.approve
      parameters:
        - name: expectedRevision
          in: query
          description: The proposal `revision` the approver reviewed. When given and the proposal was edited since, the approval is refused with `409 proposal_changed`, so nobody approves text they did not see. The Studio always sends it.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The result, including the artefacts that changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/second-approve:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Give the second approval on a half-approved change
      description: Requires Governor or Owner in scope and a different user from the first approver (`409 same_approver`). Refused unless the state is `half_approved` (`409 proposal_not_half_approved`).
      operationId: secondApproveProposal
      x-ontaix-permission: proposal.second_approve
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Proposals]
      summary: Reject a proposal and cascade
      description: Marks the proposal rejected, its concept dying and removes its pending relations, bindings or attribute. Every open proposal whose concept descends from the rejected concept, or whose relation touches it, is rejected in the same transaction and listed in `cascaded`.
      operationId: rejectProposal
      x-ontaix-permission: proposal.reject
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------- Teach
  /teach/parse:
    post:
      tags: [Teach]
      summary: Parse a sentence into intents and proposal drafts
      description: Writes nothing to the model. Runs the rule-based grammar (domain prefix, specialisation patterns, verb lexicon, list splitting, passives) against the company's current labels and returns the intents, the drafts the client may submit to `POST /proposals/batch`, and the caption outcome (`understood`, `partly_understood`, `not_understood`). No ontology row is written. The sentence comes from one of the three entry paths - `text` typed in the teach bar, `text` holding one or more finished spoken sentences (the Studio transcribes the microphone and, while recording, sends each finished sentence as its own request in the recording's `sessionId`, so speech has no endpoint of its own; decision row 127), or `importRef` citing a stored sentence of a document import, whose text the server reads from the import. Every path is parsed the same way. A call with `importRef` increments that sentence's parse counter, and a sentence may be parsed at most 3 times (`409 import_sentence_used` after that). A call with `importRef` spends no parse unit, because the import charged one per sentence; a call with `text` spends one parse unit. Refusals - `409 channel_disabled` when `text` is sent while the `liveTeaching` setting is off, when `origin` is `speech` while the `voice` setting is off, or when `importRef` is sent while the `importDocs` setting is off. `origin` is declared by the client, so the `voice` check stops only honest clients; the Studio also hides the microphone when `voice` is off. `404` for an import of another tenant or actor, and when the caller may not read `companyId`; `410 import_expired` past its expiry.


        Routing by origin (ADR 0008, decision row 88). `speech` - the model runs first on the request's text (one or more finished sentences of a recording, up to 4,000 characters; the session links the requests of one recording, and each request spends its own parse units and `llm` unit); it segments the transcript into sentences, ignores fillers and disfluencies, resolves back-references with the session's turns and returns the concepts, the parent each is born from, the action of each birth relation, further relations with their actions, and domains. `document` (`importRef`) - the model runs first on the cited sentence, with up to two sentences before and two after it from the same stored import as context (read by the server, never sent by the client). `text` - the model runs first too while the step is on (a provider is configured and `llmMonthlyTokenCap` is above 0; decision row 120); the grammar and the triggers below are the fallback only. When the model step is off (`llmMonthlyTokenCap` 0), out of budget, failing, timed out or invalid, `speech` and `document` fall back to the grammar with `degraded` true; a transcript is then split into segments on sentence punctuation and newlines (a segment longer than 400 code points is cut at its last space before 400, or at exactly 400 when it has none), at most 40 segments are kept, the rest of the transcript is listed as one `unresolved` entry with reason `too_many_segments`, and each segment is parsed by the grammar.


        Grammar fallback for `text` (ADR 0008, amended by row 120) - what follows applies when the model step is off or does not answer; the rule-based grammar then runs first. A language model extraction step runs afterwards only when at least one trigger holds - the rules understand nothing (`not_understood`) or only part of the sentence (`partly_understood`); the sentence holds a back-reference word (`these`, `those`, `it`, `they`, `them`, `this`) as a whole word; the sentence holds a list preamble (a count word `two` to `twelve` or a number, then one to three words, then `,` or `:`, as in `three areas, app, data and AI`); or the sentence holds a verb form that is not a variant of the reference lexicon (checked against a verb word list shipped with the API, which never changes the lexicon). The model receives the sentence, the session's recent turns, the company name, up to 200 candidate concepts of the company and the domain templates, and returns intents only; the server validates them against `contracts/teach-extraction.schema.json` and turns them into drafts with the same rules as the grammar. Nothing the model returns is written - it becomes drafts the client submits as proposals for a human to approve. When the model output is invalid, or the step fails or is skipped, no model draft is returned and the whole sentence is listed in `unresolved` with the reason. When a back-reference, list preamble or unknown verb triggered the step and the model answered validly, its intents replace the grammar's; when only `partly_understood` triggered it, the grammar's intents are kept and the model's are added after removing duplicates. Each call to the model spends one unit of the caller's `llm` budget (hourly, per user or agent) and reserves tokens from the tenant's `llmMonthlyTokenCap`; either being exhausted skips the step. A skipped, failed, timed-out (15 seconds at most for `text` and `document`, 45 seconds for a `speech` transcript, wall clock with connect included) or invalid model step never fails the request - the response is `200` with the grammar's result, `extractor` `rules`, `degraded` true and `llmOutcome` saying why. The model is configured per deployment (provider and model name); no provider name, key or model name appears in this API.
      operationId: parseTeach
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              oneOf:
                - required: [text]
                - required: [importRef]
              properties:
                companyId:
                  type: string
                  format: uuid
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Typed text (at most 400 characters) or, with `origin` `speech`, one or more finished sentences of a recording (at most 4,000 characters; the Studio sends one sentence per request); a longer `text` is `422 validation_failed`. Not sent with `importRef`. A `text` call spends one parse unit per started 400 characters (at most 10 for a transcript).
                origin:
                  $ref: '#/components/schemas/InputOrigin'
                importRef:
                  $ref: '#/components/schemas/ImportRef'
                sessionId:
                  type: string
                  format: uuid
                  description: Generated by the client once per teach bar session (a new one when the Studio loads or the company changes) and sent with every sentence of that session, so the model step can resolve back-references such as `these services`. The server keeps the last 8 sentences of a session with the concepts each one referenced or introduced, keyed by tenant, caller, company and session; each sentence is kept for 2 hours. A session is readable only by the caller that created it, in the same tenant and company; an unknown or expired `sessionId` starts an empty session and is never an error. A `speech` request is stored as one turn per segment, in order, so the requests of one recording, sent in its `sessionId`, form one conversation. Without `sessionId` the sentence is parsed with no history.
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teach/parse/stream:
    post:
      tags: [Teach]
      summary: Parse a sentence with its drafts streamed as the model answers
      description: |
        The streamed variant of `POST /teach/parse` (ADR 0008, Streamed Parse; decision row 138). Same request body, same permission, same gates, charges and refusals, which answer before the stream begins, with the same status codes and `Problem` bodies as `POST /teach/parse`. The parse itself is the same: the same model call on the same profile, the same budgets (one parse unit per started 400 characters, one `llm` unit, the same token reservation and the same `llm_call` cost row), the same timeout and the same bounded retries of a `429` or `503` from the provider. Only the provider's answer is read as it arrives.

        The response is `200` with `Content-Type: application/x-ndjson` and `Cache-Control: no-store`: one JSON object per line, each ended by a line feed, in this order:

        - `draft` lines, zero or more. When the grammar read a typed sentence whole with no fallback trigger and its drafts read as concept names, those drafts come first, before the model answers, each with a `rules` `DraftNote`; the model's result replaces them, and they are never the ones to submit. Then, each time the model's answer closes another intent, the answer so far goes through the checks and grounding of a whole answer and is mapped to the drafts the result would hold if the answer ended there; each draft not sent yet is sent once, with the next `index` (from 0) and its `DraftNote`. Two drafts are the same when they are equal, or when both are `concept` or `spec` drafts of one concept: the same `companyId`, the same `label` up to singular and plural, and the same `parentId` or `parentLabel`; a draft the model refines (another action or domain for a concept already sent) is not sent again. A part of the answer that fails a check sends nothing; later parts may still send drafts.
        - one `retract` line, only when some sent draft is not in the final result: `indexes` names each such draft. When the whole answer is refused (`llmOutcome` `invalid_output`), every sent draft is named. A client removes what it showed for them.
        - one `result` line, always last on success: `result` is exactly the body `POST /teach/parse` answers for the same request and the same model answer. A draft of the result that is the same as a sent draft that was not retracted (equal, or the same concept) is that draft, refined; the result's own drafts, order and notes are the ones to submit.
        - or, in place of the `result` line, one `error` line when the parse fails after the stream began: `problem` is a `Problem` with code `unavailable` (status `503`); nothing was written, and the client teaches the sentence again.

        A sentence that needs no model step, or whose model step does not run (off, out of budget, rate limited), streams its `result` line alone. The parse runs to its end when the client goes away, so its budget, cost record and teach session turns are those of the plain endpoint. `POST /teach/parse` is unchanged.
      operationId: parseTeachStream
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              oneOf:
                - required: [text]
                - required: [importRef]
              properties:
                companyId:
                  type: string
                  format: uuid
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: As `POST /teach/parse`.
                origin:
                  $ref: '#/components/schemas/InputOrigin'
                importRef:
                  $ref: '#/components/schemas/ImportRef'
                sessionId:
                  type: string
                  format: uuid
                  description: As `POST /teach/parse`.
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The parse as newline-delimited JSON events, each line one `TeachStreamEvent`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/TeachStreamEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /speech/token:
    post:
      tags: [Teach]
      summary: Mint a short-lived Azure AI Speech token for the microphone
      description: |
        Speech recognition (ADR 0013). Returns a Speech token issued by the tenant's Azure AI Speech resource in France Central, with the resource's `region` and the token's `expiresAt`. The Studio passes it to `SpeechConfig.fromAuthorizationToken(token, region)` and recognises English only (`en-GB` by default). The API obtains it server-side and keyless: it takes a Microsoft Entra access token for `https://cognitiveservices.azure.com/.default` and exchanges it at the resource's own `sts/v1.0/issueToken` endpoint on its custom subdomain. The Entra token comes from the dedicated managed identity `ONTAIX_SPEECH_CLIENT_ID`, which holds roles on that one Speech resource only; without it, and only in `dev` and only without `AZURE_FEDERATED_TOKEN_FILE`, from the developer's `az login`. The Entra token never leaves the API; the browser receives only the Speech token, valid about 10 minutes on this one Speech resource and for nothing else. No key ever exists or reaches the browser. The token carries no Ontaix identity and grants nothing in Ontaix.

        Permission - the same as teaching: `proposal.create` in the scope of `companyId` (Owner, Builder, Agent in scope, or Member while `everyoneTeaches` is on); `403` otherwise. `404` when the caller may not read the company. `409 channel_disabled` while the `voice` setting is off. Charges one unit of the caller's hourly `speech` budget (default 60 per user or agent; `429 rate_limited` with `Retry-After`). Each successful call writes the audit entry `speech` `Speech recognition token issued` for that company. `503 unavailable` when no Speech resource or no credential is configured, or the Entra token or the exchange fails; the Studio then falls back to the browser's own recogniser. The response is never cached (`Cache-Control: no-store`) and the token is never logged.
      operationId: mintSpeechToken
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyId]
              properties:
                companyId:
                  type: string
                  format: uuid
                  description: The company being taught; the permission and the audit entry use its scope.
      responses:
        '200':
          description: The token. Not cacheable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /teach/suggest:
    get:
      tags: [Teach]
      summary: Suggest an action between a subject and an object
      description: Pure. Order - the subject's own actions toward the object's domain, then the subject-name table, then the object-name table, then the subject's most common action, then the object's most common incoming action, then `relates to`. The suggestion is never submitted by itself.
      operationId: suggestAction
      x-ontaix-permission: model.read
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: subjectLabel
          in: query
          description: Used when the subject does not exist yet (new-concept box).
          schema:
            type: string
        - name: objectId
          in: query
          schema:
            type: string
            format: uuid
        - name: objectLabel
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The suggested action.
          content:
            application/json:
              schema:
                type: object
                required: [action, rule]
                properties:
                  action:
                    type: string
                  rule:
                    type: string
                    enum: [most_common_in_domain, does, done_to, most_common_out, most_common_in, default]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /import/sentences:
    post:
      tags: [Teach]
      summary: Extract sentences from a document
      description: |
        The only place documents are read - the Studio never extracts text itself and loads nothing from a CDN. Accepts at most 10 MiB of `text/plain`, `text/markdown`, `text/csv`, `application/json`, DOCX (`application/vnd.openxmlformats-officedocument.wordprocessingml.document`), PDF (`application/pdf`, text or scanned), PPTX (`application/vnd.openxmlformats-officedocument.presentationml.presentation`), XLSX (`application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`) or HTML (`text/html`); anything else is `415 unsupported_media_type` (ADR 0011).

        Sniffing - the server decides the type from the bytes, and the declared type must agree with it. The declared type is the form field `mediaType` when given (one of the types above, else `422 validation_failed`), else the file extension, else the part's media type; `mediaType` lets a file be read as a document whatever its name says, for example a PDF named `.txt` or an ontology read as plain text (ADR 0011). `%PDF-` is PDF. A ZIP archive is OOXML only when `[Content_Types].xml` declares exactly one main part of DOCX, PPTX or XLSX; a macro-enabled main part (`docm`, `pptm`, `xlsm`, any `macroEnabled` content type) or a `vbaProject.bin` part is refused, as are legacy binary Office files and encrypted OOXML (both OLE compound files). HTML is text starting, after a byte order mark and whitespace, with `<!doctype html`, `<html`, `<head` or `<body`. Text types are UTF-8 (a UTF-16 byte order mark is converted).

        Per type - every XML part is read with no DTD and no entity expansion; OOXML archives hold at most 1,000 members; decompression is bounded in bytes - each member at most 50 MiB and the archive at most 200 MiB uncompressed, counted while streaming whatever the declared sizes say, and a compression ratio above 100 for any member is refused - and also stops at the extracted-text limit. PDF at most 2,000 pages. PPTX at most 500 slides; slide text and speaker notes, in slide order; images are not read. XLSX at most 50 sheets and 200,000 non-empty cells; each non-empty row becomes one sentence of its cell values joined by `, `, in sheet and row order; formulas are never evaluated (cached values only) and external links never followed. HTML at most 5 MiB and nesting depth 512; parsed without running anything; `script`, `style`, `template`, `noscript`, `iframe`, `object`, `embed`, `svg` and `math` contents are dropped; no external resource is ever fetched (no image, stylesheet, frame, font, base URL or link); block elements end sentences.

        Scanned PDF - a page whose text layer holds fewer than 20 non-space characters is image-only. When a PDF has image-only pages, those pages are sent to the OCR provider behind the API's OCR client (a Mistral document model on an EU DataZone deployment of Azure AI Foundry by default, `ONTAIX_OCR_*` configuration), at most `ONTAIX_OCR_MAX_PAGES` pages per import (default 100) and within `ONTAIX_OCR_TIMEOUT_SECONDS` (default 120) wall clock; the recognised text joins the text-layer pages in page order and is treated exactly like extracted text. Each image-only page spends one unit of the caller's hourly `ocr` page budget, charged before the call (`429 rate_limited`), and the pages are reserved against the tenant's `ocrMonthlyPageCap` (users and agents together; `503 unavailable` when it would be passed); each OCR call writes one `llm_call` row with purpose `document_ocr` and its page count. When OCR is needed and not configured, turned off by `llmMonthlyTokenCap` 0, timed out or failing, the import is refused as a whole with `503 unavailable` and nothing is stored; more image-only pages than the cap is `413`.

        Common limits - Cuts the text into blocks at blank lines, headings, list items and table rows (a line break that only wraps a paragraph is a space), splits each block on sentence punctuation, and cuts a sentence longer than 399 characters after a clause boundary (`;`, `:`, a comma before a conjunction), else at its last space, else at 399 characters, so no text is lost to the length limit. Pieces shorter than 13 characters are left out and counted in `skipped`; nothing is dropped silently. At most 2,000,000 characters of extracted text and at most 2,000 sentences. Extraction runs in a child process with a wall-clock limit and a memory cap. Past any limit the import is refused as a whole with `413 payload_too_large` and nothing is stored. Rate limit - one import unit is charged from the per-user or per-agent import budget before the upload is read, and the call is refused with `429 rate_limited` when that budget is empty; the unit is spent even when extraction finds no sentence. After extraction one parse unit per sentence is charged, taken before anything is stored; when the parse budget cannot cover every sentence the import is refused as a whole with `429 rate_limited` and nothing is stored. The parse budget allows at least 2,000 units per hour, so the largest document fits. Proposals created from the sentences are charged per draft when they are created. Refused with `409 channel_disabled` when the `importDocs` setting is off, and with `422 validation_failed` when the file name, after its directory part is stripped, is empty, longer than 255 characters or 1020 bytes, or holds a refused character; a file name is refused, never rewritten. Stores one `document_import` row (tenant, actor, file name, media type, SHA-256 of the file, extracted sentences with their positions) that expires one hour after creation, and returns its `importId` and the sentences. The client teaches sentence by sentence, citing each as `importRef` (`importId`, `sentenceIndex`); the import is usable only by the actor that created it, in its tenant. Expired imports answer `410 import_expired` until the purge deletes them 24 hours after expiry, then `404`.
      operationId: importSentences
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                mediaType:
                  type: string
                  enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/html]
                  description: The document type to read the file as, in place of its extension and part media type. The bytes must still agree with it.
      responses:
        '503':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The sentences in document order.
          content:
            application/json:
              schema:
                type: object
                required: [importId, expiresAt, fileName, sentences, skipped, origin, originDetail]
                properties:
                  importId:
                    $ref: '#/components/schemas/Id'
                  expiresAt:
                    type: string
                    format: date-time
                  fileName:
                    type: string
                    pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
                    maxLength: 255
                    description: The basename of the uploaded file name, the same value as `originDetail.fileName`.
                  origin:
                    type: string
                    const: document
                  originDetail:
                    type: object
                    additionalProperties: false
                    required: [fileName, mediaType]
                    description: File name and media type of the import; each proposal's `originDetail` adds `sentenceIndex` and `position`.
                    properties:
                      fileName:
                        type: string
                        maxLength: 255
                        pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
                      mediaType:
                        type: string
                        enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/html]
                  sentences:
                    type: array
                    maxItems: 2000
                    items:
                      type: string
                  skipped:
                    type: integer
                    minimum: 0
                    description: Pieces of extracted text left out of `sentences`, for example those shorter than 13 characters. The client shows the count with the import, so nothing is dropped silently.
                  positions:
                    type: array
                    maxItems: 2000
                    description: Present when extraction knows where sentences are; same length and order as `sentences`, null where unknown. The server copies a sentence's position into the proposal; the client never sends it.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/DocumentPosition'
                        - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'

  /import/detect:
    post:
      tags: [Teach]
      summary: Detect whether a file is a document or an ontology
      description: |
        Import routing (ADR 0011, ADR 0012). Reads one upload and answers whether it is a document for `POST /import/sentences` or an ontology for `POST /ontology-imports`, with the ontology format and the document media type the bytes read as. Nothing is extracted, mapped or stored, and no model is called.

        Detection - the bytes decide when they are unambiguous: PDF, DOCX, PPTX and HTML (sniffed as in `POST /import/sentences`) are documents; text whose root element is `rdf:RDF` (RDF/XML) or `owl:Ontology` (OWL/XML), JSON naming an `@context` or `@graph` key (JSON-LD), an OBO `format-version:` header with `[Term]` stanzas, a Turtle `@prefix`, `@base`, `PREFIX` or `BASE` directive, or lines that are all full N-Triples are ontologies. A CSV (by extension, or by `text/csv` when the extension names no document type) or an XLSX workbook is an ontology when its first non-empty row, of the first sheet for XLSX, is a hierarchy header (`label` and `parent` columns, or at least one `Level <n>` column, matched without regard to case or surrounding space), and a document otherwise. Other text follows its extension, else its part media type: an ontology extension (`.owl`, `.rdf`, `.xml`, `.owx`, `.ttl`, `.nt`, `.jsonld`, `.obo`) or media type names the format, anything else is a document. So the content wins over a wrong extension: Turtle named `.txt` is an ontology, a PDF named `.ttl` a document. JSON without `@context` or `@graph` is a document. `mediaType` is always set: the document type the bytes read as (a text type from the extension or part media type, plain text for other text), so a file detected as an ontology can still be read as a document.

        Rules - permission `proposal.create` in some scope (`403` otherwise); `409 channel_disabled` while `importDocs` is off; no import unit is spent. At most the larger of the two import limits (10 MiB and `ONTAIX_ONTOLOGY_IMPORT_MAX_BYTES`), else `413`. XML is read with no DTD and no entity expansion, and only up to its root element; an Office archive follows the OOXML sniffing and decompression bounds of `POST /import/sentences`, and its header row is read in a child process with the ontology parse time limit and memory cap (`503 busy` when every reading slot is taken). Legacy or encrypted Office files, unknown or macro-enabled archives and binary data are `415 unsupported_media_type`; a refused file name is `422 validation_failed`.
      operationId: detectImport
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '200':
          description: What the file is.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kind, format, mediaType]
                properties:
                  kind:
                    type: string
                    enum: [document, ontology]
                  format:
                    type: [string, 'null']
                    enum: [rdf_xml, turtle, owl_xml, json_ld, n_triples, obo, csv, xlsx, null]
                    description: The ontology format when `kind` is `ontology`, else null.
                  mediaType:
                    type: string
                    enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/html]
                    description: The document media type the bytes read as, sent as `mediaType` to `POST /import/sentences` when the file is read as a document.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Problem'

  /import/{importId}/extraction:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Teach]
      summary: Start a whole-document extraction job
      description: |
        Whole-document extraction (ADR 0010). Maps a stored document import into one draft tree for a company, instead of teaching it sentence by sentence. Asynchronous - answers `202` with the job at once; the client follows it with `extraction.changed` events or by polling `GET /extractions/{extractionId}` (every 5 seconds is enough), then reads the result and submits it.

        The job runs two passes over the document split into chunks of at most `ONTAIX_DOCUMENT_EXTRACTION_CHUNK_CHARS` code points (default 10,000) on sentence boundaries, each chunk overlapping the previous one by 2 sentences. Pass 1 (outline) - chunk by chunk, the model builds a hierarchy of the business from the text, the outline so far carried forward. Pass 2 (sections) - chunk by chunk, the model returns intents against the frozen outline. The server maps both to one draft tree. There is no depth limit: a node may attach under any node of the outline, at any depth, by handle or by a path of labels. The only ceilings, for cost protection, are the job's total drafts (`ONTAIX_DOCUMENT_EXTRACTION_MAX_NODES`, default 2,000) and its token budget (`ONTAIX_DOCUMENT_EXTRACTION_MAX_TOKENS`, default 1,000,000, within the tenant's `llmMonthlyTokenCap`). Grounding is kept - every new label must be words of the document; the model chooses structure, actions and domains, never labels. Document text is untrusted data, sent in delimited fields.

        Rules - the import belongs to the caller's tenant and to the same user (`404` otherwise), is not expired (`410 import_expired`) and holds at most `ONTAIX_DOCUMENT_EXTRACTION_MAX_CHARS` extracted characters (default 400,000; `413 payload_too_large` above). One job per import (`409 extraction_exists`) and one running job per user (`409 extraction_running`). `409 channel_disabled` while `importDocs` is off. Permission - `proposal.create` in the company's scope through the Owner or Builder role (ADR 0003 check point 13); agents and `everyoneTeaches` Members get `403`. Charges one unit of the hourly `extraction` budget (default 5 jobs per user per hour; `429 rate_limited` when empty). An unavailable model or an exhausted token cap is not an error here - the job ends `failed` with the reason in `failureReason`.
      operationId: startDocumentExtraction
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyId]
              properties:
                companyId:
                  $ref: '#/components/schemas/Id'
      responses:
        '202':
          description: The job, queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtraction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /extractions/{extractionId}:
    parameters:
      - $ref: '#/components/parameters/ExtractionId'
    get:
      tags: [Teach]
      summary: Get a whole-document extraction job's status
      description: Readable only by the user who started the job, in its tenant (`404` otherwise). Cheap to poll; carries progress counts, never labels.
      operationId: getDocumentExtraction
      x-ontaix-permission: proposal.create
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtraction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teach]
      summary: Cancel a whole-document extraction job
      description: Asks a queued or running job to stop. The runner stops before its next model call (a call in flight finishes or times out and is recorded), and the job ends `cancelled` with no result. Cancelling a job that has already ended returns it unchanged.
      operationId: cancelDocumentExtraction
      x-ontaix-permission: proposal.create
      responses:
        '202':
          description: The job, with `cancelRequested` true or already final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtraction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /extractions/{extractionId}/result:
    parameters:
      - $ref: '#/components/parameters/ExtractionId'
    get:
      tags: [Teach]
      summary: Get a finished job's draft tree
      description: The outline and the draft tree of a `succeeded` job; `409 extraction_not_ready` before that, `410 extraction_expired` more than 24 hours after the job finished (then `404` once purged, 24 hours later). Only for the user who started the job.
      operationId: getDocumentExtractionResult
      x-ontaix-permission: proposal.create
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtractionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /extractions/{extractionId}/proposals:
    parameters:
      - $ref: '#/components/parameters/ExtractionId'
    post:
      tags: [Proposals]
      summary: Propose a job's draft tree
      description: Creates one proposal per selected draft of a `succeeded` job, in draft order (parents before children), in one all-or-nothing transaction, from the drafts the server stored; the client sends indexes only. Each proposal records `origin` `document` with the `originDetail` of the sentence that grounded it (file name, media type, sentence index, position), copied into the job when it was mapped, so it survives the import's purge. Same rules as `POST /expansions/{expansionId}/proposals` - one successful call per job (`409 extraction_submitted`), `409 extraction_not_ready` before success, `410 extraction_expired` after 24 hours, selection closed under `DocumentDraftNote.requires` (`422` otherwise), every check of `POST /proposals/batch`, one proposal unit per proposal, and the caller must still hold `proposal.create` through Owner or Builder. The Studio submits every draft; the tree is then reviewed in the changes panel, by branch with `POST /proposals/{proposalId}/approve-branch` or by the cascading reject.
      operationId: proposeDocumentExtraction
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [indexes]
              properties:
                indexes:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 0
                    maximum: 4999
      responses:
        '202':
          description: The created proposals in draft order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5000
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Busy'

  /ontology-imports:
    post:
      tags: [Teach]
      summary: Map an ontology or hierarchy file to a draft tree
      description: |
        Ontology import (ADR 0012). Deterministic - no language model is called. Reads one OWL ontology (RDF/XML, Turtle, OWL/XML, JSON-LD or N-Triples, SKOS vocabularies included), one OBO file, or a CSV or XLSX hierarchy, maps it to one draft tree in `companyId` under `parentConceptId` (default the company root), stores the tree for 24 hours and returns it. Writes no ontology row and no proposal; `POST /ontology-imports/{ontologyImportId}/proposals` turns a selection into proposals with origin `ontology_import`, reviewed branch by branch like a whole-document tree (ADR 0010).

        Ontaix annotations (ADR 0016, decision row 149) - when the file declares the `https://ontaix.dev/ns#` vocabulary, as an Ontaix OWL export does, `ox:bornFrom` with `ox:birthAction` and `ox:birthReverse` places a class under its birth parent with that action (instead of under `parentConceptId`), `ox:domain` sets its domain when the tenant has that domain, and annotation assertions of properties typed by `ox:attributeType` become taught attributes; `someValuesFrom` restrictions that repeat a birth relation are not drafted twice. So an OWL export of a company round-trips into the same model.

        Mapping - named classes (`owl:Class`, `rdfs:Class`), SKOS concepts and OBO terms become concepts: `rdfs:subClassOf` and OBO `is_a` give the parent path as specialisation drafts, `skos:broader` gives a concept born from its broader concept with action `includes`; a class with no named parent in the file is born under `parentConceptId`; further named parents become `is a` relation drafts. Object properties with a domain and a range, `someValuesFrom` and `allValuesFrom` restrictions on a named property, and OBO `relationship` lines become relation drafts whose action is the property's label, normalised (camel case split, lower-cased, at most 60 characters) and refused when it normalises to `is a` or `equivalent to`. CSV and XLSX hierarchies use either `label` and `parent` columns (optional `id`, `action`, `domain`) or level columns `Level 1`, `Level 2` and so on, as many as the file has; an `action` cell is normalised like a property verb and skipped as `forbidden_action` when it normalises to `is a` or `equivalent to` (the row is then born with `includes`), so specialisation comes only from `subClassOf` or `is_a`. XLSX files follow the OOXML sniffing and decompression bounds of `POST /import/sentences`. Individuals become concepts under their class with action `has instance` when `individuals` is `as_concepts`, and are skipped otherwise. There is no depth limit.

        Labels - chosen per item by `languages` preference: `skos:prefLabel`, then `rdfs:label`, then `skos:altLabel`, then the OBO `name`, then the IRI's local name split into words; within each, the first language of `languages`, then an untagged literal, then any other language in tag order. Labels meet every label rule of the API (1 to 120 characters, no markup, control or format characters) or the item is skipped (`invalid_label`).

        Reuse - an item whose chosen label matches a live or pending concept of the company (case-insensitive, singular or plural) reuses that concept: no draft, and its children attach to it. An item already in place (same label under the same parent) or a relation that already exists is skipped as `already_known`. All skips are reported in `skipped`.

        Limits - at most `ONTAIX_ONTOLOGY_IMPORT_MAX_BYTES` (default 20 MiB) and 1,000,000 triples or 200,000 CSV or XLSX rows; at most `ONTAIX_ONTOLOGY_IMPORT_MAX_NODES` drafts (default 5,000, at most 20,000; beyond it `413`). Parsing runs in a child process with `ONTAIX_ONTOLOGY_IMPORT_PARSE_TIMEOUT_SECONDS` (default 60) and a memory cap; past it `413`. `owl:imports` is never fetched (each one is reported as `remote_import_not_fetched`); a JSON-LD remote `@context` is never fetched (`422`); XML is read with no DTD and no entity expansion; no reasoner runs - only asserted axioms are read. Every limit refuses the whole import; nothing is stored.

        Rules - permission `proposal.create` in the scope of `companyId` (and of `parentConceptId` when given, which must be an approved live concept of that company, else `404` or `409 concept_pending`); `409 channel_disabled` while `importDocs` is off; one unit of the import budget (`429`). The detected format must agree with the declared one (`415` otherwise): the form field `format` when given, else the extension, else the part media type. `format` lets a file be read in a chosen format whatever its name says; `turtle` also accepts N-Triples content, and an unknown value is `422 validation_failed`.
      operationId: importOntology
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, companyId]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                companyId:
                  type: string
                  format: uuid
                parentConceptId:
                  type: string
                  format: uuid
                languages:
                  type: string
                  maxLength: 100
                  pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*(,[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*){0,9}$'
                  description: Label language preference, BCP 47 tags separated by commas, first preferred, at most 10, for example `en,fr`. Default `en`.
                individuals:
                  type: string
                  enum: [skip, as_concepts]
                  default: skip
                domainKey:
                  $ref: '#/components/schemas/DomainKey'
                format:
                  type: string
                  enum: [rdf_xml, turtle, owl_xml, json_ld, n_triples, obo, csv, xlsx]
                  description: The format to read the file as, in place of its extension and part media type. The bytes must still agree with it.
      responses:
        '200':
          description: The mapped tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /ontology-imports/{ontologyImportId}:
    parameters:
      - $ref: '#/components/parameters/OntologyImportId'
    get:
      tags: [Teach]
      summary: Get a stored ontology import's tree
      description: Only for the actor that created it, in its tenant (`404` otherwise); `410 ontology_import_expired` after 24 hours, `404` once purged 24 hours later.
      operationId: getOntologyImport
      x-ontaix-permission: proposal.create
      responses:
        '200':
          description: The mapped tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

  /ontology-imports/{ontologyImportId}/proposals:
    parameters:
      - $ref: '#/components/parameters/OntologyImportId'
    post:
      tags: [Proposals]
      summary: Propose an ontology import's tree
      description: Creates one proposal per selected draft, in draft order, in one all-or-nothing transaction, from the drafts the server stored; the client sends indexes only. Each proposal records `origin` `ontology_import` (`originDetail` null) and a `why` of `Imported from <file name> · <source>` (the item's IRI or row, cut to 200 characters), as text. Same rules as `POST /expansions/{expansionId}/proposals` - one successful call (`409 ontology_import_submitted`), `410 ontology_import_expired` after 24 hours, selection closed under `OntologyImportNote.requires` (`422`), every check of `POST /proposals/batch`, one proposal unit per proposal, and the caller must still hold `proposal.create` in scope. The Studio submits every draft and the tree is reviewed with `POST /proposals/{proposalId}/approve-branch` and the cascading reject.
      operationId: proposeOntologyImport
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [indexes]
              properties:
                indexes:
                  type: array
                  minItems: 1
                  maxItems: 20000
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 0
                    maximum: 19999
      responses:
        '202':
          description: The created proposals in draft order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20000
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Busy'

