  /concepts/{conceptId}/expand:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    post:
      tags: [Concepts]
      summary: Ask the language model to suggest children for a concept
      description: |
        Concept expansion (ADR 0009). The model suggests new concepts under the expanded concept - children, and their children at any depth - and optional relations between them. Writes no ontology row and no proposal: it returns drafts with per-draft notes and stores them as one `concept_expansion` row for one hour, so that the caller can submit a selection with `POST /expansions/{expansionId}/proposals`, which records each proposal with the server-set origin `suggestion`. Every suggestion then still needs a human approval.

        Unlike teach extraction, expansion is not grounded in the caller's words; it is bounded instead. There is no depth limit: a suggestion may sit at any depth below the expanded concept. The only ceilings, for cost protection, are the total drafts per run (`ONTAIX_EXPAND_MAX_NODES`, default 200, at most 2,000, concepts and relations together) and the token budget. `depth` and `maxChildren` are optional steering from the caller, not caps. Labels are 1 to 60 characters with the label character rules of teach extraction (no markup, control or format characters, no bidirectional controls, no surrounding space, at least one letter), actions normalised (NFKC, whitespace collapsed, trimmed, lower-cased) and never `is a` or `equivalent to`, no specialisation drafts. Every draft is born under the expanded concept or under another draft of the same response, in the expanded concept's company; relation drafts join only the expanded concept and drafts of the same response. No other existing concept can be cited, because the model is given no handle for one. A suggestion whose label matches a live or pending concept of the company (case-insensitive, singular or plural), or repeats an earlier suggestion, is skipped with its descendants and reported in `skipped`.

        What the model receives, as delimited data and never as instructions - the expanded concept's label and domain, its ancestors, its siblings and its existing descendants, the company name, the nine domain templates, the labels of the company's concepts in the expanded concept's domain, and the caller's `focus`. Nothing of another company, and none of the ADR 0008 never-sent list.

        Permission - `proposal.create` in the concept's scope through the Owner or Builder role (ADR 0003 check point 13). Members who teach through `everyoneTeaches` and agents are refused with `403`. `404` when the caller may not read the concept, and for a source, a dying or a deleted concept; `409 concept_pending` for a concept awaiting approval. The company root may be expanded.

        Budgets - one unit of the caller's hourly `expand` budget is charged first (`429 rate_limited` when it is empty). Then, as for teach extraction, one unit of the hourly `llm` budget and a token reservation against `llmMonthlyTokenCap`; either being exhausted gives `200` with no drafts and `llmOutcome` `rate_limited` or `budget_exhausted`. Each provider call writes one `llm_call` row with purpose `concept_expansion`. A timeout (`ONTAIX_EXPAND_TIMEOUT_SECONDS`, default 120 seconds, wall clock), provider error, content filter or model refusal, or an invalid answer gives `200` with no drafts, `degraded` true and the reason in `llmOutcome`; the model never produces a `5xx`.
      operationId: expandConcept
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpansionRequest'
      responses:
        '200':
          description: The suggestions, or none with the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpansionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

