openapi: 3.1.0
info:
  title: Ontaix API
  version: 1.0.0
  summary: Control-plane API for the Ontaix ontology, proposals, identity, bindings and audit.
  description: |
    The Ontaix API serves the Studio, the admin portal and the MCP gateway.

    Rules that every endpoint follows:

    - Every change to the ontology (concept, specialisation, relation, equivalence, source, binding, attribute, and any rename, deletion, edit or unbind) is a proposal. Ontology mutation endpoints return `202 Accepted` with the proposal; nothing writes an approved ontology row directly.
    - Settings, appearance, identity (groups, members, roles), source enable/disable/reconfigure and agent access are immediate and audited.
    - Authentication is a password session (ADR 0017): `POST /auth/sign-in` sets the `__Host-ontaix_session` cookie, and there is no sign-up. Agents authenticate with their bearer token (`agentToken`); OIDC bearer tokens for users (`bearerAuth`) are specified and not enabled in this deployment. How a caller authenticates never decides what it may do: authorisation is Ontaix-native, and roles reach a user only through group membership in this API's own tables.
    - Organizations: every tenant is an organization, its own instance; a member's session names exactly one, and every read and write is confined to it by the repositories and by PostgreSQL row-level security. Only a super admin (a platform role outside every organization) creates organizations and accounts, under `/admin`, and enters an organization only through an audited read-only support session.
    - Errors are `application/problem+json` with a stable `code`.
    - Lists that can grow large (concepts, relations, bindings, users, groups, agents, audit) share one pagination, search, filter and sort convention: `page`, `pageSize`, `q`, `filter[<field>]=<value>`, `sort`, `order`, and return `{ items, page, pageSize, total }`.
    - The tenant is resolved from the session or token; no path outside `/admin` carries a tenant id.

    Live updates: `POST /api/v1/ws/ticket` mints a one-time ticket; `GET /api/v1/ws?ticket=` upgrades to a WebSocket that carries the events described in `contracts/events.yaml`, in the envelope `{ id, type, occurredAt, tenantId, companyIds, sequence, actor, bulk, payload }`. A bearer token is never accepted in a query string. Reconnect with `?since=<sequence>` to receive missed events; a `snapshot.required` message means the client must reload `GET /api/v1/scene`. Each event is delivered only to callers holding the permission its channel declares as `x-ontaix-visibility` in a scope that contains every company in the event's `companyIds` (any scope when the list is empty).

    Authorisation: every operation declares the permission it needs as `x-ontaix-permission` (vocabulary in ADR 0003); QA contract tests assert it. Ontology reads and events are limited to the companies the caller may read. Anything that spans several companies (a cross-company relation, a proposal touching two companies, its events and its audit entries) is returned only to a caller who may read every one of them.

    Contention: every operation that creates or decides a proposal serialises on the tenant's decision lock. When that lock, or any row lock the same transaction waits for afterwards, is not granted within the lock timeout, or the transaction ends in a deadlock or serialisation failure, the operation writes nothing and answers `503` with code `busy` and a `Retry-After` header; the client retries the same request. `unavailable` is reserved for a capability or dependency that is down, which clients do not retry automatically.

    Rate limits: operations that parse text, import documents, create proposals or open outbound connections return `429` with code `rate_limited` when a per-user or per-agent budget is exceeded; the `Retry-After` header says when to retry. Budgets are counted in the database (`rate_budget_window`), so every API replica shares them.

    Language model: Ontaix calls a language model in three places only, the extraction step of `POST /teach/parse` (ADR 0008), concept expansion, `POST /concepts/{conceptId}/expand` (ADR 0009), and whole-document extraction jobs, `POST /import/{importId}/extraction` (ADR 0010). OCR of scanned PDF pages during `POST /import/sentences` calls a document model through the same provider (ADR 0011). Ontology import (`POST /ontology-imports`, ADR 0012) calls no model. The model produces drafts, never writes, and its absence, failure or budget exhaustion never turns a request into an error. Teach extraction is grounded in the caller's own words; concept expansion is deliberately creative and ungrounded, so its suggestions are bounded by their own caps and carry the server-set origin `suggestion`.

    CORS and CSRF: the Studio and the API are served from one origin (the ingress routes `/api` to the API), so the session cookie is first-party and host-only; the API answers an explicit origin allow-list from configuration, never a wildcard. Every POST, PUT, PATCH and DELETE authenticated by the cookie must carry `X-CSRF-Token` equal to the session's `csrfToken` (compared in constant time) and an `Origin` header in the allow-list; otherwise `403 csrf_failed`. `POST /auth/sign-in` checks `Origin` only. Bearer-token calls carry no cookie and need neither.

    Development identity: only when `ONTAIX_ENVIRONMENT` is `dev` or `test` and `ONTAIX_DEV_IDENTITY_HEADER` is true does the header `X-Ontaix-User: <email>` name a seeded directory user of issuer `dev`, without a session and without CSRF checks; a live session cookie takes precedence. Outside those environments the process refuses to start with the flag on.
  license:
    name: Proprietary
    identifier: LicenseRef-Ontaix-Proprietary
  contact:
    name: Ontaix architect agent
servers:
  - url: '{scheme}://{host}/api/v1'
    description: Local development runs on http at port 8000 of the loopback host; the Azure dev environment is api.ontaix.dev over https.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.ontaix.dev
security:
  - sessionCookie: []
  - bearerAuth: []
  - agentToken: []
tags:
  - name: Authentication
    description: Sign-in with email and password, sign-out, the current session and password change. No sign-up; a forgotten password is reset by a super admin.
  - name: Platform
    description: Super admin only - organizations, their accounts and passwords, read-only support sessions, and the platform audit log.
  - name: Scene
    description: One-call snapshot for the canvas, coverage, shared view state and stored positions.
  - name: Companies
    description: Companies (business-as-a-product) and their nine domain products.
  - name: Concepts
    description: Cells of the canvas, their attributes and lineage. Mutations are proposals.
  - name: Relations
    description: Directed lines between concepts, including cross-company equivalences. Mutations are proposals.
  - name: Sources
    description: Connector catalogue, discovery, connected systems and bindings. Adding, removing, binding and unbinding are proposals; enable, disable and reconfigure are immediate.
  - name: Proposals
    description: The approval queue - create, list, approve, second-approve, reject with cascade, approve-all, reject-all.
  - name: Teach
    description: The three ways content enters the model - text typed in the teach bar, speech from the teach bar microphone (transcribed on the client and sent as text), and documents (text extracted server-side). All three end in the same parser, with a language model fallback for sentences the grammar cannot handle, and produce proposal drafts; nothing is written without approval.
  - name: Identity
    description: Current user, native users directory, groups, memberships, roles and scopes.
  - name: Agents
    description: Agent registry and cost management.
  - name: Settings
    description: Tenant settings, the companies-may-interact switch and appearance.
  - name: Export
    description: The ontology as OWL, SKOS or a Word document (ADR 0016).
  - name: Audit
    description: Append-only audit log.
  - name: System
    description: Health.

paths:
  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: getHealth
      x-ontaix-permission: none
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- Scene
  /scene:
    get:
      tags: [Scene]
      summary: Load the whole canvas state in one call
      description: Returns every company, domain product, node (concept and source), link (relation and binding), open proposal, settings, view state and the current event sequence, limited to the companies the caller may read. The Studio fills its arrays from this response and keeps them current from the WebSocket.
      operationId: getScene
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /coverage:
    get:
      tags: [Scene]
      summary: Coverage figures per company and domain product
      operationId: getCoverage
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Coverage figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /view-state:
    put:
      tags: [Scene]
      summary: Store the shared view state (coverage flag)
      operationId: putViewState
      x-ontaix-permission: view.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewState'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /positions:
    put:
      tags: [Scene]
      summary: Store node positions and pinned flags
      description: Called by the Studio after a drag or an Arrange, at most every 1500 ms. Positions belong to the tenant, so every user sees the same layout.
      operationId: putPositions
      x-ontaix-permission: view.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes]
              properties:
                nodes:
                  type: array
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/NodePosition'
      responses:
        '204':
          description: Stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /ws/ticket:
    post:
      tags: [Scene]
      summary: Mint a one-time WebSocket ticket
      description: Returns an opaque ticket bound to the caller's identity and permissions, valid for 30 seconds and for one connection. The Studio passes it as `?ticket=` when opening `GET /ws`, so a bearer token never appears in a URL.
      operationId: createWsTicket
      x-ontaix-permission: model.read
      responses:
        '201':
          description: The ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket:
                    type: string
                    maxLength: 128
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /ws:
    get:
      tags: [Scene]
      summary: Live-update WebSocket
      description: Upgrades to a WebSocket. Authentication is the one-time ticket from `POST /ws/ticket`; the bearer schemes do not apply here and a token in the query string is refused with `401`. Every message is an `Envelope` from `contracts/events.yaml`; the server delivers an event only when the caller holds its channel's `x-ontaix-visibility` permission in a scope that contains every company in the event's `companyIds`; an empty `companyIds` is tenant-wide. Pass `since` to resume; a `snapshot.required` message means the gap is too old and the client must reload `GET /scene`.
      operationId: connectWs
      x-ontaix-permission: model.read
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
        - name: since
          in: query
          description: Last applied `sequence`; on a first connection pass the `sequence` of the `GET /scene` response.
          schema:
            type: integer
            minimum: 0
      responses:
        '101':
          description: Switching protocols; the connection now carries Envelope messages.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Ticket missing, expired, already used, or a bearer token was passed in the query string.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Companies
  /companies:
    get:
      tags: [Companies]
      summary: List companies with their counters
      operationId: listCompanies
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Companies in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Companies]
      summary: Add a company
      description: 'Immediate and audited (kind `company`). Creates the domain products of the tenant''s domains and the root cell. With `start` set to `starter_vocabulary` the thirteen starter concepts are created as proposals, awaiting approval. Refused with `409 company_creation_disabled` while the `companyCreation` setting is off, and with `409 company_limit` when the organization''s `companyMode` is `single` and it already has a company.'
      operationId: createCompany
      x-ontaix-permission: company.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '201':
          description: The company, its domain products, its root and the starter proposals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Get one company
      operationId: getCompany
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Companies]
      summary: Propose removing a company
      description: Creates a `change` proposal (`remove_company`). The home company cannot be removed (`409 home_company`). The proposal names what goes, from `POST /deletion-impact` with `wholeCompany` - concepts, relations (cross-company ones counted separately), sources, bindings and attributes (ADR 0015). On approval, every open proposal touching the company is rejected by cascade, every cross-company relation and equivalence to it is removed, the company is marked dying and then purged with its concepts, relations, domain products, sources, bindings, attributes, document imports, expansions and extraction jobs; audit entries stay. Proposed with `proposal.create` in the company's scope; approved by an Owner of the company or a Governor.
      operationId: proposeRemoveCompany
      x-ontaix-permission: proposal.create
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /domains:
    get:
      tags: [Companies]
      summary: List the tenant's domains
      description: Every domain of the tenant (ADR 0015) - the nine templates, possibly renamed, and custom domains - with effective colour, owner, revision and position. Tenant-wide; readable by any role.
      operationId: listDomains
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The domains in ring order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 64
                items:
                  $ref: '#/components/schemas/TenantDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Companies]
      summary: Propose a new domain
      description: Creates a `change` proposal (`create_domain`). On approval the domain joins the tenant with its name, owner and colour, available to every company; a company's domain product for it is created when its first concept joins it. The key is derived from the name (lower case, ASCII letters, digits and `_`, made unique). At most 64 domains per tenant (`409 domain_limit`); a name equal to an existing domain's, case-insensitive, is `409 duplicate_label`. Tenant scope - proposed with `proposal.create` at tenant scope (Builder or Agent at tenant scope), approved by a Governor at tenant scope.
      operationId: proposeCreateDomain
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainInput'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /domains/{domainKey}:
    parameters:
      - name: domainKey
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DomainKey'
    patch:
      tags: [Companies]
      summary: Propose renaming or recolouring a domain
      description: Creates a `change` proposal (`edit_domain`) with a new `name`, `color` and/or `owner`. A domain is tenant-wide, so on approval it changes in every company - every concept of the domain takes the new colour, as the UI contract requires a domain's colour to be the same everywhere. Approval writes the colour into the tenant's appearance colours (the value Appearance edits immediately), increments the domain's revision, records `tenant_domain_revision`, and emits `domain.changed` and `appearance.changed`. Scope - the domain scope for that key, proposed by an Owner or Builder with a domain or tenant scope covering it, approved by an Owner of that domain or a Governor. `409 duplicate_label` for a taken name.
      operationId: proposeEditDomain
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                color:
                  $ref: '#/components/schemas/Hex'
                owner:
                  type: string
                  maxLength: 60
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /concepts/{conceptId}/move:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    post:
      tags: [Concepts]
      summary: Propose moving a concept to another domain
      description: Creates a `change` proposal (`move_concept_domain`). On approval the concept joins the company's domain product for `domainKey` (created when the company has none yet), takes that domain's colour and cluster on the canvas, and both domain products' revisions increment; its children, relations and bindings stay as they are. Not for the company root (`409 root_concept`) or a pending concept (`409 concept_pending`); the same domain is `422`. The caller must be able to propose in both the source and the target domain scope; approval needs approval rights in both.
      operationId: proposeMoveConcept
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domainKey]
              properties:
                domainKey:
                  $ref: '#/components/schemas/DomainKey'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /deletion-impact:
    post:
      tags: [Proposals]
      summary: What a deletion would remove
      description: Pure. For a set of concepts and/or domain products of one company, or for a whole company, returns what approving the deletion would remove - the descendants (live concepts born from them transitively through the parent chain, as `descendants_of`), the relations (every live relation touching any of them, each counted once, bindings excluded, cross-company relations counted separately), bindings, taught and source attributes, and open proposals that would be rejected by cascade - with at most 6 names per list. The Studio's confirmations for concept, domain, bulk and company deletion all read it. Only what the caller may read is counted; `404` for anything the caller may not read.
      operationId: getDeletionImpact
      x-ontaix-permission: model.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionTarget'
      responses:
        '200':
          description: The impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionImpact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /proposals/bulk-delete:
    post:
      tags: [Proposals]
      summary: Propose deleting several concepts and domains at once
      description: Creates one `change` proposal (`delete_bulk`) for up to 200 concepts and up to 20 domain products of one company (`422` when they span companies, or when the list is empty). Approval deletes them all at once, all or nothing - each concept with its descendants and relations, as `delete_concept`; each domain product with its concepts, their descendants and relations, as `delete_domain` - and rejects by cascade the open proposals that touch them. The proposal names what goes, from the same computation as `POST /deletion-impact`. The company root cannot be in the list (`409 root_concept`). The caller must be able to propose in every item's scope; approval needs approval rights in every item's scope (`403` otherwise, nothing applied).
      operationId: proposeBulkDelete
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyId]
              properties:
                companyId:
                  $ref: '#/components/schemas/Id'
                conceptIds:
                  type: array
                  maxItems: 200
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
                domainProductIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /export:
    get:
      tags: [Export]
      summary: Export the ontology
      description: |
        Export (ADR 0016). Generated server-side, synchronously, from the approved model only - pending concepts, relations and attributes are left out. Scope - `scope=company` with `companyId`, `scope=domain` with `domainProductId` (one company's domain product), or `scope=all` (every company the caller may read). Only what the caller may read is exported; a cross-company relation or equivalence is included only when the caller may read both companies. Formats - OWL 2 is first-class: `owl` is OWL 2 in RDF/XML (`application/rdf+xml`, file `.owl`), the primary format; `owx` is OWL 2 in OWL/XML (`application/owl+xml`, `.owx`); `turtle` is OWL 2 in Turtle (`text/turtle`, `.ttl`); `jsonld` is OWL 2 in JSON-LD (`application/ld+json`, `.jsonld`). `skos` is the SKOS mapping in Turtle (`.skos.ttl`). `docx` is a Word document describing the scope. The class and property mapping is documented in ADR 0016; every OWL format carries the same axioms and annotations, and an OWL export of a company imports back through `POST /ontology-imports` into the same concepts, hierarchy, actions, relations, specialisations, domains and taught attributes (a contract test checks the round trip). Limits - at most `ONTAIX_EXPORT_MAX_CONCEPTS` concepts (default 20,000; `413` above), generated in a child process within 60 seconds (`503 unavailable` past it). Rate limit - one unit of the hourly `export` budget (default 20 per caller). Audited (kind `export`, the scope and format, never the content). The response carries `Content-Disposition: attachment` with a file name made from the scope and the date, and `Cache-Control: no-store`.
      operationId: exportOntology
      x-ontaix-permission: model.read
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [company, domain, all]
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
        - name: domainProductId
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [owl, owx, turtle, jsonld, skos, docx]
      responses:
        '200':
          description: The export file.
          headers:
            Content-Disposition:
              schema:
