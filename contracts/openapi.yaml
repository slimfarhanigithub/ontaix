        caption:
          type: string
          maxLength: 300

    SourceUpdate:
      type: object
      description: Connection settings only. Renaming a source is a `change` proposal with `changeKind` `rename_source`.
      minProperties: 1
      properties:
        host:
          type: string
          maxLength: 300
        scope:
