      summary: List what Ontaix has learnt from usage in a company
      description: |
        Usage learning (ADR 0014). Returns the company's learning switch, its active lessons (approve, reject and correct examples), its active speech aliases and the habits summary derived from its approved relations, as the model receives them. Administrator at tenant scope only (`settings.write`); `404` for a company of another tenant. There is no Studio screen for learning: the Studio shows nothing new, and this API is for administrators and support tools. Paginated over lessons; filterable - `signal`, `task`; sortable - `createdAt`. Aliases are returned whole (at most 1,000). Lesson and alias text is company content written by people or models - rendered as text by any client.
