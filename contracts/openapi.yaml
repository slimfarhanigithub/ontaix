openapi: 3.1.0
info:
  title: Ontaix API
  version: 1.0.0
  summary: Control-plane API for the Ontaix ontology, proposals, identity, bindings and audit.
  description: |
    The Ontaix API serves the Studio, the admin portal and the MCP gateway.

    Rules that every endpoint follows:

    - Every change to the ontology (concept, specialisation, relation, equivalence, source, binding, attribute, and any rename, deletion, edit or unbind) is a proposal. Ontology mutation endpoints return `202 Accepted` with the proposal; nothing writes an approved ontology row directly.
    - Settings, appearance, identity (groups, members, roles), source enable/disable/reconfigure and agent access are immediate and audited.
    - Authentication is a bearer OIDC ID token or access token. Authorisation is Ontaix-native: roles reach a user only through group membership in this API's own tables.
    - Errors are `application/problem+json` with a stable `code`.
    - Lists that can grow large (concepts, relations, bindings, users, groups, agents, audit) share one pagination, search, filter and sort convention: `page`, `pageSize`, `q`, `filter[<field>]=<value>`, `sort`, `order`, and return `{ items, page, pageSize, total }`.
    - The tenant is resolved from the token; no path carries a tenant id.

    Live updates: `POST /api/v1/ws/ticket` mints a one-time ticket; `GET /api/v1/ws?ticket=` upgrades to a WebSocket that carries the events described in `contracts/events.yaml`, in the envelope `{ id, type, occurredAt, tenantId, companyIds, sequence, actor, bulk, payload }`. A bearer token is never accepted in a query string. Reconnect with `?since=<sequence>` to receive missed events; a `snapshot.required` message means the client must reload `GET /api/v1/scene`. Each event is delivered only to callers holding the permission its channel declares as `x-ontaix-visibility` in a scope that contains every company in the event's `companyIds` (any scope when the list is empty).

    Authorisation: every operation declares the permission it needs as `x-ontaix-permission` (vocabulary in ADR 0003); QA contract tests assert it. Ontology reads and events are limited to the companies the caller may read. Anything that spans several companies (a cross-company relation, a proposal touching two companies, its events and its audit entries) is returned only to a caller who may read every one of them.

    Contention: every operation that creates or decides a proposal serialises on the tenant's decision lock. When that lock, or any row lock the same transaction waits for afterwards, is not granted within the lock timeout, or the transaction ends in a deadlock or serialisation failure, the operation writes nothing and answers `503` with code `busy` and a `Retry-After` header; the client retries the same request. `unavailable` is reserved for a capability or dependency that is down, which clients do not retry automatically.

    Rate limits: operations that parse text, import documents, create proposals or open outbound connections return `429` with code `rate_limited` when a per-user or per-agent budget is exceeded; the `Retry-After` header says when to retry.

    CORS: the API answers an explicit origin allow-list from configuration, never a wildcard. Authentication is bearer tokens only, no cookies, so there is no CSRF surface.
  license:
    name: Proprietary
    identifier: LicenseRef-Ontaix-Proprietary
  contact:
    name: Ontaix architect agent
servers:
  - url: '{scheme}://{host}/api/v1'
    description: Local development runs on http at port 8000 of the loopback host; the Azure dev environment is api.ontaix.dev over https.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.ontaix.dev
security:
  - bearerAuth: []
  - agentToken: []
tags:
  - name: Scene
    description: One-call snapshot for the canvas, coverage, shared view state and stored positions.
  - name: Companies
    description: Companies (business-as-a-product) and their nine domain products.
  - name: Concepts
    description: Cells of the canvas, their attributes and lineage. Mutations are proposals.
  - name: Relations
    description: Directed lines between concepts, including cross-company equivalences. Mutations are proposals.
  - name: Sources
    description: Connector catalogue, discovery, connected systems and bindings. Adding, removing, binding and unbinding are proposals; enable, disable and reconfigure are immediate.
  - name: Proposals
    description: The approval queue - create, list, approve, second-approve, reject with cascade, approve-all, reject-all, finalise-all.
  - name: Teach
    description: Rule-based teach parser, sentence import and action suggestion. The parser only drafts; it never writes.
  - name: Identity
    description: Current user, native users directory, groups, memberships, roles and scopes.
  - name: Agents
    description: Agent registry and cost management.
  - name: Settings
    description: Tenant settings, the companies-may-interact switch and appearance.
  - name: Audit
    description: Append-only audit log.
  - name: Demo
    description: Scripted story layer, available only when the tenant flag demoStory is on.
  - name: System
    description: Health.

paths:
  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: getHealth
      x-ontaix-permission: none
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- Scene
  /scene:
    get:
      tags: [Scene]
      summary: Load the whole canvas state in one call
      description: Returns every company, domain product, node (concept and source), link (relation and binding), open proposal, settings, view state and the current event sequence, limited to the companies the caller may read. The Studio fills its arrays from this response and keeps them current from the WebSocket.
      operationId: getScene
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /coverage:
    get:
      tags: [Scene]
      summary: Coverage figures per company and domain product
      operationId: getCoverage
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Coverage figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /view-state:
    put:
      tags: [Scene]
      summary: Store the shared view state (coverage flag, scene index)
      operationId: putViewState
      x-ontaix-permission: view.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewState'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /positions:
    put:
      tags: [Scene]
      summary: Store node positions and pinned flags
      description: Called by the Studio after a drag or an Arrange, at most every 1500 ms. Positions belong to the tenant, so every user sees the same layout.
      operationId: putPositions
      x-ontaix-permission: view.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes]
              properties:
                nodes:
                  type: array
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/NodePosition'
      responses:
        '204':
          description: Stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /ws/ticket:
    post:
      tags: [Scene]
      summary: Mint a one-time WebSocket ticket
      description: Returns an opaque ticket bound to the caller's identity and permissions, valid for 30 seconds and for one connection. The Studio passes it as `?ticket=` when opening `GET /ws`, so a bearer token never appears in a URL.
      operationId: createWsTicket
      x-ontaix-permission: model.read
      responses:
        '201':
          description: The ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket:
                    type: string
                    maxLength: 128
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /ws:
    get:
      tags: [Scene]
      summary: Live-update WebSocket
      description: Upgrades to a WebSocket. Authentication is the one-time ticket from `POST /ws/ticket`; the bearer schemes do not apply here and a token in the query string is refused with `401`. Every message is an `Envelope` from `contracts/events.yaml`; the server delivers an event only when the caller holds its channel's `x-ontaix-visibility` permission in a scope that contains every company in the event's `companyIds`; an empty `companyIds` is tenant-wide. Pass `since` to resume; a `snapshot.required` message means the gap is too old and the client must reload `GET /scene`.
      operationId: connectWs
      x-ontaix-permission: model.read
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
        - name: since
          in: query
          description: Last applied `sequence`; on a first connection pass the `sequence` of the `GET /scene` response.
          schema:
            type: integer
            minimum: 0
      responses:
        '101':
          description: Switching protocols; the connection now carries Envelope messages.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Ticket missing, expired, already used, or a bearer token was passed in the query string.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Companies
  /companies:
    get:
      tags: [Companies]
      summary: List companies with their counters
      operationId: listCompanies
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Companies in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Companies]
      summary: Add a company
      description: 'Immediate and audited (kind `company`). Creates the nine domain products and the root cell. With `start` set to `starter_vocabulary` the thirteen starter concepts are created as proposals, awaiting approval.'
      operationId: createCompany
      x-ontaix-permission: company.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        '201':
          description: The company, its domain products, its root and the starter proposals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Get one company
      operationId: getCompany
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Companies]
      summary: Propose removing a company
      description: Creates a `change` proposal (`remove_company`). The home company cannot be removed (`409 home_company`).
      operationId: proposeRemoveCompany
      x-ontaix-permission: proposal.create
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /domain-products:
    get:
      tags: [Companies]
      summary: List domain products of every company
      operationId: listDomainProducts
      x-ontaix-permission: model.read
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Domain products with member, pending and bound counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /domain-products/{domainProductId}:
    parameters:
      - $ref: '#/components/parameters/DomainProductId'
    get:
      tags: [Companies]
      summary: Get one domain product
      operationId: getDomainProduct
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The domain product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Show or hide a domain product
      description: Visibility is a display setting, immediate and audited. Versions are server-managed and never written here.
      operationId: updateDomainProduct
      x-ontaix-permission: view.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden:
                  type: boolean
      responses:
        '200':
          description: The updated domain product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Concepts
  /concepts:
    get:
      tags: [Concepts]
      summary: List concepts (Entities page)
      operationId: listConcepts
      x-ontaix-permission: model.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of concepts. Filterable fields - `companyId`, `domainKey`, `state`, `kind`, `bound`. Sortable - `label`, `company`, `domain`, `state`, `relations`, `bornAt`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Concept'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Concepts]
      summary: Propose a new concept or specialisation
      description: Creates a `concept` or `spec` proposal. The pending cell and its birth relation are created at once and returned inside the proposal so the canvas can divide immediately. Refused with `409 duplicate_label` when the label exists in the company.
      operationId: proposeConcept
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ConceptDraft'
                - $ref: '#/components/schemas/SpecDraft'
              discriminator:
                propertyName: type
                mapping:
                  concept: '#/components/schemas/ConceptDraft'
                  spec: '#/components/schemas/SpecDraft'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /concepts/{conceptId}:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    get:
      tags: [Concepts]
      summary: Get one concept with binding and attributes
      operationId: getConcept
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The concept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concept'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Concepts]
      summary: Propose renaming a concept
      description: Creates a `change` proposal (`rename`). Uniqueness of the new label in the company is enforced (`409 duplicate_label`).
      operationId: proposeRenameConcept
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'
    delete:
      tags: [Concepts]
      summary: Propose deleting a concept and its descendants
      description: Creates a `change` proposal (`delete_concept`). Approval marks the concept and every descendant dying; the root cell cannot be deleted (`409 root_concept`).
      operationId: proposeDeleteConcept
      x-ontaix-permission: proposal.create
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /concepts/{conceptId}/lineage:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    get:
      tags: [Concepts]
      summary: Ancestry, descendants and data lineage of a concept
      operationId: getConceptLineage
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The lineage drawer content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lineage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /concepts/{conceptId}/attributes:
    parameters:
      - $ref: '#/components/parameters/ConceptId'
    get:
      tags: [Concepts]
      summary: List attributes of a concept
      operationId: listConceptAttributes
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Approved and proposed attributes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attribute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Concepts]
      summary: Propose an attribute discovered in data
      description: Creates an `attr` proposal; the attribute is stored with state `proposed`. Auto-approved when the tenant setting `autoAttrs` is on.
      operationId: proposeAttribute
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeDraft'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------- Relations
  /relations:
    get:
      tags: [Relations]
      summary: List relations (Relationships page)
      operationId: listRelations
      x-ontaix-permission: model.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of relations. Filterable - `kind`, `companyId`, `state`. Sortable - `subject`, `action`, `object`, `kind`, `state`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Relation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Relations]
      summary: Propose a relation between two concepts
      description: Creates a `relation` proposal. Action `is a` produces an `isa` relation, `equivalent to` produces a `same` relation. Refused with `409 duplicate_relation` when the triple exists and `409 cross_company_disabled` when the ends belong to different companies and the switch is off.
      operationId: proposeRelation
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationDraft'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'

  /relations/{relationId}:
    parameters:
      - $ref: '#/components/parameters/RelationId'
    get:
      tags: [Relations]
      summary: Get one relation
      operationId: getRelation
      x-ontaix-permission: model.read
      responses:
        '200':
          description: The relation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Relations]
      summary: Propose changing the action or the direction of a relation
      description: Creates a `change` proposal (`edit_relation`). Relabelling an `isa` or `same` relation is refused (`409 structural_relation`); reversing an `isa` is allowed.
      operationId: proposeEditRelation
      x-ontaix-permission: proposal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationEdit'
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Busy'
    delete:
      tags: [Relations]
      summary: Propose removing a relation
      description: Creates a `change` proposal (`remove_relation`). `clash` relations cannot be removed this way; they leave through conflict resolution.
      operationId: proposeRemoveRelation
      x-ontaix-permission: proposal.create
      responses:
        '202':
          $ref: '#/components/responses/ProposalAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'

  /equivalences:
    get:
      tags: [Relations]
      summary: List cross-company equivalences
      operationId: listEquivalences
      x-ontaix-permission: model.read
      responses:
        '200':
          description: Every `same` relation with both companies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Relations]
      summary: Propose an equivalence between two companies' concepts
      description: Creates a `relation` proposal with kind `same`. Refused with `409 cross_company_disabled` when the switch is off, and `409 same_company` when both concepts belong to one company.
      operationId: proposeEquivalence
      x-ontaix-permission: proposal.create
      requestBody:
