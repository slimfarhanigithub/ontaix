      minProperties: 1

    Relation:
      type: object
      required: [id, aId, bId, kind, label, rest, seed, pending, aLabel, bLabel, companyIds, scope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        aId:
          $ref: '#/components/schemas/Id'
        bId:
          $ref: '#/components/schemas/Id'
        aLabel:
