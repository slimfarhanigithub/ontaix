        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of proposals, open ones by default (`filter[state]=pending,half_approved`). Filterable - `state`, `type`, `companyId`, `proposerKind`. Sortable - `createdAt`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Proposal'
