  publishProposalApproved:
    action: send
    channel:
      $ref: '#/channels/proposalApproved'
  publishProposalRejected:
    action: send
    channel:
      $ref: '#/channels/proposalRejected'
  publishConceptBorn:
    action: send
    channel:
      $ref: '#/channels/conceptBorn'
  publishConceptChanged:
    action: send
