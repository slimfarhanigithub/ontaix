    messages:
      positionsChanged:
        $ref: '#/components/messages/PositionsChanged'
  studioStream:
    address: /api/v1/ws
    x-ontaix-visibility: model.read
    description: The WebSocket channel. Every message is an `Envelope` whose `type` names one of the NATS events above, or a `snapshot.required` control message.
    servers:
      - $ref: '#/servers/studio-websocket'
    messages:
      envelope:
        $ref: '#/components/messages/Envelope'
      snapshotRequired:
        $ref: '#/components/messages/SnapshotRequired'

