  companyCreated:
    address: ontaix.{tenantId}.company.created
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      companyCreated:
        $ref: '#/components/messages/CompanyCreated'
  companyRemoved:
    address: ontaix.{tenantId}.company.removed
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      companyRemoved:
        $ref: '#/components/messages/CompanyRemoved'
  extractionChanged:
    address: ontaix.{tenantId}.extraction.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: recipient
    description: Progress and end of a whole-document extraction job (ADR 0010), delivered only to the user who started the job (header `Ontaix-Recipient`), matching `GET /extractions/{extractionId}`, which answers `404` to everyone else. Administrators do not receive it either, since they cannot read the job; Cost management shows its spend through `llm_call`. The payload carries counts and states, never labels or document text; `companyIds` is the job's company.
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      extractionChanged:
        $ref: '#/components/messages/ExtractionChanged'
  settingsChanged:
    address: ontaix.{tenantId}.settings.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: tenant
    parameters:
