      bindingRemoved:
        $ref: '#/components/messages/BindingRemoved'
  attributeChanged:
    address: ontaix.{tenantId}.attribute.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
