asyncapi: 3.0.0
info:
  title: Ontaix Events
  version: 1.0.0
  description: |
    Every state change other clients or services must see is one event. Events are written to the `outbox` table in the same transaction as the change, published to NATS JetStream by the relay in outbox id order, and forwarded to Studio clients over the WebSocket `GET /api/v1/ws`.

    NATS subject pattern: `ontaix.{tenantId}.{aggregate}.{action}`. Consumers subscribe with wildcards, for example `ontaix.*.proposal.>`.

    WebSocket envelope: every message is one `Envelope`; `sequence` is the tenant-wide outbox id. A client reconnects with `?since=<sequence>`; when the gap is too old the server sends `snapshot.required` and the client reloads `GET /api/v1/scene`.

    Visibility: every channel declares `x-ontaix-visibility`, the permission (vocabulary in ADR 0003) a subscriber must hold to receive its events. Channels marked `model.read` are further limited to the companies the subscriber may read. The outbox row stores the visibility and the company so the hub filters without re-deriving it.

    Payloads carry the full new state of the affected artefacts, not a diff. Bulk operations (approve-all, finalise-all, companies-may-interact disable) set `bulk: true` so the Studio softens the flash and skips the toast.
  license:
    name: Proprietary
defaultContentType: application/json

servers:
  nats:
    host: nats.ontaix.svc.cluster.local:4222
    protocol: nats
    description: In-cluster NATS JetStream, stream `ONTAIX`, subjects `ontaix.>`.
  studio-websocket:
    host: localhost:8000
    pathname: /api/v1/ws
    protocol: ws
    description: Studio live-update channel. Authentication is a one-time ticket minted by `POST /api/v1/ws/ticket` and passed as the `ticket` query parameter; a bearer token is never accepted in the URL. The `since` query parameter resumes from a sequence.

