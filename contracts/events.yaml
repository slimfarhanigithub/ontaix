components:
  parameters:
    tenantId:
      description: Tenant UUID.

  messages:
    Envelope:
      name: Envelope
      title: WebSocket envelope
      summary: One event as delivered to the Studio.
      payload:
        $ref: '#/components/schemas/Envelope'
    SnapshotRequired:
      name: SnapshotRequired
      title: Snapshot required
      summary: The resume gap is too old; reload the scene.
      payload:
        type: object
        required: [type, sequence]
        properties:
          type:
            type: string
            const: snapshot.required
          sequence:
            type: integer
            description: The current sequence to pass as `since` after reloading.
    ProposalCreated:
      name: ProposalCreated
      title: proposal.created
      summary: A proposal was created; its pending artefacts exist.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalHalfApproved:
      name: ProposalHalfApproved
      title: proposal.half_approved
      summary: First of two approvals given on a change.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalApproved:
      name: ProposalApproved
      title: proposal.approved
      summary: A proposal was approved and applied; the domain revision may have moved.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalRejected:
      name: ProposalRejected
      title: proposal.rejected
      summary: A proposal was rejected; `cascaded` lists proposals rejected with it.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalFinalised:
      name: ProposalFinalised
      title: proposal.finalised
      summary: Finalise-all or approve-all completed; summary counts for the caption.
      payload:
        type: object
        required: [approved, rejected, rounds, remaining, companies, concepts, bound, equivalences]
        properties:
          approved:
            type: integer
          rejected:
            type: integer
          rounds:
            type: integer
          remaining:
            type: integer
          companies:
            type: integer
          concepts:
            type: integer
          bound:
            type: integer
          equivalences:
            type: integer
          caption:
            type: string
    ConceptBorn:
      name: ConceptBorn
      title: concept.born
      summary: A pending cell was born by division from its parent; the client animates the division.
      payload:
        type: object
        required: [concept, birthRelation]
        properties:
          concept:
            $ref: '#/components/schemas/Concept'
          birthRelation:
            oneOf:
              - $ref: '#/components/schemas/Relation'
              - type: 'null'
          proposalId:
            type: string
            format: uuid
    ConceptChanged:
      name: ConceptChanged
      title: concept.changed
      summary: Label, sub, pending, colour, rule or conflict flag of a concept changed.
      payload:
        type: object
        required: [concept, fields]
        properties:
          concept:
            $ref: '#/components/schemas/Concept'
          fields:
            type: array
            items:
              type: string
          proposalId:
            type: string
            format: uuid
    ConceptDying:
      name: ConceptDying
      title: concept.dying
      summary: A concept and its descendants are being removed; the client fades them red over 0.7 s.
      payload:
        type: object
        required: [conceptIds, relationIds, bindingIds]
        properties:
          conceptIds:
            type: array
            items:
              type: string
              format: uuid
          relationIds:
            type: array
            items:
              type: string
              format: uuid
          bindingIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    ConceptConflict:
      name: ConceptConflict
      title: concept.conflict
      summary: Two approved definitions share one name; both cells are flagged and a clash relation exists.
      payload:
        type: object
        required: [concepts, clash, caption]
        properties:
          concepts:
            type: array
            minItems: 2
            maxItems: 2
            items:
              $ref: '#/components/schemas/Concept'
          clash:
            $ref: '#/components/schemas/Relation'
          caption:
            type: string
    RelationCreated:
      name: RelationCreated
      title: relation.created
      summary: A relation exists (pending unless it is a clash).
      payload:
        type: object
        required: [relation]
        properties:
          relation:
            $ref: '#/components/schemas/Relation'
          proposalId:
            type: string
            format: uuid
    RelationChanged:
      name: RelationChanged
      title: relation.changed
      summary: Pending cleared, label rewritten or direction swapped.
      payload:
        type: object
        required: [relation, fields]
        properties:
          relation:
            $ref: '#/components/schemas/Relation'
          fields:
            type: array
            items:
              type: string
          proposalId:
            type: string
            format: uuid
    RelationRemoved:
      name: RelationRemoved
      title: relation.removed
      summary: A relation is leaving; `dying` says whether to fade (0.7 s) or splice at once.
      payload:
        type: object
        required: [relationId, dying]
        properties:
          relationId:
            type: string
            format: uuid
          dying:
            type: boolean
          proposalId:
            type: string
            format: uuid
    SourceCreated:
      name: SourceCreated
      title: source.created
      summary: A pending source appears outside the domain ring.
      payload:
        type: object
        required: [source]
        properties:
          source:
            $ref: '#/components/schemas/Source'
          proposalId:
            type: string
            format: uuid
    SourceChanged:
      name: SourceChanged
      title: source.changed
      summary: Pending cleared, enabled or disabled, or reconfigured.
      payload:
        type: object
        required: [source, fields]
        properties:
          source:
            $ref: '#/components/schemas/Source'
          fields:
            type: array
            items:
              type: string
    SourceRemoved:
      name: SourceRemoved
      title: source.removed
      summary: A source and its bindings are removed.
      payload:
        type: object
        required: [sourceId, bindingIds]
        properties:
          sourceId:
            type: string
            format: uuid
          bindingIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    SourcesRefreshed:
      name: SourcesRefreshed
      title: source.refreshed
      summary: Refresh-all completed; freshness of listed bindings is `just now`.
      payload:
        type: object
        required: [bindings]
        properties:
          bindings:
            type: array
            items:
              $ref: '#/components/schemas/Binding'
    BindingCreated:
      name: BindingCreated
      title: binding.created
      summary: A pending bind link from a source to a concept.
      payload:
        type: object
        required: [binding]
        properties:
          binding:
            $ref: '#/components/schemas/Binding'
          proposalId:
            type: string
            format: uuid
    BindingChanged:
      name: BindingChanged
      title: binding.changed
      summary: Pending cleared with records and freshness set, or freshness changed.
      payload:
        type: object
        required: [binding, attributes]
        properties:
          binding:
            $ref: '#/components/schemas/Binding'
          attributes:
            type: array
            description: Attributes written as approved on binding approval.
            items:
              $ref: '#/components/schemas/Attribute'
          proposalId:
            type: string
            format: uuid
    BindingRemoved:
      name: BindingRemoved
      title: binding.removed
      summary: A binding was removed (unbind, source removal or rejection); attributes stay.
      payload:
        type: object
        required: [bindingId, conceptId]
        properties:
          bindingId:
            type: string
            format: uuid
          conceptId:
            type: string
            format: uuid
          proposalId:
            type: string
            format: uuid
    AttributeChanged:
      name: AttributeChanged
      title: attribute.changed
      summary: An attribute was proposed, approved or removed.
      payload:
        type: object
        required: [conceptId, attribute, removed]
        properties:
          conceptId:
            type: string
            format: uuid
          attribute:
            $ref: '#/components/schemas/Attribute'
          removed:
            type: boolean
          proposalId:
            type: string
            format: uuid
    DomainProductChanged:
      name: DomainProductChanged
      title: domain_product.changed
      summary: Revision incremented or visibility changed.
      payload:
        type: object
        required: [domainProduct, fields]
        properties:
          domainProduct:
            $ref: '#/components/schemas/DomainProduct'
          fields:
            type: array
            items:
              type: string
    CompanyCreated:
      name: CompanyCreated
      title: company.created
      summary: A company with its nine domain products and root cell was added.
      payload:
        type: object
        required: [company, root]
        properties:
          company:
            $ref: '#/components/schemas/Company'
          root:
            $ref: '#/components/schemas/Concept'
    CompanyRemoved:
      name: CompanyRemoved
      title: company.removed
      summary: A company is leaving; every cell of it is dying.
      payload:
        type: object
        required: [companyId, conceptIds, sourceIds]
        properties:
          companyId:
            type: string
            format: uuid
          conceptIds:
            type: array
            items:
              type: string
              format: uuid
          sourceIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    SettingsChanged:
      name: SettingsChanged
      title: settings.changed
      summary: One or more tenant settings changed.
      payload:
        type: object
        required: [settings, changed]
        properties:
          settings:
            type: object
            additionalProperties: true
          changed:
            type: array
            items:
              type: string
    AppearanceChanged:
      name: AppearanceChanged
      title: appearance.changed
      summary: Theme, domain colours, accent or source colour changed.
      payload:
        type: object
        required: [appearance, changed]
        properties:
          appearance:
            type: object
            additionalProperties: true
          changed:
            type: array
            items:
              type: string
    CrossCompanyDisabled:
      name: CrossCompanyDisabled
      title: settings.cross_company_disabled
      summary: Companies may no longer interact; the listed relations are dying and the listed proposals rejected.
      payload:
        type: object
        required: [removedRelationIds, rejectedProposalIds, proposalId]
        properties:
          removedRelationIds:
            type: array
            items:
              type: string
              format: uuid
          rejectedProposalIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    GroupChanged:
      name: GroupChanged
      title: group.changed
      summary: A group was created, edited, deleted, or its members or roles changed.
      payload:
        type: object
        required: [groupId, change]
        properties:
          groupId:
            type: string
            format: uuid
          change:
            type: string
            enum: [created, updated, deleted, members, roles]
          group:
            type: object
            additionalProperties: true
    AgentChanged:
      name: AgentChanged
      title: agent.changed
      summary: An agent's access flag changed.
      payload:
        type: object
        required: [agentId, access]
        properties:
          agentId:
            type: string
            format: uuid
          access:
            type: boolean
    AuditAppended:
      name: AuditAppended
      title: audit.appended
      summary: A row was appended to the audit log.
      payload:
        $ref: '#/components/schemas/AuditEntry'
    ViewStateChanged:
      name: ViewStateChanged
      title: view_state.changed
      summary: Coverage flag or scene index changed.
      payload:
        type: object
        required: [coverage, sceneIdx]
        properties:
          coverage:
            type: boolean
          sceneIdx:
            type: integer
    PositionsChanged:
      name: PositionsChanged
      title: positions.changed
      summary: Stored positions changed after a drag or an Arrange.
      payload:
        type: object
        required: [nodes]
        properties:
          nodes:
            type: array
            items:
              type: object
              required: [id, kind, x, y, pinned]
              properties:
                id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum: [concept, source]
                x:
                  type: number
                y:
                  type: number
                pinned:
                  type: boolean
    DemoScenePlayed:
      name: DemoScenePlayed
      title: demo.scene_played
      summary: A story scene was played; its proposals were created.
      payload:
        type: object
        required: [sceneIdx, name, proposalIds]
        properties:
          sceneIdx:
            type: integer
          name:
            type: string
          proposalIds:
            type: array
            items:
              type: string
              format: uuid

  schemas:
    Envelope:
      type: object
      required: [id, type, occurredAt, tenantId, sequence, actor, bulk, payload]
      properties:
        id:
          type: string
          format: uuid
          description: Event id from the outbox row; clients de-duplicate on it.
        type:
          type: string
          description: '`<aggregate>.<action>`, for example `proposal.approved`.'
          enum:
            - proposal.created
            - proposal.half_approved
            - proposal.approved
            - proposal.rejected
            - proposal.finalised
            - concept.born
            - concept.changed
            - concept.dying
            - concept.conflict
            - relation.created
            - relation.changed
            - relation.removed
            - source.created
            - source.changed
            - source.removed
            - source.refreshed
            - binding.created
            - binding.changed
            - binding.removed
            - attribute.changed
            - domain_product.changed
            - company.created
            - company.removed
            - settings.changed
            - appearance.changed
            - settings.cross_company_disabled
            - group.changed
            - agent.changed
            - audit.appended
            - view_state.changed
            - positions.changed
            - demo.scene_played
        occurredAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Tenant-wide outbox id; strictly increasing.
        actor:
          $ref: '#/components/schemas/Actor'
        bulk:
          type: boolean
        payload:
          type: object
          additionalProperties: true

    Actor:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [user, agent, system]
        id:
          type: string
          format: uuid
        name:
          type: string

    ProposalEvent:
      type: object
      required: [proposal, artefacts, cascaded]
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        artefacts:
          type: object
          description: Current state of everything the proposal created or changed.
          properties:
            concepts:
              type: array
              items:
                $ref: '#/components/schemas/Concept'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/Binding'
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/Attribute'
            domainProducts:
              type: array
              items:
                $ref: '#/components/schemas/DomainProduct'
        cascaded:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
        caption:
          type: string

    Proposal:
      type: object
      description: Same shape as `Proposal` in contracts/openapi.yaml.
      required: [id, type, state, title, color, html, ready]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [concept, spec, relation, source, bind, attr, change]
        changeKind:
          type: [string, 'null']
        state:
          type: string
          enum: [pending, half_approved, approved, rejected]
        title:
          type: string
        heading:
          type: string
        color:
          type: string
        companyId:
          type: [string, 'null']
        domainProductId:
          type: [string, 'null']
        parentLabel:
          type: [string, 'null']
        deps:
          type: array
          items:
            type: string
        ready:
          type: boolean
        waitFor:
          type: [string, 'null']
        html:
          type: string
          description: Server-generated; every interpolated label is HTML-escaped and only `<b>`, `<i>` and `<span class="...">` may appear. Rendered by the Studio with those tags allow-listed.
        why:
          type: [string, 'null']
        caption:
          type: [string, 'null']
        conceptId:
          type: [string, 'null']
        relationId:
          type: [string, 'null']
        relationIds:
          type: array
          items:
            type: string
        sourceId:
          type: [string, 'null']
        bindingIds:
          type: array
          items:
            type: string
        attributeId:
          type: [string, 'null']
        proposer:
          $ref: '#/components/schemas/Actor'
        approvals:
          type: array
          items:
            type: object
            properties:
              ordinal:
                type: integer
              userId:
                type: string
              userName:
                type: string
              approvedAt:
                type: string
                format: date-time
        bulk:
          type: boolean
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']

    Concept:
      type: object
      description: Same shape as `Concept` in contracts/openapi.yaml.
      required: [id, companyId, kind, label, sub, pending, conflict, bornAt, x, y, pinned]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [root, concept]
        label:
          type: string
        sub:
          type: string
        domainProductId:
          type: [string, 'null']
        domainKey:
          type: [string, 'null']
        color:
          type: string
        rule:
          type: [string, 'null']
        pending:
          type: boolean
        conflict:
          type: boolean
        parentId:
          type: [string, 'null']
        birthRelationId:
          type: [string, 'null']
        bornAt:
          type: string
          format: date-time
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
        bound:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'

    Relation:
      type: object
      description: Same shape as `Relation` in contracts/openapi.yaml.
      required: [id, aId, bId, kind, label, rest, seed, pending]
      properties:
        id:
          type: string
          format: uuid
        aId:
          type: string
          format: uuid
        bId:
          type: string
          format: uuid
        aLabel:
          type: string
        bLabel:
          type: string
        kind:
          type: string
          enum: [rel, isa, same, clash]
        label:
          type: string
        rest:
          type: number
        seed:
          type: number
        pending:
          type: boolean
        dyingAt:
          type: [string, 'null']
        companyIds:
          type: array
          items:
            type: string
            format: uuid

    Source:
      type: object
      description: Same shape as `Source` in contracts/openapi.yaml.
      required: [id, kind, companyId, label, kindText, anchorIndex, disabled, pending, x, y, pinned]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: source
        companyId:
          type: string
          format: uuid
        label:
          type: string
        kindText:
          type: string
        connectorCode:
          type: [string, 'null']
        host:
          type: [string, 'null']
        scope:
          type: [string, 'null']
        auth:
          type: [string, 'null']
        refresh:
          type: string
        anchorIndex:
          type: integer
        disabled:
          type: boolean
        pending:
          type: boolean
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
        feeds:
          type: integer
        records:
          type: [integer, 'null']
        state:
          type: string

    Binding:
      type: object
      description: Same shape as `Binding` in contracts/openapi.yaml.
      required: [id, kind, sourceId, sourceLabel, conceptId, records, fresh, pending]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: bind
        seed:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        conceptId:
          type: string
          format: uuid
        records:
          type: integer
        fresh:
          type: string
        pending:
          type: boolean

    Attribute:
      type: object
      description: Same shape as `Attribute` in contracts/openapi.yaml.
      required: [id, conceptId, name, type, col, fill, state]
      properties:
        id:
          type: string
          format: uuid
        conceptId:
          type: string
          format: uuid
        sourceId:
          type: [string, 'null']
        name:
          type: string
        type:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: string
        fill:
          type: integer
        state:
          type: string
          enum: [proposed, approved]

    DomainProduct:
      type: object
      description: Same shape as `DomainProduct` in contracts/openapi.yaml.
      required: [id, companyId, key, name, owner, color, revision, version, hidden]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        owner:
          type: string
        color:
          type: string
        revision:
          type: integer
        version:
          type: string
        hidden:
          type: boolean

    Company:
      type: object
      description: Same shape as `Company` in contracts/openapi.yaml.
      required: [id, key, name, sub, position, isHome, rootId, domainProducts]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        sub:
          type: string
        position:
          type: integer
        isHome:
          type: boolean
        rootId:
          type: string
          format: uuid
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'

    AuditEntry:
      type: object
      description: Same shape as `AuditEntry` in contracts/openapi.yaml.
      required: [id, at, actor, kind, what, ok]
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        kind:
          type: string
        what:
          type: string
        ok:
          type: boolean
        proposalId:
          type: [string, 'null']
