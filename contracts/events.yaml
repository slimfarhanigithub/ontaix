asyncapi: 3.0.0
info:
  title: Ontaix Events
  version: 1.0.0
  description: |
    Every state change other clients or services must see is one event. Events are written to the `outbox` table in the same transaction as the change, published to NATS JetStream by the relay in outbox id order, and forwarded to Studio clients over the WebSocket `GET /api/v1/ws`.

    NATS subject pattern: `ontaix.{tenantId}.{aggregate}.{action}`. Consumers subscribe with wildcards, for example `ontaix.*.proposal.>`.

    WebSocket envelope: every message is one `Envelope`; `sequence` is the tenant-wide outbox id. A client reconnects with `?since=<sequence>`; when the gap is too old the server sends `snapshot.required` and the client reloads `GET /api/v1/scene`.

    Visibility: every channel declares `x-ontaix-visibility`, the permission (vocabulary in ADR 0003) a subscriber must hold to receive its events, and `x-ontaix-audience`, how the event's `companyIds` is filled. `companyIds` lists every company whose labels, names or artefact state the payload carries; bare ids do not count. An empty list means tenant-wide. A subscriber receives an event only if it holds the visibility permission in a scope that contains every listed company; with an empty list, the permission at any scope suffices. A cross-company event therefore reaches only readers of all its companies.

    Audience values: `companies` - the writer fills `companyIds` from the artefacts in the payload; `tenant` - `companyIds` is always empty and the payload carries no company-specific labels; `recipient` - the event goes to one user only, named by `outbox.recipient_user_id` and the header `Ontaix-Recipient`, who must also hold the visibility permission for every listed company. On a `companies` channel an event never mixes artefacts with different company sets: the writer partitions the artefacts by company set and emits one event per partition (for example `source.refreshed` per company, and a cascaded proposal whose companies are not all in the rejected proposal's set gets its own `proposal.rejected`), so a one-company reader never loses an event about something it can read.

    Transport: the outbox row stores `visibility`, `company_ids`, for `audit.appended` only `domain_key`, and for extraction events only `recipient_user_id`; the relay copies them into the NATS headers `Ontaix-Visibility`, `Ontaix-Company-Ids`, `Ontaix-Domain-Key` and `Ontaix-Recipient` (trait `Audience`), and the WebSocket hub and the `?since=` replay filter on them without re-deriving them and forward `companyIds` in the `Envelope`. The hub, the `?since=` replay (which reads outbox rows by tenant sequence) and every other consumer deliver a `recipient` event (today `extraction.changed`) only to that user, after the visibility and company checks. A hub or consumer that meets `Ontaix-Recipient` and does not implement it drops the event: the filter fails closed.

    Payloads carry the full new state of the affected artefacts, not a diff. Bulk operations (approve-all, companies-may-interact disable) set `bulk: true` so the Studio softens the flash and skips the toast.
  license:
    name: Proprietary
defaultContentType: application/json

servers:
  nats:
    host: nats.ontaix.svc.cluster.local:4222
    protocol: nats
    description: In-cluster NATS JetStream, stream `ONTAIX`, subjects `ontaix.>`.
  studio-websocket:
    host: localhost:8000
    pathname: /api/v1/ws
    protocol: ws
    description: Studio live-update channel. Authentication is a one-time ticket minted by `POST /api/v1/ws/ticket` and passed as the `ticket` query parameter; a bearer token is never accepted in the URL. The `since` query parameter resumes from a sequence. A ticket is bound to the session that minted it (ADR 0017); the hub re-resolves that session at least every 60 seconds and before each delivery batch, and closes the socket with code 4401 once the session has ended, expired, or lost its account or organization, so a signed-out, reset, disabled or support-ended session stops receiving events.

channels:
  proposalCreated:
    address: ontaix.{tenantId}.proposal.created
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      proposalCreated:
        $ref: '#/components/messages/ProposalCreated'
  proposalChanged:
    address: ontaix.{tenantId}.proposal.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    description: A pending proposal's draft was edited in place (ADR 0015); the payload is the proposal at its new `revision`. Clients replace the panel item and treat an approval they prepared for an older revision as stale.
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      proposalChanged:
        $ref: '#/components/messages/ProposalChanged'
  domainChanged:
    address: ontaix.{tenantId}.domain.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: tenant
    description: A tenant domain was created, renamed, recoloured or had its owner changed through an approved proposal (ADR 0015). Tenant-wide, since a domain is the same in every company; the payload carries the domain definition only, no company data.
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      domainChanged:
        $ref: '#/components/messages/DomainChanged'
  proposalHalfApproved:
    address: ontaix.{tenantId}.proposal.half_approved
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
