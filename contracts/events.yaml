components:
  parameters:
    tenantId:
      description: Tenant UUID.

  messages:
    Envelope:
      name: Envelope
      title: WebSocket envelope
      summary: One event as delivered to the Studio.
      payload:
        $ref: '#/components/schemas/Envelope'
    SnapshotRequired:
      name: SnapshotRequired
      title: Snapshot required
      summary: The resume gap is too old; reload the scene.
      payload:
        type: object
        required: [type, sequence]
        properties:
          type:
            type: string
            const: snapshot.required
          sequence:
            type: integer
            description: The current sequence to pass as `since` after reloading.
    ProposalCreated:
      name: ProposalCreated
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: proposal.created
      summary: A proposal was created; its pending artefacts exist.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalChanged:
      name: ProposalChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: proposal.changed
      summary: A pending proposal's draft was edited in place.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    DomainChanged:
      name: DomainChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: domain.changed
      summary: A tenant domain was created or edited.
      payload:
        type: object
        required: [domain, created]
        properties:
          created:
            type: boolean
          domain:
            type: object
            description: Same shape as `TenantDomain` in contracts/openapi.yaml.
            required: [key, name, owner, color, defaultColor, template, position, revision]
            properties:
              key:
                type: string
                pattern: '^[a-z][a-z0-9_]{1,39}$'
              name:
                type: string
              owner:
                type: string
              color:
                type: string
              defaultColor:
                type: string
              template:
                type: boolean
              position:
                type: integer
              revision:
                type: integer
    ProposalHalfApproved:
      name: ProposalHalfApproved
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: proposal.half_approved
      summary: First of two approvals given on a change.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalApproved:
      name: ProposalApproved
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: proposal.approved
      summary: A proposal was approved and applied; the domain revision may have moved.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ProposalRejected:
      name: ProposalRejected
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: proposal.rejected
      summary: A proposal was rejected; `cascaded` lists proposals rejected with it whose companies are all in this event's `companyIds`. Every other cascaded proposal is announced by its own `proposal.rejected` event with its own audience.
      payload:
        $ref: '#/components/schemas/ProposalEvent'
    ConceptBorn:
      name: ConceptBorn
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: concept.born
      summary: A pending cell was born by division from its parent; the client animates the division.
      payload:
        type: object
        required: [concept, birthRelation]
        properties:
          concept:
            $ref: '#/components/schemas/Concept'
          birthRelation:
            oneOf:
              - $ref: '#/components/schemas/Relation'
              - type: 'null'
          proposalId:
            type: string
            format: uuid
    ConceptChanged:
      name: ConceptChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: concept.changed
      summary: Label, sub, pending, colour, rule or conflict flag of a concept changed.
      payload:
        type: object
        required: [concept, fields]
        properties:
          concept:
            $ref: '#/components/schemas/Concept'
          fields:
            type: array
            items:
              type: string
          proposalId:
            type: string
            format: uuid
    ConceptDying:
      name: ConceptDying
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: concept.dying
      summary: A concept and its descendants are being removed; the client fades them red over 0.7 s.
      payload:
        type: object
        required: [conceptIds, relationIds, bindingIds]
        properties:
          conceptIds:
            type: array
            items:
              type: string
              format: uuid
          relationIds:
            type: array
            items:
              type: string
              format: uuid
          bindingIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    ConceptConflict:
      name: ConceptConflict
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: concept.conflict
      summary: Two approved definitions share one name; both cells are flagged and a clash relation exists.
      payload:
        type: object
        required: [concepts, clash, caption]
        properties:
          concepts:
            type: array
            minItems: 2
            maxItems: 2
            items:
              $ref: '#/components/schemas/Concept'
          clash:
            $ref: '#/components/schemas/Relation'
          caption:
            type: string
    RelationCreated:
      name: RelationCreated
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: relation.created
      summary: A relation exists (pending unless it is a clash).
      payload:
        type: object
        required: [relation]
        properties:
          relation:
            $ref: '#/components/schemas/Relation'
          proposalId:
            type: string
            format: uuid
    RelationChanged:
      name: RelationChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: relation.changed
      summary: Pending cleared, label rewritten or direction swapped.
      payload:
        type: object
        required: [relation, fields]
        properties:
          relation:
            $ref: '#/components/schemas/Relation'
          fields:
            type: array
            items:
              type: string
          proposalId:
            type: string
            format: uuid
    RelationRemoved:
      name: RelationRemoved
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: relation.removed
      summary: A relation is leaving; `dying` says whether to fade (0.7 s) or splice at once.
      payload:
        type: object
        required: [relationId, dying]
        properties:
          relationId:
            type: string
            format: uuid
          dying:
            type: boolean
          proposalId:
            type: string
            format: uuid
    SourceCreated:
      name: SourceCreated
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: source.created
      summary: A pending source appears outside the domain ring.
      payload:
        type: object
        required: [source]
        properties:
          source:
            $ref: '#/components/schemas/Source'
          proposalId:
            type: string
            format: uuid
    SourceChanged:
      name: SourceChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: source.changed
      summary: Pending cleared, enabled or disabled, or reconfigured.
      payload:
        type: object
        required: [source, fields]
        properties:
          source:
            $ref: '#/components/schemas/Source'
          fields:
            type: array
            items:
              type: string
    SourceRemoved:
      name: SourceRemoved
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: source.removed
      summary: A source and its bindings are removed.
      payload:
        type: object
        required: [sourceId, bindingIds]
        properties:
          sourceId:
            type: string
            format: uuid
          bindingIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    SourcesRefreshed:
      name: SourcesRefreshed
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: source.refreshed
      summary: Refresh-all completed; freshness of listed bindings is `just now`. One event per company, listing that company's bindings only.
      payload:
        type: object
        required: [bindings]
        properties:
          bindings:
            type: array
            items:
              $ref: '#/components/schemas/Binding'
    BindingCreated:
      name: BindingCreated
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: binding.created
      summary: A pending bind link from a source to a concept.
      payload:
        type: object
        required: [binding]
        properties:
          binding:
            $ref: '#/components/schemas/Binding'
          proposalId:
            type: string
            format: uuid
    BindingChanged:
      name: BindingChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: binding.changed
      summary: Pending cleared with records and freshness set, or freshness changed.
      payload:
        type: object
        required: [binding, attributes]
        properties:
          binding:
            $ref: '#/components/schemas/Binding'
          attributes:
            type: array
            description: Attributes written as approved on binding approval.
            items:
              $ref: '#/components/schemas/Attribute'
          proposalId:
            type: string
            format: uuid
    BindingRemoved:
      name: BindingRemoved
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: binding.removed
      summary: A binding was removed (unbind, source removal or rejection); attributes stay.
      payload:
        type: object
        required: [bindingId, conceptId]
        properties:
          bindingId:
            type: string
            format: uuid
          conceptId:
            type: string
            format: uuid
          proposalId:
            type: string
            format: uuid
    AttributeChanged:
      name: AttributeChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: attribute.changed
      summary: An attribute was proposed, approved or removed.
      payload:
        type: object
        required: [conceptId, attribute, removed]
        properties:
          conceptId:
            type: string
            format: uuid
          attribute:
            $ref: '#/components/schemas/Attribute'
          removed:
            type: boolean
          proposalId:
            type: string
            format: uuid
    DomainProductChanged:
      name: DomainProductChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: domain_product.changed
      summary: Revision incremented or visibility changed.
      payload:
        type: object
        required: [domainProduct, fields]
        properties:
          domainProduct:
            $ref: '#/components/schemas/DomainProduct'
          fields:
            type: array
            items:
              type: string
    CompanyCreated:
      name: CompanyCreated
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: company.created
      summary: A company with its nine domain products and root cell was added.
      payload:
        type: object
        required: [company, root]
        properties:
          company:
            $ref: '#/components/schemas/Company'
          root:
            $ref: '#/components/schemas/Concept'
    CompanyRemoved:
      name: CompanyRemoved
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: company.removed
      summary: A company is leaving; every cell of it is dying.
      payload:
        type: object
        required: [companyId, conceptIds, sourceIds]
        properties:
          companyId:
            type: string
            format: uuid
          conceptIds:
            type: array
            items:
              type: string
              format: uuid
          sourceIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    ExtractionChanged:
      name: ExtractionChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: extraction.changed
      summary: A whole-document extraction job was queued, progressed by one chunk, or ended.
      payload:
        type: object
        required: [extraction]
        properties:
          extraction:
            description: Same shape as `DocumentExtraction` in contracts/openapi.yaml - ids, state, phase, chunk counts, outline node count, tokens used, ceilings, draft count, degraded, failure reason and timestamps; no label and no document text.
            type: object
            required: [id, companyId, state, phase, chunks, outlineChunksDone, sectionChunksDone, degraded, failureReason]
            properties:
              id:
                type: string
                format: uuid
              importId:
                type: [string, 'null']
                format: uuid
              companyId:
                type: string
                format: uuid
              state:
                type: string
                enum: [queued, running, succeeded, failed, cancelled]
              phase:
                type: [string, 'null']
                enum: [outline, sections, mapping, null]
              chunks:
                type: integer
              outlineChunksDone:
                type: integer
              sectionChunksDone:
                type: integer
              outlineNodes:
                type: integer
              tokensUsed:
                type: integer
              draftCount:
                type: integer
              degraded:
                type: boolean
              failureReason:
                type: [string, 'null']
                enum: [not_configured, budget_exhausted, rate_limited, job_timeout, no_drafts, import_expired, too_many_attempts, internal, null]
    SettingsChanged:
      name: SettingsChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: settings.changed
      summary: One or more tenant settings changed.
      description: '`settings` is the full `Settings` of `contracts/openapi.yaml`, including the read-only `companyMode`. A super admin''s company mode change (ADR 0017) emits this event to the organization with actor kind `platform` and `changed` naming `companyMode`, plus `multiCompany` when single mode turned it off.'
      payload:
        type: object
        required: [settings, changed]
        properties:
          settings:
            type: object
            additionalProperties: true
          changed:
            type: array
            items:
              type: string
    AppearanceChanged:
      name: AppearanceChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: appearance.changed
      summary: Theme, domain colours, accent or source colour changed.
      payload:
        type: object
        required: [appearance, changed]
        properties:
          appearance:
            type: object
            additionalProperties: true
          changed:
            type: array
            items:
              type: string
    CrossCompanyDisabled:
      name: CrossCompanyDisabled
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: settings.cross_company_disabled
      summary: Companies may no longer interact; the listed relations are dying and the listed proposals rejected. Tenant-wide audience because the payload carries ids only; the relation and proposal states are announced by `relation.removed` and `proposal.rejected` events with their own audience.
      payload:
        type: object
        required: [removedRelationIds, rejectedProposalIds, proposalId]
        properties:
          removedRelationIds:
            type: array
            items:
              type: string
              format: uuid
          rejectedProposalIds:
            type: array
            items:
              type: string
              format: uuid
          proposalId:
            type: string
            format: uuid
    GroupChanged:
      name: GroupChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: group.changed
      summary: A group was created, edited, deleted, or its members or roles changed.
      payload:
        type: object
        required: [groupId, change]
        properties:
          groupId:
            type: string
            format: uuid
          change:
            type: string
            enum: [created, updated, deleted, members, roles]
          group:
            type: object
            additionalProperties: true
    AgentChanged:
      name: AgentChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: agent.changed
      summary: An agent's access flag changed.
      payload:
        type: object
        required: [agentId, access]
        properties:
          agentId:
            type: string
            format: uuid
          access:
            type: boolean
    AuditAppended:
      name: AuditAppended
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: audit.appended
      summary: A row was appended to the audit log. The event's `companyIds` equals the entry's `companyIds`, and its `Ontaix-Domain-Key` header equals the entry's `domainKey` when set.
      payload:
        $ref: '#/components/schemas/AuditEntry'
    ViewStateChanged:
      name: ViewStateChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: view_state.changed
      summary: Coverage flag changed.
      payload:
        type: object
        required: [coverage]
        properties:
          coverage:
            type: boolean
    PositionsChanged:
      name: PositionsChanged
      traits:
        - $ref: '#/components/messageTraits/Audience'
      title: positions.changed
      summary: Stored positions changed after a drag or an Arrange.
      payload:
        type: object
        required: [nodes]
        properties:
          nodes:
            type: array
            items:
              type: object
              required: [id, kind, x, y, pinned]
              properties:
                id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum: [concept, source]
                x:
                  type: number
                y:
                  type: number
                pinned:
                  type: boolean
  messageTraits:
    Audience:
      headers:
        type: object
        required: [Ontaix-Visibility, Ontaix-Company-Ids]
        properties:
          Ontaix-Visibility:
            type: string
            enum: [model.read, audit.read, group.manage, agent.manage]
            description: The channel's `x-ontaix-visibility`, copied from `outbox.visibility`.
          Ontaix-Company-Ids:
            type: string
            description: Comma-separated company uuids copied from `outbox.company_ids`; an empty string means tenant-wide. A subscriber receives the event only if it holds `Ontaix-Visibility` in a scope containing every listed company, or on the domain scope named by `Ontaix-Domain-Key`.
          Ontaix-Domain-Key:
            type: string
            description: Present only on `audit.appended` events whose entry has a `domainKey`, copied from `outbox.domain_key`. A subscriber holding `audit.read` on the domain scope with this key also receives the event.
          Ontaix-Recipient:
            type: string
            format: uuid
            description: Present only on channels whose `x-ontaix-audience` is `recipient` (today `extraction.changed`), copied from `outbox.recipient_user_id`. The event is delivered to that user only, and only while the user still holds `Ontaix-Visibility` in a scope containing every listed company; no other subscriber receives it.

  schemas:
    Envelope:
      type: object
      required: [id, type, occurredAt, tenantId, companyIds, sequence, actor, bulk, payload]
      properties:
        id:
          type: string
          format: uuid
          description: Event id from the outbox row; clients de-duplicate on it.
        type:
          type: string
          description: '`<aggregate>.<action>`, for example `proposal.approved`.'
          enum:
            - proposal.created
            - proposal.changed
            - domain.changed
            - proposal.half_approved
            - proposal.approved
            - proposal.rejected
            - concept.born
            - concept.changed
            - concept.dying
            - concept.conflict
            - relation.created
            - relation.changed
            - relation.removed
            - source.created
            - source.changed
            - source.removed
            - source.refreshed
            - binding.created
            - binding.changed
            - binding.removed
            - attribute.changed
            - domain_product.changed
            - company.created
            - company.removed
            - extraction.changed
            - settings.changed
            - appearance.changed
            - settings.cross_company_disabled
            - group.changed
            - agent.changed
            - audit.appended
            - view_state.changed
            - positions.changed
        occurredAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid
        companyIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: The event's audience, copied from `outbox.company_ids` - every company whose labels, names or artefact state the payload carries; empty means tenant-wide. The hub delivers the event only to a subscriber holding the channel's `x-ontaix-visibility` in a scope that contains every listed company.
        sequence:
          type: integer
          description: Tenant-wide outbox id; strictly increasing. A subscriber sees gaps where events were filtered out for it; a gap alone never means events were lost.
        actor:
          $ref: '#/components/schemas/Actor'
        bulk:
          type: boolean
        payload:
          type: object
          additionalProperties: true

    Actor:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [user, agent, system, platform]
          description: '`platform` - a super admin acting on the organization (ADR 0017); `id` is the platform account.'
        id:
          type: string
          format: uuid
        name:
          type: string

    ProposalEvent:
      type: object
      required: [proposal, artefacts, cascaded]
      properties:
        proposal:
          $ref: '#/components/schemas/Proposal'
        artefacts:
          type: object
          description: Current state of everything the proposal created or changed.
          properties:
            concepts:
              type: array
              items:
                $ref: '#/components/schemas/Concept'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/Relation'
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
            bindings:
              type: array
              items:
                $ref: '#/components/schemas/Binding'
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/Attribute'
            domainProducts:
              type: array
              items:
                $ref: '#/components/schemas/DomainProduct'
        cascaded:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
        caption:
          type: string

    Proposal:
      type: object
      description: Same shape as `Proposal` in contracts/openapi.yaml.
      required: [id, type, state, title, color, html, ready, origin, originDetail]
      properties:
        origin:
          type: string
          enum: [text, speech, document, suggestion, ontology_import]
          description: Same meaning as `Origin` in contracts/openapi.yaml. `document`, `suggestion` and `ontology_import` are set by the server only; `suggestion` marks a concept or relation a language model suggested through concept expansion (ADR 0009) and a user selected; `ontology_import` marks one mapped from an uploaded ontology or hierarchy file (ADR 0012).
        openBelow:
          type: integer
          minimum: 0
          description: Open proposals in the branch of a `concept` or `spec` proposal other than itself (ADR 0010), as in contracts/openapi.yaml; 0 or absent for other proposals.
        originDetail:
          description: Set exactly when `origin` is `document`; same shape as `OriginDetail` in contracts/openapi.yaml.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [fileName, mediaType, sentenceIndex]
              properties:
                sentenceIndex:
                  type: integer
                  minimum: 0
                  maximum: 1999
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[^/\\:\x00-\x1f\x7f-\x9f\u200b-\u200f\u2028\u2029\u202a-\u202e\u061c\u2066-\u2069\ufeff]{1,255}$'
                  description: Basename only, at most 1020 bytes in UTF-8, no bidirectional controls, zero-width characters (U+200B to U+200D) or line and paragraph separators (U+2028, U+2029); HTML-escaped wherever interpolated, rendered as text.
                mediaType:
                  type: string
                  enum: [text/plain, text/markdown, text/csv, application/json, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/html]
                position:
                  type: object
                  additionalProperties: false
                  required: [unit, index]
                  properties:
                    unit:
                      type: string
                      enum: [page, paragraph, slide, sheet]
                    index:
                      type: integer
                      minimum: 1
                      maximum: 100000
                    row:
                      type: integer
                      minimum: 1
                      maximum: 1048576
                      description: Only with `unit` `sheet`.
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [concept, spec, relation, source, bind, attr, change]
        changeKind:
          type: [string, 'null']
          description: As `Proposal.changeKind` in contracts/openapi.yaml, including `create_domain`, `edit_domain`, `delete_domain`, `move_concept_domain` and `delete_bulk` (ADR 0015).
        revision:
          type: integer
          minimum: 0
          description: Incremented by every in-place edit of a pending draft (ADR 0015).
        state:
          type: string
          enum: [pending, half_approved, approved, rejected]
        title:
          type: string
        heading:
          type: string
        color:
          type: string
        companyId:
          type: [string, 'null']
        domainProductId:
          type: [string, 'null']
        parentLabel:
          type: [string, 'null']
        deps:
          type: array
          items:
            type: string
        ready:
          type: boolean
        waitFor:
          type: [string, 'null']
        html:
          type: string
          description: Server-generated; every interpolated label is HTML-escaped and only `<b>`, `<i>` and `<span class="...">` may appear. Rendered by the Studio with those tags allow-listed.
        why:
          type: [string, 'null']
        caption:
          type: [string, 'null']
        conceptId:
          type: [string, 'null']
        relationId:
          type: [string, 'null']
        relationIds:
          type: array
          items:
            type: string
        sourceId:
          type: [string, 'null']
        bindingIds:
          type: array
          items:
            type: string
        attributeId:
          type: [string, 'null']
        proposer:
          $ref: '#/components/schemas/Actor'
        approvals:
          type: array
          items:
            type: object
            properties:
              ordinal:
                type: integer
              userId:
                type: string
              userName:
                type: string
              approvedAt:
                type: string
                format: date-time
        bulk:
          type: boolean
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']

    Concept:
      type: object
      description: Same shape as `Concept` in contracts/openapi.yaml.
      required: [id, companyId, kind, label, sub, pending, conflict, bornAt, x, y, pinned]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [root, concept]
        label:
          type: string
        sub:
          type: string
        domainProductId:
          type: [string, 'null']
        domainKey:
          type: [string, 'null']
        color:
          type: string
        rule:
          type: [string, 'null']
        pending:
          type: boolean
        conflict:
          type: boolean
        parentId:
          type: [string, 'null']
        birthRelationId:
          type: [string, 'null']
        bornAt:
          type: string
          format: date-time
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
        bound:
          oneOf:
            - $ref: '#/components/schemas/Binding'
            - type: 'null'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'

    Relation:
      type: object
      description: Same shape as `Relation` in contracts/openapi.yaml.
      required: [id, aId, bId, kind, label, rest, seed, pending]
      properties:
        id:
          type: string
          format: uuid
        aId:
          type: string
          format: uuid
        bId:
          type: string
          format: uuid
        aLabel:
          type: string
        bLabel:
          type: string
        kind:
          type: string
          enum: [rel, isa, same, clash]
        label:
          type: string
        rest:
          type: number
        seed:
          type: number
        pending:
          type: boolean
        dyingAt:
          type: [string, 'null']
        companyIds:
          type: array
          items:
            type: string
            format: uuid

    Source:
      type: object
      description: Same shape as `Source` in contracts/openapi.yaml.
      required: [id, kind, companyId, label, kindText, anchorIndex, disabled, pending, x, y, pinned]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: source
        companyId:
          type: string
          format: uuid
        label:
          type: string
        kindText:
          type: string
        connectorCode:
          type: [string, 'null']
        host:
          type: [string, 'null']
        scope:
          type: [string, 'null']
        auth:
          type: [string, 'null']
        refresh:
          type: string
        anchorIndex:
          type: integer
        disabled:
          type: boolean
        pending:
          type: boolean
        x:
          type: number
        y:
          type: number
        pinned:
          type: boolean
        dyingAt:
          type: [string, 'null']
        feeds:
          type: integer
        records:
          type: [integer, 'null']
        state:
          type: string

    Binding:
      type: object
      description: Same shape as `Binding` in contracts/openapi.yaml.
      required: [id, kind, sourceId, sourceLabel, conceptId, records, fresh, pending]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: bind
        seed:
          type: [number, 'null']
          minimum: 0
          exclusiveMaximum: 1
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        conceptId:
          type: string
          format: uuid
        records:
          type: integer
        fresh:
          type: string
        pending:
          type: boolean

    Attribute:
      type: object
      description: Same shape as `Attribute` in contracts/openapi.yaml.
      required: [id, conceptId, name, type, col, fill, state]
      properties:
        id:
          type: string
          format: uuid
        conceptId:
          type: string
          format: uuid
        sourceId:
          type: [string, 'null']
        name:
          type: string
        type:
          type: string
          enum: [id, text, number, ref, date]
        col:
          type: [string, 'null']
          description: Null for a taught attribute.
        fill:
          type: [integer, 'null']
          description: Null for a taught attribute.
        value:
          type: [string, 'null']
          maxLength: 200
          description: A taught attribute's value (decision row 130); null for an attribute read from a source. Rendered as text.
        state:
          type: string
          enum: [proposed, approved]

    DomainProduct:
      type: object
      description: Same shape as `DomainProduct` in contracts/openapi.yaml.
      required: [id, companyId, key, name, owner, color, revision, version, hidden]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        owner:
          type: string
        color:
          type: string
        revision:
          type: integer
        version:
          type: string
        hidden:
          type: boolean

    Company:
      type: object
      description: Same shape as `Company` in contracts/openapi.yaml.
      required: [id, key, name, sub, position, isHome, rootId, domainProducts]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        sub:
          type: string
        position:
          type: integer
        isHome:
          type: boolean
        rootId:
          type: string
          format: uuid
        domainProducts:
          type: array
          items:
            $ref: '#/components/schemas/DomainProduct'

    AuditEntry:
      type: object
      description: Same shape as `AuditEntry` in contracts/openapi.yaml.
      required: [id, at, actor, kind, what, ok, companyIds, origin]
      properties:
        origin:
