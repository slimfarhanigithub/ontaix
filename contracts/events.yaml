    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      proposalRejected:
        $ref: '#/components/messages/ProposalRejected'
  conceptBorn:
    address: ontaix.{tenantId}.concept.born
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      conceptBorn:
        $ref: '#/components/messages/ConceptBorn'
  conceptChanged:
    address: ontaix.{tenantId}.concept.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      conceptChanged:
        $ref: '#/components/messages/ConceptChanged'
  conceptDying:
    address: ontaix.{tenantId}.concept.dying
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      conceptDying:
        $ref: '#/components/messages/ConceptDying'
  conceptConflict:
    address: ontaix.{tenantId}.concept.conflict
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      conceptConflict:
        $ref: '#/components/messages/ConceptConflict'
  relationCreated:
    address: ontaix.{tenantId}.relation.created
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      relationCreated:
        $ref: '#/components/messages/RelationCreated'
  relationChanged:
    address: ontaix.{tenantId}.relation.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      relationChanged:
        $ref: '#/components/messages/RelationChanged'
  relationRemoved:
    address: ontaix.{tenantId}.relation.removed
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      relationRemoved:
        $ref: '#/components/messages/RelationRemoved'
  sourceCreated:
    address: ontaix.{tenantId}.source.created
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
