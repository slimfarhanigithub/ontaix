        $ref: '#/components/parameters/tenantId'
    messages:
      settingsChanged:
        $ref: '#/components/messages/SettingsChanged'
  appearanceChanged:
    address: ontaix.{tenantId}.appearance.changed
    x-ontaix-visibility: model.read
    x-ontaix-audience: tenant
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      appearanceChanged:
        $ref: '#/components/messages/AppearanceChanged'
  crossCompanyDisabled:
    address: ontaix.{tenantId}.settings.cross_company_disabled
    x-ontaix-visibility: model.read
