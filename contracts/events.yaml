        $ref: '#/components/messages/ProposalHalfApproved'
  proposalApproved:
    address: ontaix.{tenantId}.proposal.approved
    x-ontaix-visibility: model.read
    x-ontaix-audience: companies
    parameters:
      tenantId:
        $ref: '#/components/parameters/tenantId'
    messages:
      proposalApproved:
        $ref: '#/components/messages/ProposalApproved'
  proposalRejected:
